# The Nether. Same world folder as the overworld (mounted at /app/world via the
# compose volume subpath); BlueMap resolves the nether region from the dimension
# id. Renders only once the nether has been generated/visited.
world: "/app/world"
dimension: "minecraft:the_nether"
name: "Nether"
sorting: 10

# The Nether is fully enclosed (no sky), so BlueMap's default cave-removal would
# hide almost everything. Push the threshold very low to render all "caves".
remove-caves-below-y: -10000

# Cut the bedrock ceiling (y 90-127) so the map shows the playable tunnels,
# not the roof. (Per BlueMap's render-mask; structures above stay visible.)
render-mask: [
  {
    subtract: true
    min-y: 90
    max-y: 127
  }
]

ambient-light: 0.6
sky-color: "#2a0a0a"
