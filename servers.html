        try {
          const full = await dbGetProfile(id, P.editId)
          P.values = { ...(full?.settings || {}) }
        } catch (e) { setErr(e.message); P.values = {} }
        renderProfiles()
      }

      function profFieldHtml(f) {
        const v = P.values[f.key]
        const lid = `prof-${id}-${f.key}`
        const lbl = `<label for="${lid}">${esc(f.label)}</label>`
        const help = f.help ? `<div class="field-help">${esc(f.help)}</div>` : ''
        if (f.type === 'info') {
          // Read-only documentation row (no input, never collected on save).
          const body = (f.help || '').split('\n').map(esc).join('<br>')
          return `<div class="prof-info"><b>${esc(f.label)}</b><div class="field-help">${body}</div></div>`
        }
        if (f.type === 'select') {
          // CS map field: a by-name pick-list (Workshop maps show their name, not
          // ws:id) plus an inline "add a Workshop map by id + name" form.
          if (f.addWorkshop) {
            const opts = [...(f.options || [])]
            if (v != null && v !== '' && !opts.some(o => String(o.value) === String(v))) {
              const fb = String(v).startsWith('ws:') ? `Workshop ${String(v).slice(3)}` : String(v)
              opts.unshift({ value: v, label: fb })
            }
            const optsHtml = opts.map(o =>
              `<option value="${esc(o.value)}"${String(o.value) === String(v) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')
            const isWs = String(v ?? '').startsWith('ws:')
            return lbl + `
              <div class="mapcat" data-mapcat="${esc(f.key)}">
                <div class="inline">
                  <select id="${lid}" data-pf="${esc(f.key)}" data-pt="text">${optsHtml}</select>
                  <button type="button" class="mini-btn" data-mc-toggle>＋ Workshop Map</button>
                  <button type="button" class="mini-btn x" data-mc-remove title="Remove the selected Workshop map from your list"${isWs ? '' : ' disabled'}>Remove</button>
                </div>
                <div class="mc-add" data-mc-add style="display:none">
                  <input type="text" data-mc-id placeholder="Workshop ID (digits)" inputmode="numeric" />
                  <input type="text" data-mc-name placeholder="Name (e.g. Assembly)" />
                  <button type="button" class="mini-btn" data-mc-save>Add</button>
                  <button type="button" class="mini-btn" data-mc-cancel>Cancel</button>
                </div>
              </div>` + help
          }
          // `custom` selects are combo inputs: pick a suggestion or type a value
          // (e.g. a collection map name that hasn't downloaded yet).
          if (f.custom) {
            const dlid = `dl-${id}-${f.key}`
            const opts = (f.options || []).map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')
            return lbl + `<input id="${lid}" data-pf="${esc(f.key)}" data-pt="text" type="text" list="${dlid}" value="${esc(v ?? '')}" placeholder="map name" autocomplete="off" /><datalist id="${dlid}">${opts}</datalist>` + help
          }
          const opts = (f.options || []).map(o =>
            `<option value="${esc(o.value)}"${String(o.value) === String(v) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')
          return lbl + `<select id="${lid}" data-pf="${esc(f.key)}" data-pt="select">${opts}</select>` + help
        }
        if (f.type === 'bool') {
          const on = v === '1' || v === 1 || v === true
          return lbl + `<input id="${lid}" data-pf="${esc(f.key)}" data-pt="bool" type="checkbox" class="switch"${on ? ' checked' : ''} />` + help
        }
        if (f.type === 'textarea') {
          return lbl + `<textarea id="${lid}" data-pf="${esc(f.key)}" data-pt="text" class="cfg" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>${esc(v ?? '')}</textarea>` + help
        }
        if (f.type === 'maplist') {
          return `<label class="ml-label">${esc(f.label)}</label>`
            + `<div class="maplist" data-pf="${esc(f.key)}" data-pt="maplist">${maplistHtml(f)}</div>` + help
        }
        if (f.type === 'mapsync') {
          // action button (not a settings value) — installs collection maps into the list
          return `<label class="ml-label">${esc(f.label)}</label>`
            + `<div class="maplist"><button type="button" class="retro-btn" data-mapsync>⟳ Sync from Collection</button></div>` + help
        }
        const attrs = [
          f.min != null ? `min="${f.min}"` : '',
          f.max != null ? `max="${f.max}"` : '',
          f.step != null ? `step="${f.step}"` : '',
          f.placeholder ? `placeholder="${esc(f.placeholder)}"` : '',
        ].filter(Boolean).join(' ')
        const type = f.type === 'number' ? 'number' : 'text'
        return lbl + `<input id="${lid}" data-pf="${esc(f.key)}" data-pt="${type}" type="${type}" value="${esc(v ?? '')}" ${attrs} />` + help
      }

      function maplistHtml(f) {
        const arr = Array.isArray(P.values[f.key]) ? P.values[f.key] : []
        const rows = arr.length
          ? arr.map((m, i) => `
              <div class="maplist-row">
                <span class="mi-idx">${i + 1}</span>
                <span class="mi-name" title="${esc(m)}">${esc(m)}</span>
                ${i === 0 ? '<span class="mi-boot" title="the server boots into this map">start</span>' : ''}
                <button type="button" class="mini-btn" data-ml-up="${i}"${i === 0 ? ' disabled' : ''}>↑</button>
                <button type="button" class="mini-btn" data-ml-down="${i}"${i === arr.length - 1 ? ' disabled' : ''}>↓</button>
                <button type="button" class="mini-btn x" data-ml-del="${i}">✕</button>
              </div>`).join('')
          : `<div class="maplist-empty">No maps in rotation yet.</div>`
        const addable = f.options || []
        const dlOpts = addable.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')
        const grouped = addable.some(o => o.group)
        let addControl
        if (grouped) {
          // categorized pick-list (e.g. TTT: Stock vs Collection)
          const byGroup = {}
          addable.forEach(o => { (byGroup[o.group || 'Other'] ??= []).push(o) })
          const groupsHtml = Object.entries(byGroup).map(([g, opts]) =>
            `<optgroup label="${esc(g)}">${opts.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</optgroup>`).join('')
          addControl = `<select data-ml-pick>${groupsHtml || '<option value="">(no maps)</option>'}</select>`
        } else if (f.custom) {
          // `custom` maplists let you type any map name (not-yet-downloaded maps)
          addControl = `<input type="text" data-ml-pick list="mldl-${id}-${f.key}" placeholder="add a map by name…" autocomplete="off" /><datalist id="mldl-${id}-${f.key}">${dlOpts}</datalist>`
        } else {
          addControl = `<select data-ml-pick${addable.length ? '' : ' disabled'}>${addable.length ? dlOpts : '<option value="">(no maps discovered)</option>'}</select>`
        }
        return `
          <div class="maplist-rows">${rows}</div>
          <div class="maplist-add">
            ${addControl}
            <button type="button" class="mini-btn" data-ml-add${grouped || f.custom || addable.length ? '' : ' disabled'}>＋ Add</button>
          </div>`
      }

      function renderProfiles() {
        const opts = P.list.length
          ? P.list.map(p =>
              `<option value="${esc(p.id)}"${p.id === P.editId ? ' selected' : ''}>${esc(p.name)}${p.id === P.activeId ? ' ✓' : ''}</option>`).join('')
          : '<option value="">(no profiles)</option>'
        const isActive = P.editId != null && P.editId === P.activeId
        const groups = (P.schema.groups || []).map((g, gi) => `
          <details class="prof-group"${gi === 0 ? ' open' : ''}>
            <summary>${esc(g.title)}</summary>
            <div class="prof-grid">${(g.fields || []).map(profFieldHtml).join('')}</div>
          </details>`).join('')

        profBody.innerHTML = `
          <div class="pf-toolbar">
            <div class="pf-select">
              <span class="pf-lbl">Profile</span>
              <select data-prof-pick>${opts}</select>
              <span class="prof-active${isActive ? '' : ' off'}">${isActive ? '● live' : '○ not applied'}</span>
            </div>
            <div class="pf-manage">
              <button class="mini-btn" data-prof-new title="Create a new profile from defaults">＋ New</button>
              <button class="mini-btn" data-prof-saveas title="Save the current edits as a new profile">⎘ Duplicate</button>
              <button class="mini-btn" data-prof-capture title="Save the server's current live config as a new profile">⤓ Capture</button>
              <button class="mini-btn x" data-prof-delete title="Delete this profile">🗑 Delete</button>
            </div>
          </div>
          <div class="pf-groups">${groups}</div>
          <div class="pf-actions">
            <div class="pf-actions-btns">
              <button class="retro-btn primary" data-prof-apply title="Save your edits, write them as the live startup config, and restart to load them">▶ Apply &amp; Restart</button>
              <button class="retro-btn" data-prof-save title="Save your edits to this profile (no restart)">Save</button>
            </div>
            <div class="pf-actions-note">${P.schema.note ? esc(P.schema.note) + ' ' : ''}<b>Save</b> stores your edits · <b>Apply &amp; Restart</b> writes them live and reboots the server to load them.</div>
          </div>`

        wireProfileEvents()
      }

      // Pull every plain input back into P.values (maplists already live there).
      function readProfileForm() {
        profBody.querySelectorAll('[data-pf]').forEach(el => {
          const key = el.dataset.pf, t = el.dataset.pt
          if (t === 'maplist') return
          if (t === 'bool') P.values[key] = el.checked ? '1' : '0'
          else if (t === 'number') P.values[key] = el.value === '' ? '' : Number(el.value)
          else P.values[key] = el.value
        })
        return P.values
      }

      function wireProfileEvents() {
        const pick = profBody.querySelector('[data-prof-pick]')
        if (pick) pick.addEventListener('change', () => openProfile(pick.value))

        const onClick = (sel, fn) => { const b = profBody.querySelector(sel); if (b) b.addEventListener('click', () => fn(b)) }
        const curName = () => (P.list.find(p => p.id === P.editId)?.name) || 'profile'

        onClick('[data-prof-save]', (b) => withBtn(b, 'Save profile', async () => {
          if (P.editId == null) return
          readProfileForm()
          await dbUpdateProfile(id, P.editId, { settings: P.values })
          logLine(`Profile "${curName()}" saved ✓`)
          await reloadProfileList(P.editId)
        }).catch(() => {}))

        onClick('[data-prof-apply]', (b) => {
          if (P.editId == null) return
          if (!confirm('Apply this profile and restart the server now?\n\nThe server reloads with this config and briefly disconnects any players.')) return
          withBtn(b, 'Apply & restart', async () => {
            // persist pending edits, write the startup config, then restart so it
            // fully takes effect (collection download/mount happens at boot).
            readProfileForm()
            await dbUpdateProfile(id, P.editId, { settings: P.values })
            const r = await dbApplyProfile(id, P.editId)
            logLine(`Applied "${r?.name}" ✓ — restarting to load it…`)
            await dbServerAction(id, 'reboot')
            await new Promise(res => setTimeout(res, 2500))
            await refresh()
            logLine(`Restarted ✓ — now running "${r?.name}"`)
            await reloadProfileList(P.editId)
          }).catch(() => {})
        })

        onClick('[data-prof-new]', (b) => {
          const name = (prompt('Name for the new profile:') || '').trim()
          if (!name) return
          withBtn(b, 'New profile', async () => {
            const p = await dbCreateProfile(id, name) // seeded from connector defaults
            logLine(`Created profile "${p.name}" ✓`)
            await reloadProfileList(p.id)
          }).catch(() => {})
        })

        onClick('[data-prof-saveas]', (b) => {
          const name = (prompt('Duplicate this profile — name the copy:') || '').trim()
          if (!name) return
          withBtn(b, 'Duplicate', async () => {
            readProfileForm()
            const p = await dbCreateProfile(id, name, P.values)
            logLine(`Duplicated as "${p.name}" ✓`)
            await reloadProfileList(p.id)
          }).catch(() => {})
        })

        onClick('[data-prof-capture]', (b) => {
          const name = (prompt('Capture the server’s current live config as a profile named:') || '').trim()
          if (!name) return
          withBtn(b, 'Capture', async () => {
            const p = await dbCaptureProfile(id, name)
            logLine(`Captured current config as "${p.name}" ✓`)
            await reloadProfileList(p.id)
          }).catch(() => {})
        })

        onClick('[data-prof-delete]', (b) => {
          if (P.editId == null) return
          const name = curName()
          if (!confirm(`Delete profile "${name}"? This can't be undone.`)) return
          withBtn(b, 'Delete profile', async () => {
            await dbDeleteProfile(id, P.editId)
            logLine(`Deleted profile "${name}" ✓`)
            P.editId = null
            await reloadProfileList()
          }).catch(() => {})
        })

        // field widgets that need their own wiring
        ;(P.schema.groups || []).forEach(g => (g.fields || []).forEach(f => {
          if (f.type === 'maplist') wireMaplist(f)
          if (f.type === 'select' && f.addWorkshop) wireMapCatalog(f)
        }))

        // Sync maps from collection → installs them into the single maps source,
        // then refresh the schema's map options (keeping current edits).
        profBody.querySelector('[data-mapsync]')?.addEventListener('click', (e) => {
          const btn = e.currentTarget
          withBtn(btn, 'Sync maps', async () => {
            readProfileForm()
            const r = await dbSyncServerMaps(id)
            P.schema = await dbGetProfileSchema(id)
            renderProfiles()
            logLine(`Synced maps from collection ✓ — ${(r?.maps || []).length} installed`)
          }).catch(() => {})
        })
      }

      // CS map field: the "＋ Workshop Map" inline form adds a Workshop map to the
      // saved catalog (so it shows by name) and selects it; "Remove" deletes the
      // selected Workshop map from the catalog.
      function wireMapCatalog(f) {
        const wrap = [...profBody.querySelectorAll('.mapcat')].find(w => w.dataset.mapcat === f.key)
        if (!wrap) return
        const sel = wrap.querySelector('select[data-pf]')
        const addBox = wrap.querySelector('[data-mc-add]')
        const idEl = wrap.querySelector('[data-mc-id]')
        const nameEl = wrap.querySelector('[data-mc-name]')
        const removeBtn = wrap.querySelector('[data-mc-remove]')
        const showAdd = (on) => { addBox.style.display = on ? 'flex' : 'none'; if (on) { idEl.value = ''; nameEl.value = ''; idEl.focus() } }
        // Remove is only valid for a Workshop (ws:) map; keep it in sync with the select.
        const syncRemove = () => { if (removeBtn) removeBtn.disabled = !String(sel.value || '').startsWith('ws:') }
        sel.addEventListener('change', syncRemove)
        syncRemove()

        wrap.querySelector('[data-mc-toggle]')?.addEventListener('click', () => showAdd(addBox.style.display === 'none'))
        wrap.querySelector('[data-mc-cancel]')?.addEventListener('click', () => showAdd(false))
        const save = wrap.querySelector('[data-mc-save]')
        save?.addEventListener('click', () => {
          const wsId = (idEl.value || '').trim(), nm = (nameEl.value || '').trim()
          if (!/^\d{1,20}$/.test(wsId)) { setErr('Workshop ID must be digits'); return }
          if (!nm) { setErr('Give the map a name'); return }
          withBtn(save, 'Add workshop map', async () => {
            await dbAddServerMap(id, wsId, nm)            // persist to the catalog
            const val = `ws:${wsId}`
            let opt = [...sel.options].find(o => o.value === val)
            if (!opt) { opt = document.createElement('option'); opt.value = val; sel.appendChild(opt) }
            opt.textContent = nm; sel.value = val; P.values[f.key] = val
            showAdd(false); syncRemove()
            logLine(`Added workshop map "${nm}" (${wsId}) ✓`)
          }).catch(() => {})
        })

        removeBtn?.addEventListener('click', () => {
          const val = String(sel.value || '')
          if (!val.startsWith('ws:')) return
          const wsId = val.slice(3)
          const opt = [...sel.options].find(o => o.value === val)
          const label = opt ? opt.textContent : `Workshop ${wsId}`
          if (!confirm(`Remove "${label}" from your Workshop map list?\n\nThis only removes it from the picker — it doesn't unsubscribe on Steam or change a running server.`)) return
          withBtn(removeBtn, 'Remove workshop map', async () => {
            // 404 = wasn't in the catalog (a fallback entry) — drop it locally anyway.
            try { await dbDeleteServerMap(id, wsId) } catch (e) { if (e.status !== 404) throw e }
            opt?.remove()
            sel.value = sel.options[0]?.value || ''
            P.values[f.key] = sel.value
            syncRemove()
            logLine(`Removed workshop map "${label}" ✓`)
          }).catch(() => {})
        })
      }

      function wireMaplist(f) {
        const wrap = [...profBody.querySelectorAll('.maplist')].find(w => w.dataset.pf === f.key)
        if (!wrap) return
        const arr = () => (Array.isArray(P.values[f.key]) ? P.values[f.key] : (P.values[f.key] = []))
        const rerender = () => { wrap.innerHTML = maplistHtml(f); wireMaplist(f) }
        wrap.querySelectorAll('[data-ml-up]').forEach(b => b.addEventListener('click', () => {
          const i = Number(b.dataset.mlUp); const a = arr(); [a[i - 1], a[i]] = [a[i], a[i - 1]]; rerender()
        }))
        wrap.querySelectorAll('[data-ml-down]').forEach(b => b.addEventListener('click', () => {
          const i = Number(b.dataset.mlDown); const a = arr(); [a[i + 1], a[i]] = [a[i], a[i + 1]]; rerender()
        }))
        wrap.querySelectorAll('[data-ml-del]').forEach(b => b.addEventListener('click', () => {
          arr().splice(Number(b.dataset.mlDel), 1); rerender()
        }))
        const add = wrap.querySelector('[data-ml-add]')
        if (add) add.addEventListener('click', () => {
          const picked = (wrap.querySelector('[data-ml-pick]')?.value || '').trim()
          if (!picked) return
          if (!/^[a-z0-9_]{1,64}$/.test(picked)) { setErr(`invalid map name: ${picked}`); return }
          setErr(''); arr().push(picked); rerender()
        })
      }

      async function loadSettings() {
        let data
        try {
          data = await dbGetServerSettings(id)
        } catch { return panelReady(qs, false) }
        if (!data) return panelReady(qs, false)

        // Counter-Strike and GMOD use the generic Profiles panel for startup
        // config; their getSettings only returns the map block (for the live
        // change-map), so this falls through to the no-op below.

        if (!data.fields?.length && !data.sections?.length) return panelReady(qs, false)

        if (data.sections?.length) {
          // Multi-section layout (e.g. Factorio): replace panel content dynamically.
          qs.innerHTML = '<div class="panel-title">Quick Settings</div>' +
            data.sections.map((sec, i) =>
              `${i > 0 ? '<div class="qs-sep"></div>' : ''}
              <div class="qs-section" data-qs-section="${esc(sec.key)}">
                <div class="qs-section-title">${esc(sec.title)}</div>
                <div class="qs-fields">${sec.fields.map(f => renderField(id, f)).join('')}</div>
                <div class="panel-row">
                  <button class="retro-btn" data-qs-save>${esc(sec.saveLabel || 'Save')}</button>
                </div>
              </div>`
            ).join('') +
            (data.note ? `<div class="qs-note-block">${esc(data.note)}</div>` : '')

          panelReady(qs)

          qs.querySelectorAll('[data-qs-section]').forEach(secEl => {
            const sectionKey = secEl.dataset.qsSection
            secEl.querySelector('[data-qs-save]').addEventListener('click', async () => {
              const values = { section: sectionKey }
              secEl.querySelectorAll('[data-qs-key]').forEach(el => {
                values[el.dataset.qsKey] = el.type === 'number' ? Number(el.value) : el.value
              })
              if (sectionKey === 'saveAs') {
                if (!confirm(`Save current world as "${values.saveName}"?\n\nIf a save with this name already exists it will be overwritten.`)) return
              }
              const secLabel = secEl.querySelector('[data-qs-save]').textContent.trim()
              withBtn(secEl.querySelector('[data-qs-save]'), secLabel, async () => {
                const res = await dbSaveServerSettings(id, values)
                if (res?.steps) logLine(`${secLabel} ✓`, formatUpdate(res))
                else logLine(`${secLabel} ✓ — restart the server to apply`)
                if (res?.ok === false) setErr('operation failed — see console')
              }).catch(() => {})
            })
          })
          return
        }

        // Single-section path (legacy generic fields)
        qsNote.textContent = data.note || ''
        qsFields.innerHTML = data.fields.map(f => renderField(id, f)).join('')

        // mark loaded and let updateStatus decide visibility
        panelReady(qs)
      }

      qsSave.addEventListener('click', async () => {
        const values = {}
        qsFields.querySelectorAll('[data-qs-key]').forEach(el => {
          values[el.dataset.qsKey] = el.type === 'number' ? Number(el.value) : el.value
        })
        setErr(''); qsSave.disabled = true
        try {
          await dbSaveServerSettings(id, values)
          showOut('settings saved ✓ — restart the server to apply')
        } catch (e) { setErr(e.message) } finally { qsSave.disabled = false }
      })

      // Profiles (startup config) and Quick Settings (operations like Save As /
      // Generate) are independent panels — a game can have one, the other, or both.
      // Run both; each gates its own visibility (empty schema / no sections → no-op).
      loadProfiles()
      loadSettings()
      loadLive()
      loadBackups()

      // Pull this server's fresh status on mount so the panel gates use current
      // data, not the cached page-load snapshot (else e.g. Minecraft's panel could
      // stay hidden until you switch tabs and back). One light per-server call.
      ;(async () => {
        try {
          const fresh = await dbGetServerStatus(id)
          const i = servers.findIndex(x => x.id === id)
          if (i >= 0) servers[i] = { ...servers[i], ...fresh }
          updateStatus(root, servers[i] ?? fresh)
          renderTopFromState()
        } catch {}
      })()

    }

    function updateStatus(root, s) {
      const { cls, label, meta } = statusBits(s)
      root.querySelector('.dot').className = `dot ${cls}`
      root.querySelector('.status .label').textContent = label
      root.querySelector('.status .meta').innerHTML = meta

      // Container power model: a single-purpose game container IS the game, so the
      // controls are just container power — running → Restart/Stop/Force-Stop;
      // stopped → Start. Refresh is always available.
      const gs = s.gameStatus    // still used by the panel-visibility gates below
      const running = s.status === 'running'
      const show = (...keys) => keys.forEach(k => { const b = root.querySelector(`[data-act="${k}"]`); if (b) b.style.display = '' })
      const hide = (...keys) => keys.forEach(k => { const b = root.querySelector(`[data-act="${k}"]`); if (b) b.style.display = 'none' })
      if (running) { show('reboot', 'shutdown', 'stop', 'refresh'); hide('start') }
      else { show('start', 'refresh'); hide('reboot', 'shutdown', 'stop') }

      // A panel is visible when its status gate matches AND it's either loaded or
      // still loading (so the "Loading…" placeholder shows in place, not blank).
      const ready = (el) => el && (el.dataset.loaded === '1' || el.dataset.loading === '1')

      // Profiles edit the startup config, so they're usable whenever the VM is up
      // (idle or hosting) — configure first, then Start/Restart Hosting to apply.
      const prof = root.querySelector('[data-profiles]')
      if (prof) prof.style.display = (s.status === 'running' && ready(prof)) ? 'block' : 'none'

      // settings panel only when hosting and populated
      const qs = root.querySelector('[data-quickset]')
      if (qs) qs.style.display = (gs === 'hosting' && ready(qs)) ? 'block' : 'none'
      const rt = root.querySelector('[data-runtime]')
      if (rt) rt.style.display = (gs === 'hosting' && ready(rt)) ? 'block' : 'none'
      // backups need only the VM up (guest agent + files), not the game process.
      const bk = root.querySelector('[data-backups]')
      if (bk) bk.style.display = (s.status === 'running' && ready(bk)) ? 'block' : 'none'

      // raw config files: editable whenever the VM is up.
      const rawcfg = root.querySelector('[data-rawcfg]')
      if (rawcfg) rawcfg.style.display = (s.status === 'running') ? 'block' : 'none'

      // Each grouping section (Configuration / Runtime / Backups) shows only when
      // at least one of its panels is visible — no empty bordered headers.
      root.querySelectorAll('[data-section]').forEach(sec => {
        const anyVisible = [...sec.querySelectorAll('.panel')].some(p => p.style.display !== 'none')
        sec.style.display = anyVisible ? '' : 'none'
      })
    }

    function formatUpdate(res) {
      if (!res?.steps) return JSON.stringify(res, null, 2)
      return res.steps.map(st => {
        const head = `── ${st.name} (exit ${st.exitCode}) ──`
        return [head, st.stdout, st.stderr && `[stderr]\n${st.stderr}`].filter(Boolean).join('\n')
      }).join('\n\n')
    }
  </script>

</body>
</html>
