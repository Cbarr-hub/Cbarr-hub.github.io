<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>gamertown // fleet</title>
<style>
/* ============================================================
   FOCUS — "ride screen" control panel
   one server is the hero. others live in a slim switcher.
   ============================================================ */

:root{
  /* grounds */
  --bg:        #0a0a0a;
  --bg-1:      #111111;
  --bg-2:      #161616;
  --bg-3:      #1d1d1d;
  --bg-4:      #242424;
  /* borders */
  --line:      #2a2a2a;
  --line-2:    #333333;
  /* text */
  --ink:       #d4d4b8;
  --ink-dim:   #8a8a7a;
  --ink-faint: #5a5a50;
  /* status */
  --green:     #7bb85f;
  --hot:       #42F527;
  --amber:     #c2a13a;
  --red:       #ff7777;
  --red-deep:  #b85f5f;
  --grey:      #555550;
  /* one refined accent: cool cyan for interactive focus / data */
  --accent:    #5fd0d0;
  /* type scale (1.25 ratio off 13px) */
  --t-xs:  11px;
  --t-sm:  13px;
  --t-md:  16px;
  --t-lg:  20px;
  --t-xl:  26px;
  --t-2xl: 34px;
  --t-3xl: 52px;
  --t-hero:84px;
  /* spacing scale */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r: 10px;  --r-lg: 16px; --r-pill: 999px;
  --mono: "SF Mono","JetBrains Mono","Fira Code","Courier New",ui-monospace,monospace;
  --shadow: 0 8px 40px rgba(0,0,0,.6);
  --tap: 44px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  font-size:var(--t-sm);
  line-height:1.45;
  letter-spacing:.2px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* subtle scanline / CRT veil */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.022) 3px,rgba(0,0,0,0) 4px);
  mix-blend-mode:overlay;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9001;
  background:radial-gradient(ellipse 120% 90% at 50% 0%,rgba(123,184,95,.04),transparent 60%);
}

button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(95,208,208,.3);color:#fff}

/* scrollbars */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===================== LAYOUT SHELL ===================== */
.app{
  display:grid;
  grid-template-columns:300px 1fr;
  height:100dvh;
  height:100vh;
}

/* ---------- LEFT: switcher strip (desktop) ---------- */
.rail{
  background:var(--bg-1);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  min-height:0;
}
.rail__top{
  padding:var(--s5) var(--s5) var(--s4);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;align-items:center;gap:var(--s2);
  font-size:var(--t-sm);letter-spacing:1px;color:var(--ink-dim);
  margin-bottom:var(--s5);
}
.brand b{color:var(--green);font-weight:700;letter-spacing:2px}
.brand .blink{
  width:7px;height:14px;background:var(--hot);display:inline-block;
  animation:blink 1.1s steps(1) infinite;box-shadow:0 0 8px var(--hot);
}
@keyframes blink{50%{opacity:0}}

/* fleet vitals — minimal, big numbers */
.vitals{display:flex;flex-direction:column;gap:var(--s4)}
.vitals__row{display:flex;gap:var(--s3)}
.donut{
  position:relative;width:60px;height:60px;flex:none;
}
.donut svg{transform:rotate(-90deg);display:block}
.donut__c{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.donut__c b{font-size:var(--t-md);color:var(--ink);line-height:1}
.donut__c span{font-size:9px;color:var(--ink-faint);letter-spacing:1px;margin-top:2px}
.fleet-stat{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s2)}
.bar{height:6px;background:var(--bg-3);border-radius:var(--r-pill);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar-row{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-xs)}
.bar-row .lbl{color:var(--ink-faint);width:14px;text-align:center}
.bar-row .val{color:var(--ink-dim);margin-left:auto;font-variant-numeric:tabular-nums}

.tally{display:flex;gap:var(--s2);margin-top:var(--s4)}
.tally__chip{
  flex:1;text-align:center;padding:var(--s3) var(--s2);border-radius:var(--r);
  background:var(--bg-2);border:1px solid var(--line);
}
.tally__chip b{display:block;font-size:var(--t-lg);line-height:1;font-variant-numeric:tabular-nums}
.tally__chip span{font-size:9px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase}
.tally__chip.on b{color:var(--hot)}
.tally__chip.idle b{color:var(--amber)}
.tally__chip.off b{color:var(--grey)}

/* server list in rail */
.rail__list{flex:1;overflow-y:auto;padding:var(--s3) var(--s3) var(--s3);min-height:0}
.swatch{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  padding:var(--s3);border-radius:var(--r);margin-bottom:var(--s2);
  border:1px solid transparent;text-align:left;position:relative;
  transition:background .12s,border-color .12s,transform .08s;
}
.swatch:hover{background:var(--bg-2)}
.swatch:active{transform:scale(.99)}
.swatch.sel{background:var(--bg-2);border-color:var(--line-2)}
.swatch.sel::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;
  background:var(--accent);box-shadow:0 0 10px var(--accent);
}
.swatch__glyph{
  width:38px;height:38px;flex:none;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-3);border:1px solid var(--line);color:var(--ink-dim);
}
.swatch__glyph svg{width:20px;height:20px}
.swatch__body{flex:1;min-width:0}
.swatch__name{
  font-size:var(--t-sm);color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:6px;
}
.swatch__sub{font-size:var(--t-xs);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.hosting{background:var(--hot);box-shadow:0 0 8px var(--hot);animation:pulse 2.4s ease-in-out infinite}
.dot.idle{background:var(--amber)}
.dot.down{background:var(--grey)}
.dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.swatch__spark{width:42px;height:20px;flex:none;opacity:.7}

/* ---------- RIGHT: hero stage ---------- */
.stage{position:relative;min-height:0;overflow-y:auto;overflow-x:hidden}
.stage__inner{
  max-width:880px;margin:0 auto;padding:var(--s6) var(--s6) var(--s8);
  min-height:100%;display:flex;flex-direction:column;
}

/* hero header line */
.hero-head{display:flex;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s5)}
.hero-glyph{
  width:64px;height:64px;flex:none;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--bg-3),var(--bg-2));
  border:1px solid var(--line-2);color:var(--ink);
}
.hero-glyph svg{width:34px;height:34px}
.hero-id{flex:1;min-width:0}
.hero-name{font-size:var(--t-xl);color:#fff;line-height:1.1;letter-spacing:.5px;display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.hero-img{font-size:var(--t-sm);color:var(--ink-faint);margin-top:4px}
.status-pill{
  display:inline-flex;align-items:center;gap:var(--s2);
  padding:5px var(--s3);border-radius:var(--r-pill);
  font-size:var(--t-xs);letter-spacing:1.5px;text-transform:uppercase;
  border:1px solid;
}
.status-pill.hosting{color:var(--hot);border-color:rgba(66,245,39,.4);background:rgba(66,245,39,.07)}
.status-pill.idle{color:var(--amber);border-color:rgba(194,161,58,.4);background:rgba(194,161,58,.07)}
.status-pill.down{color:var(--ink-dim);border-color:var(--line-2);background:var(--bg-2)}
.status-pill.busy{color:var(--accent);border-color:rgba(95,208,208,.4);background:rgba(95,208,208,.07)}

/* refresh ghost btn top-right */
.hero-tools{display:flex;gap:var(--s2);flex:none}
.icon-btn{
  width:var(--tap);height:var(--tap);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--bg-2);color:var(--ink-dim);
  transition:.12s;
}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2);background:var(--bg-3)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== CENTERPIECE: live status ring + key numbers ===== */
.centerpiece{
  display:grid;grid-template-columns:auto 1fr;gap:var(--s6);align-items:center;
  background:linear-gradient(180deg,var(--bg-1),var(--bg));
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s6);margin-bottom:var(--s5);position:relative;overflow:hidden;
}
.centerpiece::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 18% 50%,rgba(66,245,39,.06),transparent 45%);
}
.ring{position:relative;width:180px;height:180px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring__core{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.ring__big{font-size:var(--t-3xl);line-height:1;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.ring__big sup{font-size:var(--t-md);color:var(--ink-dim);vertical-align:super}
.ring__lbl{font-size:var(--t-xs);letter-spacing:2px;color:var(--ink-faint);margin-top:6px;text-transform:uppercase}

/* big stats grid */
.bigstats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.bstat{display:flex;flex-direction:column;gap:6px}
.bstat__top{display:flex;align-items:baseline;gap:6px}
.bstat__top svg{width:16px;height:16px;color:var(--ink-faint);align-self:center}
.bstat__num{font-size:var(--t-2xl);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.bstat__num small{font-size:var(--t-md);color:var(--ink-dim)}
.bstat .bar{margin-top:2px}
.bstat__cap{font-size:var(--t-xs);color:var(--ink-faint)}

/* join string — copyable, prominent */
.joinbar{
  display:flex;align-items:center;gap:var(--s3);
  background:#000;border:1px solid var(--line-2);border-radius:var(--r);
  padding:var(--s3) var(--s3) var(--s3) var(--s4);margin-bottom:var(--s5);
  cursor:pointer;transition:border-color .12s,background .12s;position:relative;
}
.joinbar:hover{border-color:var(--accent)}
.joinbar__prompt{color:var(--accent);flex:none}
.joinbar__txt{
  flex:1;color:var(--ink);font-size:var(--t-md);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-variant-numeric:tabular-nums;
}
.joinbar__copy{
  display:flex;align-items:center;gap:6px;color:var(--ink-dim);flex:none;
  font-size:var(--t-xs);letter-spacing:1px;text-transform:uppercase;
  padding:8px var(--s3);border-radius:7px;border:1px solid var(--line);
}
.joinbar:hover .joinbar__copy{color:var(--ink);border-color:var(--line-2)}
.joinbar__copy svg{width:15px;height:15px}
.joinbar.copied .joinbar__copy{color:var(--hot);border-color:rgba(66,245,39,.4)}

/* ===== PRIMARY ACTION ROW (power) ===== */
/* one obvious primary, rest are quiet */
.power{display:flex;gap:var(--s3);margin-bottom:var(--s5);flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:var(--tap);padding:0 var(--s4);border-radius:var(--r);
  border:1px solid var(--line);background:var(--bg-2);color:var(--ink);
  font-size:var(--t-sm);letter-spacing:.5px;transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:var(--line-2);background:var(--bg-3)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn--primary{
  flex:1;min-width:160px;
  background:linear-gradient(180deg,#1d4d12,#143809);
  border-color:rgba(66,245,39,.5);color:var(--hot);
  font-size:var(--t-md);letter-spacing:1px;font-weight:600;
  box-shadow:0 0 0 1px rgba(66,245,39,.08),0 6px 24px rgba(66,245,39,.12);
}
.btn--primary:hover{background:linear-gradient(180deg,#235c16,#18430b);box-shadow:0 0 0 1px rgba(66,245,39,.2),0 8px 30px rgba(66,245,39,.2)}
.btn--primary.stop{
  background:linear-gradient(180deg,#3a1414,#2a0e0e);border-color:rgba(255,119,119,.4);color:var(--red);
  box-shadow:none;
}
.btn--primary.stop:hover{background:linear-gradient(180deg,#451818,#321010)}
.btn--ghost{background:var(--bg-1);color:var(--ink-dim)}
.btn--danger{color:var(--red-deep);border-color:rgba(184,95,95,.3)}
.btn--danger:hover{color:var(--red);border-color:rgba(255,119,119,.5);background:rgba(184,95,95,.08)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* secondary power cluster (icon-only, revealed sense) */
.power-more{display:flex;gap:var(--s2)}

/* ===== DISCLOSURE TABS (progressive) ===== */
.disclose{margin-top:var(--s2)}
.tabs{
  display:flex;gap:var(--s1);border-bottom:1px solid var(--line);
  margin-bottom:var(--s5);overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s3) var(--s4);color:var(--ink-faint);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
  transition:color .12s;position:relative;
}
.tab svg{width:17px;height:17px}
.tab:hover{color:var(--ink-dim)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab__count{
  font-size:9px;background:var(--bg-3);color:var(--ink-dim);
  padding:1px 6px;border-radius:var(--r-pill);
}
.tab.on .tab__count{background:rgba(95,208,208,.15);color:var(--accent)}

.panel{display:none;animation:fade .18s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* section subhead — minimal, used sparingly */
.shead{
  display:flex;align-items:center;gap:var(--s2);
  font-size:var(--t-xs);letter-spacing:2px;text-transform:uppercase;
  color:var(--ink-faint);margin:var(--s5) 0 var(--s3);
}
.shead:first-child{margin-top:0}
.shead .ln{flex:1;height:1px;background:var(--line)}

/* runtime: quick actions */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 var(--s4);
  border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg-2);
  color:var(--ink-dim);transition:.12s;font-size:var(--t-sm);
}
.chip:hover{color:var(--ink);border-color:var(--line-2);background:var(--bg-3)}
.chip:active{transform:scale(.96)}
.chip svg{width:15px;height:15px}
.chip.toggle.on{color:var(--hot);border-color:rgba(66,245,39,.4);background:rgba(66,245,39,.08)}

/* sliders */
.sliders{display:flex;flex-direction:column;gap:var(--s5);margin-top:var(--s3)}
.slider{display:flex;flex-direction:column;gap:var(--s2)}
.slider__head{display:flex;align-items:center;gap:var(--s2)}
.slider__head svg{width:16px;height:16px;color:var(--ink-faint)}
.slider__head .nm{color:var(--ink-dim);font-size:var(--t-sm)}
.slider__head .vv{margin-left:auto;color:var(--accent);font-variant-numeric:tabular-nums;font-size:var(--t-md)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--r-pill);
  background:var(--bg-3);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--ink);border:3px solid var(--bg);cursor:pointer;
  box-shadow:0 0 0 1px var(--line-2),0 2px 8px rgba(0,0,0,.5);transition:.1s;
}
input[type=range]::-webkit-slider-thumb:hover{background:var(--accent);transform:scale(1.1)}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--ink);
  border:3px solid var(--bg);cursor:pointer;box-shadow:0 0 0 1px var(--line-2);
}

/* change map */
.mapline{display:flex;gap:var(--s2);align-items:center}
.select{
  flex:1;height:var(--tap);border-radius:var(--r);border:1px solid var(--line);
  background:var(--bg-2);color:var(--ink);padding:0 var(--s4);
  font-size:var(--t-sm);appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238a8a7a' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;
}
.select:focus{border-color:var(--accent);outline:none}

/* console */
.console{
  background:#000;border:1px solid var(--line-2);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;
}
.console__out{
  padding:var(--s4);font-size:var(--t-sm);line-height:1.6;
  height:240px;overflow-y:auto;
}
.cline{white-space:pre-wrap;word-break:break-word}
.cline .ts{color:var(--ink-faint)}
.cline.in{color:var(--accent)}
.cline.in .ts{color:rgba(95,208,208,.4)}
.cline.sys{color:var(--ink-dim)}
.cline.ok{color:var(--green)}
.cline.warn{color:var(--amber)}
.console__in{display:flex;align-items:center;gap:var(--s2);border-top:1px solid var(--line);padding:0 var(--s3)}
.console__in .pr{color:var(--hot);flex:none}
.console__in input{
  flex:1;background:none;border:none;outline:none;height:var(--tap);font-size:var(--t-sm);
}
.console__in input::placeholder{color:var(--ink-faint)}
.console__send{color:var(--ink-faint);padding:8px;border-radius:7px}
.console__send:hover{color:var(--accent)}
.console__send svg{width:18px;height:18px}

/* profiles */
.profiles{display:flex;flex-direction:column;gap:var(--s4)}
.prof-pick{display:flex;gap:var(--s2);flex-wrap:wrap}
.prof-tab{
  display:flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s4);
  border-radius:var(--r);border:1px solid var(--line);background:var(--bg-2);color:var(--ink-dim);
  transition:.12s;
}
.prof-tab.on{border-color:var(--accent);color:var(--ink);background:rgba(95,208,208,.06)}
.prof-tab.add{color:var(--ink-faint);border-style:dashed}
.prof-tab svg{width:15px;height:15px}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--t-xs);color:var(--ink-faint);letter-spacing:.5px}
.field input,.field .select{
  height:42px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;
  padding:0 var(--s3);font-size:var(--t-sm);color:var(--ink);width:100%;
}
.field input:focus{border-color:var(--accent);outline:none}
.field--wide{grid-column:1/-1}
.switch{display:flex;align-items:center;gap:var(--s3);height:42px}
.switch__track{
  width:46px;height:26px;border-radius:var(--r-pill);background:var(--bg-3);
  border:1px solid var(--line);position:relative;transition:.15s;flex:none;cursor:pointer;
}
.switch__track::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--ink-dim);transition:.15s;
}
.switch.on .switch__track{background:rgba(66,245,39,.2);border-color:rgba(66,245,39,.4)}
.switch.on .switch__track::after{left:22px;background:var(--hot)}

.maplist{display:flex;flex-direction:column;gap:var(--s2)}
.maprow{

}
.maprow:hover{border-color:var(--line-2);background:var(--bg-2)}
.maprow__idx{color:var(--ink-faint);font-size:var(--t-xs);width:20px;font-variant-numeric:tabular-nums}
.maprow__nm{flex:1;color:var(--ink);font-size:var(--t-sm)}
.maprow.active{border-color:rgba(66,245,39,.3)}
.maprow.active .maprow__nm{color:var(--hot)}
.maprow__tag{font-size:9px;letter-spacing:1px;color:var(--hot);text-transform:uppercase}
.maprow__grip{color:var(--ink-faint);cursor:grab}
.maprow__grip svg{width:16px;height:16px}
.maprow__x{color:var(--ink-faint);padding:6px}
.maprow__x:hover{color:var(--red)}
.maprow__x svg{width:15px;height:15px}

/* raw editor */
.editor{
  background:#000;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;
}
.editor textarea{
  width:100%;height:300px;background:none;border:none;outline:none;resize:vertical;
  padding:var(--s4);font-size:var(--t-sm);line-height:1.6;color:var(--ink);
}
.editor__bar{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-top:1px solid var(--line);background:var(--bg-1)}

/* events feed */

.filter-chip{
  height:34px;padding:0 var(--s3);border-radius:var(--r-pill);border:1px solid var(--line);
  background:var(--bg-1);color:var(--ink-faint);font-size:var(--t-xs);transition:.12s;
  display:inline-flex;align-items:center;gap:6px;
}
.filter-chip.on{color:var(--ink);border-color:var(--line-2);background:var(--bg-2)}
.filter-chip .dot{width:6px;height:6px}
.feed{display:flex;flex-direction:column;gap:var(--s1)}
.event{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s2);
  border-bottom:1px solid var(--line);transition:.12s;
}
.event:hover{background:var(--bg-1)}
.event__av{
  width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-3);border:1px solid var(--line);font-size:var(--t-sm);color:var(--ink);text-transform:uppercase;
}
.event__who{flex:1;min-width:0}
.event__nm{color:var(--ink);font-size:var(--t-sm)}
.event__nm .arrow{color:var(--ink-faint);margin:0 6px}
.event__nm .srv{color:var(--ink-dim)}
.event__meta{font-size:var(--t-xs);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.event__state{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);letter-spacing:1px;
  text-transform:uppercase;flex:none;
}
.event__state.online{color:var(--hot)}
.event__state.left{color:var(--ink-faint)}
.event__dur{font-size:var(--t-sm);color:var(--ink-dim);font-variant-numeric:tabular-nums;flex:none;width:54px;text-align:right}

/* ===== DOWN STATE ===== */
.downstate{
  text-align:center;padding:var(--s7) var(--s5);
  border:1px dashed var(--line-2);border-radius:var(--r-lg);
  background:repeating-linear-gradient(45deg,var(--bg-1),var(--bg-1) 12px,var(--bg) 12px,var(--bg) 24px);
  margin-bottom:var(--s5);
}
.downstate__icon{
  width:72px;height:72px;margin:0 auto var(--s4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--grey);
}
.downstate__icon svg{width:36px;height:36px}
.downstate h3{font-size:var(--t-lg);color:var(--ink-dim);font-weight:400;letter-spacing:1px}
.downstate p{color:var(--ink-faint);font-size:var(--t-sm);margin-top:var(--s2);max-width:340px;margin-inline:auto}

/* toast */
.toast{
  position:fixed;bottom:var(--s5);left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r);
  padding:var(--s3) var(--s5);font-size:var(--t-sm);color:var(--ink);
  display:flex;align-items:center;gap:var(--s2);z-index:9500;box-shadow:var(--shadow);
  opacity:0;transition:.25s cubic-bezier(.2,.8,.2,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast svg{width:16px;height:16px;color:var(--hot)}
.toast.danger svg{color:var(--red)}

/* modal (force-stop confirm) */
.modal{
  position:fixed;inset:0;z-index:9600;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(3px);padding:var(--s5);
}
.modal.show{display:flex;animation:fade .15s}
.modal__box{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-lg);
  padding:var(--s6);max-width:400px;width:100%;box-shadow:var(--shadow);
  border-top:2px solid var(--red-deep);
}
.modal__box h3{font-size:var(--t-lg);color:#fff;font-weight:500;display:flex;align-items:center;gap:var(--s3)}
.modal__box h3 svg{width:24px;height:24px;color:var(--red)}
.modal__box p{color:var(--ink-dim);margin:var(--s4) 0 var(--s6);line-height:1.6}
.modal__box p b{color:var(--ink)}
.modal__actions{display:flex;gap:var(--s3)}
.modal__actions .btn{flex:1}

/* corner design tag */
.dtag{
  position:fixed;right:10px;bottom:8px;z-index:9700;
  font-size:9px;letter-spacing:1px;color:var(--ink-faint);
  background:rgba(10,10,10,.7);padding:3px 8px;border-radius:var(--r-pill);
  border:1px solid var(--line);pointer-events:none;user-select:none;
}
.dtag b{color:var(--accent)}

/* mobile switcher (bottom sheet) — hidden on desktop */
.mob-bar{display:none}
.sheet{display:none}
.mob-vitals{display:none}

  /* mobile top vitals (compact strip) */

/* ===================== STATE ===================== */
let SELECTED = 'mc';
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };

function srv(id){ return SERVERS.find(s=>s.id===id); }
function statusColor(s){ return {hosting:'var(--hot)',idle:'var(--amber)',down:'var(--grey)',busy:'var(--accent)'}[s]; }

/* sparkline path for rail */
function sparkPath(seed){
  let pts=[], v=seed; for(let i=0;i<10;i++){ v += (Math.sin(i*1.7+seed)*0.5+ (Math.random()-.5)*0.3); pts.push(v); }
  const min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1;
  return pts.map((p,i)=>`${i*4.6},${18-((p-min)/rng)*16}`).join(' ');
}

/* ===================== RENDER: RAIL / SHEET ===================== */
function renderList(container, withSpark){
  container.innerHTML='';
  SERVERS.forEach(s=>{
    const b = el('button','swatch'+(s.id===SELECTED?' sel':''));
    b.dataset.id = s.id;
    const sub = s.status==='down'
      ? `<span class="dot down"></span> down · :${s.port}`
      : `<span class="dot ${s.status}"></span> ${s.players!=null?s.players+(s.cap?'/'+s.cap:''):'—'} · ${s.cpu!=null?s.cpu+'%':'—'}`;
    b.innerHTML = `
      <span class="swatch__glyph">${ICONS[s.key]}</span>
      <span class="swatch__body">
        <span class="swatch__name">${s.name}</span>
        <span class="swatch__sub">${sub}</span>
      </span>`;
    if(withSpark && s.status!=='down'){
      const ns='http://www.w3.org/2000/svg';
      const svg=document.createElementNS(ns,'svg');
      svg.setAttribute('class','swatch__spark');svg.setAttribute('viewBox','0 0 42 20');
      const pl=document.createElementNS(ns,'polyline');
      pl.setAttribute('points',sparkPath(s.cpu||5));
      pl.setAttribute('fill','none');pl.setAttribute('stroke',statusColor(s.status));
      pl.setAttribute('stroke-width','1.4');pl.setAttribute('stroke-linecap','round');pl.setAttribute('opacity','.8');
      svg.appendChild(pl);b.appendChild(svg);
    }
    b.addEventListener('click',()=>{ select(s.id); closeSheet(); });
    container.appendChild(b);
  });
}

/* progressive disclosure: tabs + panels */

  const tabs = [];
  if(!down) tabs.push(['runtime','Runtime', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 11-12h-7z"/></svg>']);
  tabs.push(['profiles','Profiles','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>', s.profiles.length]);
  tabs.push(['maps','Maps','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>', s.mapList.length]);
  tabs.push(['raw','Config','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg>']);
  tabs.push(['events','Events','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>']);

  // ensure active tab is valid
  if(down && ACTIVE_TAB==='runtime') ACTIVE_TAB='profiles';

  let t = `<div class="disclose"><div class="tabs">`;
  tabs.forEach(([k,label,icon,count])=>{
    t += `<button class="tab ${k===ACTIVE_TAB?'on':''}" data-tab="${k}">${icon}<span>${label}</span>${count!=null?`<span class="tab__count">${count}</span>`:''}</button>`;
  });
  t += `</div>`;

  // RUNTIME
  if(!down){
    const toggles = RUNTIME.togglesByServer[s.id] || {};
    t += `<div class="panel ${ACTIVE_TAB==='runtime'?'on':''}" data-panel="runtime">`;
    if(s.quick.length){
      t += `<div class="shead">Quick<span class="ln"></span></div><div class="chips">`;
      s.quick.forEach(q=>{
        const on = q.toggle && toggles[q.k];
        t += `<button class="chip ${q.toggle?'toggle':''} ${on?'on':''}" data-quick="${q.k}" data-toggle="${q.toggle?1:0}">${MINI[q.i]||''}${q.n}</button>`;
      });
      t += `</div>`;
    }
    // sliders only for source games (gravity/speed meaningful) — but show for all live as part of brief
    t += `
      <div class="shead">Tuning<span class="ln"></span></div>

        ${slider('gravity','Gravity',0,1200,RUNTIME.gravity,'')}

        <select class="select" id="quickMap">${s.mapList.map(m=>`<option ${m===s.map?'selected':''}>${m}</option>`).join('')}</select>

          <button class="console__send" id="conSend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>

  // PROFILES

    <div class="prof-pick">
      ${s.profiles.map(p=>`<button class="prof-tab ${p===s.activeProfile?'on':''}" data-prof="${p}">${p===s.activeProfile?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>':''}${p}</button>`).join('')}

    <div class="shead">World<span class="ln"></span></div>

    <div class="fieldgrid">
      <div class="field"><label>DIFFICULTY</label><select class="select"><option>normal</option><option>hard</option><option>peaceful</option></select></div>
      <div class="field" style="justify-content:flex-end">
        <div class="switch ${s.activeProfile==='Hardcore'?'on':''}" data-switch><div class="switch__track"></div><span style="color:var(--ink-dim);font-size:var(--t-sm)">PvP / Hardcore</span></div>

    <div style="margin-top:var(--s5)">

    </div>
    <div style="margin-top:var(--s5)">
      <button class="btn" id="importBtn" style="width:100%">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>

  // EVENTS

      <button class="filter-chip on" data-filter="all">all</button>

    </div>
    <div class="feed" id="feed"></div>

  t += `</div>`;
  return t;
}

function slider(key,label,min,max,val,unit){
  const icons={gravity:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
    speed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 11-12h-7z"/></svg>',
    gamespeed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'};
  return `<div class="slider">
    <div class="slider__head">${icons[key]}<span class="nm">${label}</span><span class="vv" id="${key}Val">${val}${unit}</span></div>
    <input type="range" min="${min}" max="${max}" value="${val}" data-slider="${key}" data-unit="${unit}"/>
  </div>`;
}

/* ===================== EVENTS FEED ===================== */
let EVENT_FILTER='all';
function renderFeed(){
  const feed=$('#feed'); if(!feed)return;
  const rows = EVENTS.filter(e=>EVENT_FILTER==='all'||e.server===EVENT_FILTER);
  if(!rows.length){ feed.innerHTML='<div style="text-align:center;color:var(--ink-faint);padding:var(--s6)">no sessions</div>'; return; }
  feed.innerHTML = rows.map(e=>`
    <div class="event">
      <div class="event__av">${e.who[0]}</div>
      <div class="event__who">
        <div class="event__nm">${e.who}<span class="arrow">→</span><span class="srv">${e.srv}</span></div>
        <div class="event__meta">${e.state==='left'?'left '+e.leftAt:'joined '+(e.joined!=='—'?e.joined:'now')}</div>
      </div>
      <div class="event__state ${e.state}"><span class="dot ${e.state==='online'?'hosting':'down'}"></span>${e.state}</div>
      <div class="event__dur">${e.dur}</div>
    </div>`).join('');
}

/* ===================== CONSOLE ===================== */
let conLines=[];
function pushCon(c,x,t){
  conLines.push({t:t||now(),c,x});
  const out=$('#conOut'); if(!out)return;
  const line=el('div','cline '+c, `<span class="ts">${conLines[conLines.length-1].t} </span>${x}`);
  out.appendChild(line);
  out.scrollTop=out.scrollHeight;
}
function now(){ const d=new Date(); return d.toTimeString().slice(0,8); }
function seedConsole(){
  const out=$('#conOut'); if(!out)return; out.innerHTML=''; conLines=[];
  CONSOLE_SEED.forEach(l=>{ conLines.push(l); out.appendChild(el('div','cline '+l.c, `<span class="ts">${l.t} </span>${l.x}`)); });
  out.scrollTop=out.scrollHeight;
}

/* ===================== SELECT ===================== */
function select(id){
  if(id===SELECTED)return;
  SELECTED=id;
  ACTIVE_TAB = srv(id).status==='down' ? 'profiles' : 'runtime';
  document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
  renderHero();
  updateMobBar();
  $('#stage').scrollTo({top:0,behavior:'smooth'});
}

function updateMobBar(){
  const s=srv(SELECTED);
  $('#mobGlyph').innerHTML=ICONS[s.key];
  $('#mobName').textContent=s.name;
  $('#mobSub').innerHTML=s.status==='down'?'down · :'+s.port:`<span style="color:${statusColor(s.status)}">●</span> ${s.players!=null?s.players+(s.cap?'/'+s.cap:''):'—'} · ${s.cpu!=null?s.cpu+'%':'—'}`;
}

/* ===================== WIRING ===================== */
function wireHero(s, down){
  // refresh
  const rb=$('#refreshBtn');
  if(rb) rb.addEventListener('click',()=>{ rb.classList.add('spin'); toast('refreshed '+s.name); setTimeout(()=>rb.classList.remove('spin'),700); });
  const ub=$('#updateBtn'); if(ub) ub.addEventListener('click',()=>toast('checking for updates…'));
  const ub2=$('#updateBtn2'); if(ub2) ub2.addEventListener('click',()=>toast('checking for updates…'));

  // primary action (start/stop)
  const pa=$('#primaryAction');
  if(pa) pa.addEventListener('click',()=>{
    if(down){ // start
      s.status='hosting'; s.cpu=s.cpu||4; s.ramUsed=s.ramUsed||0.8; s.players=s.players||0;
      ACTIVE_TAB='runtime'; toast(s.name+' starting…'); renderHero(); renderList($('#railList'),true); renderList($('#sheetList'),false); updateMobBar();
    } else { // stop
      s.status='down'; s.cpu=null; toast(s.name+' stopping…','danger'); ACTIVE_TAB='profiles'; renderHero(); renderList($('#railList'),true); renderList($('#sheetList'),false); updateMobBar();
    }
  });
  const rsb=$('#restartBtn'); if(rsb) rsb.addEventListener('click',()=>{ rsb.querySelector('svg').style.animation='spin .7s linear'; toast('restarting '+s.name); });
  const fb=$('#forceBtn'); if(fb) fb.addEventListener('click',()=>openModal(s));

  // join copy
  const jb=$('#joinBar');
  if(jb) jb.addEventListener('click',()=>{
    const txt=s.join;
    copy(txt); jb.classList.add('copied');
    jb.querySelector('.joinbar__copy').lastChild.textContent='copied';
    setTimeout(()=>{ jb.classList.remove('copied'); jb.querySelector('.joinbar__copy').lastChild.textContent='copy'; },1400);
    toast('join string copied');
  });

  // tabs
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    ACTIVE_TAB=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.panel===ACTIVE_TAB));
    if(ACTIVE_TAB==='events') renderFeed();
    if(ACTIVE_TAB==='runtime') seedConsole();
  }));

  // runtime panel wiring
  if(!down){
    seedConsole();
    // quick chips
    document.querySelectorAll('[data-quick]').forEach(c=>c.addEventListener('click',()=>{
      const k=c.dataset.quick, isToggle=c.dataset.toggle==='1';
      if(isToggle){
        RUNTIME.togglesByServer[s.id]=RUNTIME.togglesByServer[s.id]||{};
        const nv=!RUNTIME.togglesByServer[s.id][k]; RUNTIME.togglesByServer[s.id][k]=nv;
        c.classList.toggle('on',nv);
        pushCon(nv?'ok':'sys', `${k} ${nv?'enabled':'disabled'}`);
      } else {
        c.style.borderColor='var(--accent)'; setTimeout(()=>c.style.borderColor='',300);
        pushCon('in', '$ '+c.textContent.trim());
        pushCon('ok', `→ ${c.textContent.trim()} executed`);
      }
    }));
    // sliders
    document.querySelectorAll('[data-slider]').forEach(sl=>{
      sl.addEventListener('input',()=>{
        const key=sl.dataset.slider, unit=sl.dataset.unit;
        RUNTIME[key]=+sl.value;
        const v=$('#'+key+'Val'); if(v)v.textContent=sl.value+unit;
      });
      sl.addEventListener('change',()=>pushCon('in', `$ set ${sl.dataset.slider} ${sl.value}`));
    });
    // change map
    const gm=$('#goMap'), qm=$('#quickMap');
    if(gm) gm.addEventListener('click',()=>{
      s.map=qm.value; pushCon('in','$ changelevel '+qm.value); pushCon('ok','map → '+qm.value);
      toast('map → '+qm.value);
      renderHero(); // reflect in centerpiece
    });
    // console input
    const ci=$('#conIn'), cs=$('#conSend');
    const send=()=>{ const v=ci.value.trim(); if(!v)return; pushCon('in','$ '+v); ci.value=''; setTimeout(()=>pushCon(/error|fail/i.test(v)?'warn':'ok','→ ok'),180); };
    if(ci) ci.addEventListener('keydown',e=>{ if(e.key==='Enter')send(); });
    if(cs) cs.addEventListener('click',send);
  }

  // profiles
  document.querySelectorAll('[data-prof]').forEach(p=>p.addEventListener('click',()=>{
    s.activeProfile=p.dataset.prof; renderHero();
  }));
  const addP=$('#addProf'); if(addP) addP.addEventListener('click',()=>{ toast('new profile (stub)'); });
  document.querySelectorAll('[data-switch]').forEach(sw=>sw.addEventListener('click',()=>sw.classList.toggle('on')));
  const ap=$('#applyProf'); if(ap) ap.addEventListener('click',()=>{
    ap.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .7s linear infinite"><path d="M21 12a9 9 0 11-2.6-6.4M21 4v4h-4"/></svg> Applying…';
    toast('applying '+s.activeProfile+' & restarting…');
    setTimeout(()=>{ if($('#applyProf'))renderHero(); },1400);
  });

  // maps
  document.querySelectorAll('.maprow__x').forEach(x=>x.addEventListener('click',e=>{
    e.target.closest('.maprow').style.opacity='.3'; toast('removed from rotation');
  }));
  const imp=$('#importBtn'); if(imp) imp.addEventListener('click',()=>{
    imp.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .7s linear infinite"><path d="M21 12a9 9 0 11-2.6-6.4M21 4v4h-4"/></svg> Importing…';
    setTimeout(()=>{ toast('collection imported · 5 maps'); if($('#importBtn'))renderHero(); },1500);
  });

  // raw
  const sr=$('#saveRaw'); if(sr) sr.addEventListener('click',()=>{ s.raw=$('#rawEdit').value; toast('saved '+s.rawFile); });

  // events filter
  document.querySelectorAll('[data-filter]').forEach(f=>f.addEventListener('click',()=>{
    EVENT_FILTER=f.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===f));
    renderFeed();
  }));
  if(ACTIVE_TAB==='events') renderFeed();
}

/* ===================== MODAL ===================== */
let modalServer=null;
function openModal(s){ modalServer=s; $('#modalTarget').textContent=s.name; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modalCancel').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{ if(e.target===$('#modal'))closeModal(); });
$('#modalConfirm').addEventListener('click',()=>{
  if(modalServer){ modalServer.status='down'; modalServer.cpu=null; toast('force-stopped '+modalServer.name,'danger');
    ACTIVE_TAB='profiles'; renderHero(); renderList($('#railList'),true); renderList($('#sheetList'),false); updateMobBar(); }
  closeModal();
});

/* ===================== TOAST / COPY ===================== */
let toastTimer;
function toast(msg,kind){
  const t=$('#toast'); $('#toastMsg').textContent=msg;
  t.classList.toggle('danger',kind==='danger'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function copy(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt)); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

/* ===================== MOBILE SHEET ===================== */
function openSheet(){ $('#sheet').classList.add('show'); }
function closeSheet(){ $('#sheet').classList.remove('show'); }
$('#mobCur').addEventListener('click',openSheet);
$('#mobSwitchBtn').addEventListener('click',openSheet);
$('#sheet').addEventListener('click',e=>{ if(e.target===$('#sheet'))closeSheet(); });

/* ===================== LIVE TICK (subtle) ===================== */
function tick(){
  SERVERS.forEach(s=>{ if(s.status!=='down'&&s.cpu!=null){ s.cpu=Math.max(1,Math.min(98, s.cpu+(Math.random()*4-2))); s.cpu=Math.round(s.cpu); } });
  // update rail subs softly without full rerender of hero
  document.querySelectorAll('#railList .swatch').forEach(b=>{
    const s=srv(b.dataset.id); if(s.status==='down')return;
    const sub=b.querySelector('.swatch__sub');
    if(sub) sub.innerHTML=`<span class="dot ${s.status}"></span> ${s.players!=null?s.players+(s.cap?'/'+s.cap:''):'—'} · ${s.cpu}%`;
  });
  // fleet cpu donut (avg of live)
  const live=SERVERS.filter(s=>s.status!=='down'&&s.cpu!=null);
  const avg=live.length?Math.round(live.reduce((a,s)=>a+s.cpu,0)/live.length):0;
  const ring=$('#cpuRing'), pct=$('#cpuPct');
  if(ring){ ring.setAttribute('stroke-dashoffset', (157*(1-avg/100)).toFixed(0)); }
  if(pct) pct.textContent=avg+'%';
}

/* ===================== INIT ===================== */
renderList($('#railList'), true);
renderList($('#sheetList'), false);
renderHero();
updateMobBar();
tick();
setInterval(tick, 3000);

// keyboard: 1-5 to switch
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const n=parseInt(e.key,10); if(n>=1&&n<=SERVERS.length){ select(SERVERS[n-1].id); }
  if(e.key==='Escape'){ closeModal(); closeSheet(); }
});
</script>
