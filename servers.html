<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAMERTOWN.SOLUTIONS :: SERVER CONTROL</title>
  <link rel="stylesheet" href="site-tabs.css" />
  <script src="site-tabs.js" defer></script>
  <style>
    body {
      background: #2a2a2a;
      color: #d4d4b8;
      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
      margin: 0;
    }

    a { color: #7bb85f; }
    a:visited { color: #7bb85f; }
    a:hover { color: #42F527; }

    #wrap { padding: 8px; max-width: 760px; }

    .sec-head {
      background: #1e2e1e;
      border: 1px solid #7bb85f;
      border-bottom: none;
      padding: 4px 6px;
      color: #d4d4b8;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── server card ── */
    .srv {
      border: 1px solid #3a3a3a;
      background: #222222;
      margin-bottom: 14px;
    }
    .srv-head {
      background: #1a1a1a;
      border-bottom: 1px solid #3a3a3a;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .srv-name { color: #d4d4b8; font-weight: bold; font-size: 13px; }
    .srv-vmid { color: #666666; font-size: 10px; margin-left: 6px; }

    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #555555; display: inline-block; }
    .dot.hosting { background: #42F527; box-shadow: 0 0 4px #42F527; }
    .dot.idle    { background: #c2a13a; box-shadow: 0 0 4px #c2a13a; }
    .dot.down    { background: #888888; }
    .dot.unknown { background: #555555; }
    .dot.busy { background: #c2a13a; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .status .label { color: #999999; text-transform: uppercase; letter-spacing: 1px; }
    .status .meta { color: #666666; }

    .srv-body { padding: 8px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

    .connbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .connbar .clbl { color: #7bb85f; font-size: 11px; font-weight: bold; }
    .connbar code {
      flex: 1; min-width: 0; background: #141414; border: 1px solid #2a2a2a; color: #b8d4a0;
      padding: 4px 6px; font-family: "Courier New", monospace; font-size: 12px;
      white-space: nowrap; overflow: auto;
    }
    .copy-btn { background: #2a3a4a; border: 1px solid #5f8fb8; color: #d4d4b8; padding: 4px 10px;
      font-size: 11px; font-weight: bold; cursor: pointer; font-family: Verdana, Arial, sans-serif; }
    .copy-btn:hover { background: #3a5a7a; color: #9fd0ff; }

    button.retro-btn {
      background: #2a4a1a;
      color: #d4d4b8;
      border: 1px solid #7bb85f;
      padding: 4px 12px;
      font-family: Verdana, Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    button.retro-btn:hover { background: #3a6a2a; color: #42F527; }
    button.retro-btn:disabled { background: #333333; color: #555555; border-color: #3a3a3a; cursor: default; }
    button.retro-btn.danger { background: #4a1a1a; border-color: #b85f5f; }
    button.retro-btn.danger:hover { background: #6a2a2a; color: #ff7777; }

    .srv-err { color: #ff6666; font-size: 11px; margin-top: 6px; min-height: 14px; }

    /* ── config / update panel (Phase 3) ── */
    .panel { border-top: 1px dashed #3a3a3a; margin-top: 8px; padding-top: 8px; }
    .panel-title { color: #42F527; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .qs-fields { display: grid; grid-template-columns: 120px 1fr; gap: 6px 8px; align-items: center; margin-bottom: 8px; max-width: 420px; }
    .qs-fields label { color: #7bb85f; font-size: 11px; font-weight: bold; }
    .qs-fields select, .qs-fields input { width: 100%; }
    .qs-note { color: #999; font-size: 10px; font-style: italic; margin-left: 8px; }
    .qs-sep { border-top: 1px dashed #3a3a3a; margin: 10px 0; }
    .qs-section-title { color: #7bb85f; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .qs-note-block { color: #999; font-size: 10px; font-style: italic; margin-top: 8px; }
    /* ── CS startup panel ── */
    details.cs-advanced { margin-top: 10px; border-top: 1px dashed #3a3a3a; padding-top: 6px; }
    details.cs-advanced summary { color: #7bb85f; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    [data-cs-add] { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    [data-cs-add] input { flex: 1 1 120px; min-width: 0; }
    .qs-fields .retro-btn, [data-cs-add] .retro-btn { padding: 2px 8px; }
    .qs-fields .inline { display: flex; gap: 6px; align-items: center; }
    .qs-fields .inline select { flex: 1; min-width: 0; }
    .panel-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .panel label { color: #7bb85f; font-size: 11px; font-weight: bold; }
    select, input[type=text], input[type=number] {
      background: #1a1a1a; border: 1px solid #3a3a3a; color: #d4d4b8;
      padding: 3px 4px; font-family: Verdana, Arial, sans-serif; font-size: 11px;
    }
    textarea.cfg {
      width: 100%; box-sizing: border-box; height: 160px; resize: vertical;
      background: #1a1a1a; border: 1px solid #3a3a3a; color: #d4d4b8;
      padding: 4px; font-family: "Courier New", monospace; font-size: 12px;
    }
    pre.out {
      background: #141414; border: 1px solid #2a2a2a; color: #b8d4a0;
      padding: 6px; font-family: "Courier New", monospace; font-size: 11px;
      white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 6px 0 0;
    }

    #gate { padding: 24px 8px; color: #ff6666; font-size: 13px; }
    #gate a { font-weight: bold; }

    #footer-bar {
      border-top: 1px solid #3a3a3a;
      background: #1f1f1f;
      padding: 6px 8px;
      color: #999999;
      font-size: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="wrap">
    <div id="gate" style="display:none"></div>

    <div id="panel" style="display:none">
      <div class="sec-head">Game Servers</div>
      <div id="server-list">
        <div style="padding:12px;color:#999;font-style:italic">loading...</div>
      </div>
    </div>
  </div>

  <div id="footer-bar">
    &copy; 2026 GAMERTOWN.SOLUTIONS &mdash; all realities reserved
  </div>

  <script type="module">
    import {
      dbGetServers, dbServerAction,
      dbListServerConfig, dbReadServerConfig, dbWriteServerConfig, dbUpdateServer,
      dbGetServerSettings, dbSaveServerSettings,
      dbAddServerMap, dbRenameServerMap, dbDeleteServerMap,
      dbGetServerConfigBody, dbCreateServerConfig, dbUpdateServerConfig, dbDeleteServerConfig,
    } from './db.js'
    import { loadSession } from './auth.js'

    const gate  = document.getElementById('gate')
    const panel = document.getElementById('panel')

    // ── admin gate ─────────────────────────────────────────────
    const session = await loadSession()
    if (!session) {
      gate.style.display = 'block'
      gate.innerHTML = 'You must <a href="signin.html">sign in</a> as an admin to control servers.'
    } else if (!session.isAdmin) {
      gate.style.display = 'block'
      gate.textContent = 'Admins only. Your account does not have server-control access.'
    } else {
      panel.style.display = 'block'
      boot()
    }

    // ── helpers ────────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
    function fmtUptime(sec) {
      sec = Math.floor(sec || 0)
      if (sec <= 0) return ''
      const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60)
      if (d) return `up ${d}d ${h}h`
      if (h) return `up ${h}h ${m}m`
      return `up ${m}m`
    }

    let servers = []

    async function boot() {
      try {
        servers = await dbGetServers()
      } catch (e) {
        document.getElementById('server-list').innerHTML =
          `<div style="padding:12px;color:#ff6666">error: ${esc(e.message)}</div>`
        return
      }
      render()
    }

    function render() {
      const host = document.getElementById('server-list')
      if (!servers.length) {
        host.innerHTML = '<div style="padding:12px;color:#999">no servers configured</div>'
        return
      }
      host.innerHTML = servers.map(cardHtml).join('')
      servers.forEach(s => wireCard(s.id))
    }

    function statusBits(s) {
      const gs = s.gameStatus
      let cls, label
      if      (gs === 'hosting') { cls = 'hosting'; label = 'HOSTING' }
      else if (gs === 'idle')    { cls = 'idle';    label = 'IDLE' }
      else if (gs === 'down')    { cls = 'down';    label = 'DOWN' }
      else                       { cls = 'unknown'; label = s.status ?? 'UNKNOWN' }
      const meta = s.status === 'running' && s.uptime ? `&mdash; ${esc(fmtUptime(s.uptime))}` : ''
      return { cls, label, meta }
    }

    function cardHtml(s) {
      const { cls, label, meta } = statusBits(s)
      return `
      <div class="srv" id="srv-${esc(s.id)}">
        <div class="srv-head">
          <div><span class="srv-name">${esc(s.name)}</span><span class="srv-vmid">VMID ${esc(s.vmid)}</span></div>
          <div style="display:flex;align-items:center;gap:10px">
            <button class="retro-btn" data-update>Update</button>
            <div class="status" data-status>
              <span class="dot ${cls}"></span>
              <span class="label">${esc(label)}</span>
              <span class="meta">${meta}</span>
            </div>
          </div>
        </div>
        <div class="srv-body">
          ${s.connect?.string ? `
          <div class="connbar">
            <span class="clbl">Join</span>
            <code data-conn>${esc(s.connect.string)}</code>
            <button class="copy-btn" data-copy>Copy</button>
          </div>` : ''}
          <div class="btn-row">
            <button class="retro-btn" data-act="start">Start VM</button>
            <button class="retro-btn" data-act="reboot">Restart VM</button>
            <button class="retro-btn" data-act="shutdown">Shut Down</button>
            <button class="retro-btn danger" data-act="stop">Force Stop</button>
          </div>
          <div class="btn-row" style="margin-top:4px">
            <button class="retro-btn" data-act="startGame">Start Hosting</button>
            <button class="retro-btn danger" data-act="stopGame">Stop Hosting</button>
            <button class="retro-btn" data-act="refresh">Refresh</button>
          </div>
          <div class="srv-err" data-err></div>

          <div class="panel quickset" data-quickset style="display:none">
            <div class="panel-title">Quick Settings</div>
            <div class="qs-fields" data-qs-fields></div>
            <div class="panel-row">
              <button class="retro-btn" data-qs-save>Save Settings</button>
              <span class="qs-note" data-qs-note></span>
            </div>
          </div>

          <div class="panel">
            <div class="panel-row">
              <label>Config (raw)</label>
              <select data-cfg-select><option value="">— loading… —</option></select>
              <button class="retro-btn" data-cfg-save disabled>Save</button>
            </div>
            <textarea class="cfg" data-cfg-text placeholder="select a config file and click Open" disabled></textarea>
            <pre class="out" data-out style="display:none"></pre>
          </div>
        </div>
      </div>`
    }

    function wireCard(id) {
      const root = document.getElementById(`srv-${id}`)
      const errEl = root.querySelector('[data-err]')
      const out   = root.querySelector('[data-out]')
      const sel   = root.querySelector('[data-cfg-select]')
      const text  = root.querySelector('[data-cfg-text]')
      const saveBtn = root.querySelector('[data-cfg-save]')

      const setErr = (m) => { errEl.textContent = m || '' }
      const setBusy = (busy) => {
        root.querySelectorAll('.btn-row button').forEach(b => b.disabled = busy)
        const dot = root.querySelector('.dot')
        if (busy) { dot.className = 'dot busy' }
      }
      const showOut = (txt) => { out.style.display = 'block'; out.textContent = txt }

      // apply initial game-button state from the server data already in `servers`
      const initData = servers.find(x => x.id === id)
      if (initData) updateStatus(root, initData)

      async function refresh() {
        try {
          const all = await dbGetServers()
          servers = all
          const s = all.find(x => x.id === id)
          if (s) updateStatus(root, s)
          setErr(s?.error || '')
        } catch (e) { setErr(e.message) }
      }

      // copy join string
      const copyBtn = root.querySelector('[data-copy]')
      if (copyBtn) copyBtn.addEventListener('click', async () => {
        const txt = root.querySelector('[data-conn]').textContent
        try {
          await navigator.clipboard.writeText(txt)
        } catch {
          // clipboard API needs HTTPS/permission; fall back to a manual select
          const r = document.createRange(); r.selectNode(root.querySelector('[data-conn]'))
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r)
          try { document.execCommand('copy') } catch {}
          sel.removeAllRanges()
        }
        const old = copyBtn.textContent; copyBtn.textContent = 'Copied!'
        setTimeout(() => { copyBtn.textContent = old }, 1200)
      })

      // power actions
      root.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const act = btn.dataset.act
          if (act === 'refresh') return refresh()
          if (act === 'stop' && !confirm('Force Stop pulls the power immediately and can corrupt an in-progress save. Continue?')) return
          if (act === 'stopGame' && !confirm('Stop Hosting will kick all active players. Continue?')) return
          setErr(''); setBusy(true)
          try {
            await dbServerAction(id, act)
            // give Proxmox a moment, then refresh status
            await new Promise(r => setTimeout(r, 1500))
            await refresh()
          } catch (e) {
            setErr(e.message)
          } finally {
            setBusy(false)
          }
        })
      })

      // config: auto-load file list on page load
      async function loadConfigList() {
        try {
          const { files } = await dbListServerConfig(id)
          sel.innerHTML = (files.length ? files : []).map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('')
            || '<option value="">(no editable files)</option>'
        } catch (e) { setErr(e.message) }
      }
      loadConfigList()

      // config: read the file selected in the dropdown
      sel.addEventListener('change', async () => {
        const file = sel.value
        if (!file) return
        setErr('')
        try {
          const { content, truncated } = await dbReadServerConfig(id, file)
          text.value = content
          text.disabled = false
          saveBtn.disabled = false
          if (truncated) setErr('note: file was truncated by Proxmox (very large file)')
        } catch (e) { setErr(e.message); text.disabled = true; saveBtn.disabled = true }
      })

      // config: save
      saveBtn.addEventListener('click', async () => {
        const file = sel.value
        if (!file) return
        setErr(''); saveBtn.disabled = true
        try {
          await dbWriteServerConfig(id, file, text.value)
          showOut(`saved ${file} ✓`)
        } catch (e) { setErr(e.message) } finally { saveBtn.disabled = false }
      })

      // ── quick settings (structured map / game mode / …) ───────────────────
      const qs = root.querySelector('[data-quickset]')
      const qsFields = root.querySelector('[data-qs-fields]')
      const qsNote = root.querySelector('[data-qs-note]')
      const qsSave = root.querySelector('[data-qs-save]')

      function renderField(id, f) {
        const lbl = `<label for="qs-${id}-${f.key}">${esc(f.label)}</label>`
        if (f.type === 'select') {
          const opts = f.options.map(o =>
            `<option value="${esc(o.value)}"${o.value === f.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('')
          return `${lbl}<select id="qs-${id}-${f.key}" data-qs-key="${esc(f.key)}">${opts}</select>`
        }
        const attrs = [
          f.min != null ? `min="${f.min}"` : '',
          f.max != null ? `max="${f.max}"` : '',
          f.placeholder ? `placeholder="${esc(f.placeholder)}"` : '',
        ].filter(Boolean).join(' ')
        return `${lbl}<input id="qs-${id}-${f.key}" data-qs-key="${esc(f.key)}" type="${f.type === 'number' ? 'number' : 'text'}" value="${esc(f.value ?? '')}" ${attrs} />`
      }

      async function loadSettings() {
        let data
        try {
          data = await dbGetServerSettings(id)
        } catch { return }
        if (!data) return

        // Counter-Strike: bespoke startup panel (map catalog + config library).
        // Render content, then let updateStatus gate visibility (hosting-only).
        if (data.game === 'counterstrike') {
          renderCsPanel(data)
          qs.dataset.loaded = '1'
          const current = servers.find(x => x.id === id)
          if (current) updateStatus(root, current)
          return
        }

        if (!data.fields?.length && !data.sections?.length) return

        if (data.sections?.length) {
          // Multi-section layout (e.g. Factorio): replace panel content dynamically.
          qs.innerHTML = '<div class="panel-title">Quick Settings</div>' +
            data.sections.map((sec, i) =>
              `${i > 0 ? '<div class="qs-sep"></div>' : ''}
              <div class="qs-section" data-qs-section="${esc(sec.key)}">
                <div class="qs-section-title">${esc(sec.title)}</div>
                <div class="qs-fields">${sec.fields.map(f => renderField(id, f)).join('')}</div>
                <div class="panel-row">
                  <button class="retro-btn" data-qs-save>${esc(sec.saveLabel || 'Save')}</button>
                </div>
              </div>`
            ).join('') +
            (data.note ? `<div class="qs-note-block">${esc(data.note)}</div>` : '')

          qs.dataset.loaded = '1'
          const current = servers.find(x => x.id === id)
          if (current) updateStatus(root, current)

          qs.querySelectorAll('[data-qs-section]').forEach(secEl => {
            const sectionKey = secEl.dataset.qsSection
            secEl.querySelector('[data-qs-save]').addEventListener('click', async () => {
              const values = { section: sectionKey }
              secEl.querySelectorAll('[data-qs-key]').forEach(el => {
                values[el.dataset.qsKey] = el.type === 'number' ? Number(el.value) : el.value
              })
              if (sectionKey === 'saveAs') {
                if (!confirm(`Save current world as "${values.saveName}"?\n\nIf a save with this name already exists it will be overwritten.`)) return
              }
              setErr('')
              const btn = secEl.querySelector('[data-qs-save]')
              btn.disabled = true
              try {
                const res = await dbSaveServerSettings(id, values)
                if (res?.steps) showOut(formatUpdate(res))
                if (res?.ok === false) setErr('operation failed — see output below')
                else if (!res?.steps) showOut('settings saved ✓ — restart the server to apply')
              } catch (e) { setErr(e.message) } finally { btn.disabled = false }
            })
          })
          return
        }

        // Single-section path (legacy generic fields)
        qsNote.textContent = data.note || ''
        qsFields.innerHTML = data.fields.map(f => renderField(id, f)).join('')

        // mark loaded and let updateStatus decide visibility
        qs.dataset.loaded = '1'
        const current = servers.find(x => x.id === id)
        if (current) updateStatus(root, current)
      }

      // ── Counter-Strike startup panel ──────────────────────────────────────
      async function csReload(selectMap) {
        try {
          const data = await dbGetServerSettings(id)
          if (data?.game === 'counterstrike') renderCsPanel(data, selectMap)
        } catch (e) { setErr(e.message) }
      }

      function renderCsPanel(data, selectMap) {
        const m = data.map || { stock: [], workshop: [], current: '' }
        const current = (selectMap && selectMap !== '__add__') ? selectMap : (m.current || '')

        const mapOpts =
          '<optgroup label="Stock">' +
            m.stock.map(n => `<option value="${esc(n)}"${n === current ? ' selected' : ''}>${esc(n)}</option>`).join('') +
          '</optgroup>' +
          (m.workshop.length
            ? '<optgroup label="Workshop">' +
                m.workshop.map(w => {
                  const v = `ws:${w.id}`
                  return `<option value="${esc(v)}"${v === current ? ' selected' : ''}>${esc(w.name)}</option>`
                }).join('') +
              '</optgroup>'
            : '') +
          '<option value="__add__">＋ Add workshop map…</option>'

        const modeOpts = data.gameMode.options.map(o =>
          `<option value="${esc(o.value)}"${o.value === data.gameMode.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('')

        const cfgSel = data.configs?.selectedId ?? ''
        const cfgOpts = '<option value="">(none)</option>' +
          (data.configs?.options || []).map(c =>
            `<option value="${esc(c.id)}"${String(c.id) === String(cfgSel) ? ' selected' : ''}>${esc(c.name)}</option>`).join('')

        qs.innerHTML = `
          <div class="panel-title">Startup <span class="qs-note">applies on restart</span></div>
          <div class="qs-fields">
            <label>Map</label>
            <div>
              <div class="inline">
                <select data-cs-map>${mapOpts}</select>
                <button class="retro-btn" data-cs-rename>Rename</button>
                <button class="retro-btn danger" data-cs-remove>Remove</button>
              </div>
              <div data-cs-add style="display:none;margin-top:6px">
                <input type="text" data-cs-add-id placeholder="Workshop ID (digits)" />
                <input type="text" data-cs-add-name placeholder="Map name" />
                <button class="retro-btn" data-cs-add-save>Save Map</button>
                <button class="retro-btn" data-cs-add-cancel>Cancel</button>
              </div>
            </div>

            <label>Game Mode</label>
            <select data-cs-mode>${modeOpts}</select>

            <label>Config</label>
            <div class="inline">
              <select data-cs-config>${cfgOpts}</select>
              <button class="retro-btn" data-cs-manage>Manage…</button>
            </div>

            <label>Max Players</label>
            <input type="number" data-cs-max min="1" max="64" value="${esc(data.maxPlayers ?? 10)}" />
          </div>

          <div data-cs-editor style="display:none"></div>

          <div class="panel-row">
            <button class="retro-btn" data-cs-apply>Apply</button>
            <span class="qs-note">${esc(data.note || '')}</span>
          </div>

          <details class="cs-advanced">
            <summary>Advanced</summary>
            <div class="qs-fields" style="margin-top:6px">
              <label>Server Name</label>
              <input type="text" data-cs-hostname value="${esc(data.hostname ?? '')}" />
            </div>
            <div class="qs-note-block">Shown in the CS2 server browser.</div>
          </details>`

        const $ = (sel) => qs.querySelector(sel)
        const mapSel   = $('[data-cs-map]')
        const addBox   = $('[data-cs-add]')
        const renameBtn = $('[data-cs-rename]')
        const removeBtn = $('[data-cs-remove]')
        const isWs = (v) => typeof v === 'string' && v.startsWith('ws:')

        function syncMapActions() {
          const ws = isWs(mapSel.value)
          renameBtn.disabled = !ws
          removeBtn.disabled = !ws
          addBox.style.display = mapSel.value === '__add__' ? 'flex' : 'none'
        }
        syncMapActions()
        mapSel.addEventListener('change', () => {
          syncMapActions()
          if (mapSel.value === '__add__') $('[data-cs-add-id]').focus()
        })

        $('[data-cs-add-cancel]').addEventListener('click', () => {
          mapSel.value = (current && current !== '__add__') ? current : (m.stock[0] || '')
          syncMapActions()
        })
        $('[data-cs-add-save]').addEventListener('click', async () => {
          const wsid = $('[data-cs-add-id]').value.trim()
          const nm   = $('[data-cs-add-name]').value.trim()
          setErr('')
          try { await dbAddServerMap(id, wsid, nm); await csReload(`ws:${wsid}`) }
          catch (e) { setErr(e.message) }
        })

        renameBtn.addEventListener('click', async () => {
          const wsid = mapSel.value.slice(3)
          const cur = m.workshop.find(w => w.id === wsid)
          const nm = prompt('Rename workshop map:', cur?.name || '')
          if (nm == null) return
          setErr('')
          try { await dbRenameServerMap(id, wsid, nm.trim()); await csReload(mapSel.value) }
          catch (e) { setErr(e.message) }
        })
        removeBtn.addEventListener('click', async () => {
          const wsid = mapSel.value.slice(3)
          const cur = m.workshop.find(w => w.id === wsid)
          if (!confirm(`Remove "${cur?.name || wsid}" from the catalog? (does not delete it from Steam)`)) return
          setErr('')
          try { await dbDeleteServerMap(id, wsid); await csReload() }
          catch (e) { setErr(e.message) }
        })

        // config library editor
        $('[data-cs-manage]').addEventListener('click', () => {
          const ed = $('[data-cs-editor]')
          if (ed.style.display === 'none') { ed.style.display = 'block'; renderConfigEditor(data.configs?.options || []) }
          else ed.style.display = 'none'
        })
        function renderConfigEditor(options) {
          const ed = $('[data-cs-editor]')
          const listOpts = '<option value="__new__">＋ New config</option>' +
            options.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')
          ed.innerHTML = `
            <div class="qs-sep"></div>
            <div class="qs-section-title">Saved Configs</div>
            <div class="panel-row"><select data-ce-list>${listOpts}</select></div>
            <div class="qs-fields">
              <label>Name</label>
              <input type="text" data-ce-name placeholder="bunnyhop" />
              <label>Commands</label>
              <textarea class="cfg" data-ce-body placeholder="sv_cheats 1&#10;sv_autobunnyhopping 1&#10;sv_enablebunnyhopping 1"></textarea>
            </div>
            <div class="panel-row">
              <button class="retro-btn" data-ce-save>Save Config</button>
              <button class="retro-btn danger" data-ce-delete>Delete</button>
            </div>`
          const list = ed.querySelector('[data-ce-list]')
          const nameEl = ed.querySelector('[data-ce-name]')
          const bodyEl = ed.querySelector('[data-ce-body]')
          const delBtn = ed.querySelector('[data-ce-delete]')
          async function loadInto(val) {
            if (val === '__new__') { nameEl.value = ''; bodyEl.value = ''; delBtn.disabled = true; return }
            delBtn.disabled = false
            try { const c = await dbGetServerConfigBody(id, val); nameEl.value = c.name; bodyEl.value = c.body }
            catch (e) { setErr(e.message) }
          }
          list.addEventListener('change', () => loadInto(list.value))
          loadInto('__new__')
          ed.querySelector('[data-ce-save]').addEventListener('click', async () => {
            setErr('')
            const nm = nameEl.value.trim(), body = bodyEl.value
            try {
              if (list.value === '__new__') await dbCreateServerConfig(id, nm, body)
              else await dbUpdateServerConfig(id, list.value, { name: nm, body })
              await csReload(mapSel.value === '__add__' ? undefined : mapSel.value)
              showOut(`config "${nm}" saved ✓`)
            } catch (e) { setErr(e.message) }
          })
          delBtn.addEventListener('click', async () => {
            if (list.value === '__new__') return
            if (!confirm('Delete this config?')) return
            setErr('')
            try { await dbDeleteServerConfig(id, list.value); await csReload(mapSel.value === '__add__' ? undefined : mapSel.value); showOut('config deleted ✓') }
            catch (e) { setErr(e.message) }
          })
        }

        // apply (map + mode + config + players + hostname)
        $('[data-cs-apply]').addEventListener('click', async () => {
          if (mapSel.value === '__add__') { setErr('finish adding the workshop map first (Save Map or Cancel)'); return }
          const cfgVal = $('[data-cs-config]').value
          const payload = {
            map: mapSel.value,
            gameMode: $('[data-cs-mode]').value,
            maxPlayers: Number($('[data-cs-max]').value),
            hostname: $('[data-cs-hostname]').value,
            configId: cfgVal === '' ? '' : Number(cfgVal),
          }
          setErr('')
          const btn = $('[data-cs-apply]'); btn.disabled = true
          try {
            await dbSaveServerSettings(id, payload)
            showOut('settings saved ✓ — restart the server to apply')
          } catch (e) { setErr(e.message) } finally { btn.disabled = false }
        })
      }

      qsSave.addEventListener('click', async () => {
        const values = {}
        qsFields.querySelectorAll('[data-qs-key]').forEach(el => {
          values[el.dataset.qsKey] = el.type === 'number' ? Number(el.value) : el.value
        })
        setErr(''); qsSave.disabled = true
        try {
          await dbSaveServerSettings(id, values)
          showOut('settings saved ✓ — restart the server to apply')
        } catch (e) { setErr(e.message) } finally { qsSave.disabled = false }
      })

      loadSettings()

      // update recipe
      root.querySelector('[data-update]').addEventListener('click', async () => {
        if (!confirm('Run the update recipe? This may stop and restart the server.')) return
        setErr(''); setBusy(true); showOut('running update…')
        try {
          const res = await dbUpdateServer(id)
          showOut(formatUpdate(res))
          await refresh()
        } catch (e) {
          setErr(e.message)
          out.style.display = 'none'
        } finally { setBusy(false) }
      })
    }

    function updateStatus(root, s) {
      const { cls, label, meta } = statusBits(s)
      root.querySelector('.dot').className = `dot ${cls}`
      root.querySelector('.status .label').textContent = label
      root.querySelector('.status .meta').innerHTML = meta

      const gs = s.gameStatus
      const show = (...keys) => keys.forEach(k => { const b = root.querySelector(`[data-act="${k}"]`); if (b) b.style.display = '' })
      const hide = (...keys) => keys.forEach(k => { const b = root.querySelector(`[data-act="${k}"]`); if (b) b.style.display = 'none' })

      if (gs === 'down') {
        show('start', 'refresh')
        hide('reboot', 'shutdown', 'stop', 'startGame', 'stopGame')
      } else if (gs === 'idle') {
        show('startGame', 'shutdown', 'stop', 'refresh')
        hide('start', 'reboot', 'stopGame')
      } else if (gs === 'hosting') {
        show('stopGame', 'shutdown', 'stop', 'refresh')
        hide('start', 'reboot', 'startGame')
      } else {
        show('start', 'reboot', 'shutdown', 'stop', 'startGame', 'stopGame', 'refresh')
      }

      // settings panel only when hosting and populated
      const qs = root.querySelector('[data-quickset]')
      if (qs) qs.style.display = (gs === 'hosting' && qs.dataset.loaded === '1') ? 'block' : 'none'
    }

    function formatUpdate(res) {
      if (!res?.steps) return JSON.stringify(res, null, 2)
      return res.steps.map(st => {
        const head = `── ${st.name} (exit ${st.exitCode}) ──`
        return [head, st.stdout, st.stderr && `[stderr]\n${st.stderr}`].filter(Boolean).join('\n')
      }).join('\n\n')
    }
  </script>

</body>
</html>
