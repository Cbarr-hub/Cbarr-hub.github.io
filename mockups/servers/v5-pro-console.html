<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>gtctl // fleet</title>
<style>
/* ============================================================
   gtctl — Refined Pro Console
   A hacker terminal, art-directed by Airbnb.
   ============================================================ */

:root{
  /* grounds */
  --bg:#0a0a0a;
  --bg-1:#111111;
  --bg-2:#161616;
  --bg-3:#1d1d1d;
  --bg-rail:#0c0c0c;
  /* hairlines */
  --line:#242424;
  --line-2:#2f2f2f;
  --line-hi:#3a3a3a;
  /* text */
  --ink:#d4d4b8;
  --ink-dim:#8a8a78;
  --ink-faint:#5a5a50;
  /* signals */
  --green:#7bb85f;
  --hot:#42F527;
  --amber:#c2a13a;
  --red:#b85f5f;
  --red-hot:#ff7777;
  --grey:#555;
  /* the one refined accent: cyan, for focus/interactive chrome */
  --accent:#3fd0c9;
  --accent-dim:#1f6e6a;
  /* type scale (1.25) */
  --t-xs:10px;
  --t-sm:11px;
  --t-base:13px;
  --t-md:15px;
  --t-lg:19px;
  --t-xl:26px;
  --t-2xl:34px;
  /* spacing (4-based rhythm) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --radius:10px;
  --radius-sm:7px;
  --radius-lg:14px;
  --mono:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  --rail-w:64px;
  --ease:cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  font-size:var(--t-base);
  line-height:1.45;
  letter-spacing:.2px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* subtle scanline atmosphere */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.025) 3px,rgba(0,0,0,0) 4px);
  mix-blend-mode:overlay;opacity:.6;
}
/* faint corner vignette */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:radial-gradient(120% 120% at 50% 0%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);
}

::selection{background:var(--accent-dim);color:#eafffd;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:none;}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;}
svg{display:block;}

/* scrollbars */
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--bg);}
*::-webkit-scrollbar-thumb:hover{background:var(--line-hi);}

/* ====================== LAYOUT ====================== */
#app{
  display:grid;
  grid-template-columns:var(--rail-w) 1fr;
  height:100dvh;
  width:100vw;
}

/* ---- corner tag ---- */
.corner-tag{
  position:fixed;right:10px;bottom:8px;z-index:10000;
  font-size:9px;letter-spacing:1.5px;color:var(--ink-faint);
  text-transform:uppercase;pointer-events:none;user-select:none;
  opacity:.7;
}
.corner-tag b{color:var(--accent);font-weight:600;}

/* ============================================================
   LEFT RAIL — icon-only server switcher
   ============================================================ */
.rail{
  background:var(--bg-rail);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;
  padding:var(--s3) 0;
  gap:var(--s2);
  z-index:30;
  position:relative;
}
.rail-logo{
  width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;
  border:1px solid var(--line-2);
  background:linear-gradient(160deg,#141414,#0d0d0d);
  margin-bottom:var(--s3);
  position:relative;flex:none;
}
.rail-logo svg{width:18px;height:18px;}
.rail-logo .pulse{
  position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--hot);box-shadow:0 0 8px var(--hot);
  animation:beacon 2.4s var(--ease) infinite;
}
@keyframes beacon{0%,100%{opacity:1;}50%{opacity:.35;}}

.rail-list{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;overflow-y:auto;overflow-x:hidden;flex:1;padding:2px 0;}
.rail-list::-webkit-scrollbar{display:none;}

.rail-btn{
  position:relative;
  width:44px;height:44px;border-radius:12px;
  display:grid;place-items:center;
  border:1px solid transparent;
  background:var(--bg-1);
  transition:all .14s var(--ease);
  flex:none;
}
.rail-btn svg{width:22px;height:22px;transition:transform .14s var(--ease);opacity:.85;}
.rail-btn:hover{background:var(--bg-3);border-color:var(--line-2);}
.rail-btn:hover svg{transform:scale(1.08);opacity:1;}
.rail-btn.active{
  background:var(--bg-3);
  border-color:var(--line-hi);
  box-shadow:inset 0 0 0 1px rgba(63,208,201,.18),0 4px 16px -8px rgba(0,0,0,.8);
}
.rail-btn.active svg{opacity:1;}
/* active selection bar */
.rail-btn.active::before{
  content:"";position:absolute;left:-13px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent);
  box-shadow:0 0 10px var(--accent);
}
/* status dot on icon */
.rail-dot{
  position:absolute;bottom:-2px;right:-2px;
  width:11px;height:11px;border-radius:50%;
  border:2px solid var(--bg-rail);
}
.rail-dot.hosting{background:var(--hot);box-shadow:0 0 7px rgba(66,245,39,.7);}
.rail-dot.idle{background:var(--amber);}
.rail-dot.down{background:var(--grey);}
.rail-dot.busy{background:var(--accent);}

/* tooltip on hover (desktop) */
.rail-btn .tip{
  position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(-6px);
  background:var(--bg-3);border:1px solid var(--line-2);
  padding:5px 10px;border-radius:7px;white-space:nowrap;
  font-size:var(--t-sm);color:var(--ink);
  opacity:0;pointer-events:none;transition:all .12s var(--ease);z-index:50;
  box-shadow:0 8px 24px -10px rgba(0,0,0,.9);
}
.rail-btn .tip::after{
  content:"";position:absolute;right:100%;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-right-color:var(--line-2);
}
.rail-btn:hover .tip{opacity:1;transform:translateY(-50%) translateX(0);}

/* events / fleet toggle at bottom of rail */
.rail-foot{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;border-top:1px solid var(--line);padding-top:var(--s3);margin-top:var(--s2);}
.rail-util{
  width:44px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid transparent;background:var(--bg-1);transition:all .14s var(--ease);position:relative;
}
.rail-util svg{width:19px;height:19px;opacity:.7;}
.rail-util:hover{background:var(--bg-3);border-color:var(--line-2);}
.rail-util:hover svg{opacity:1;}
.rail-util.active{background:var(--bg-3);border-color:var(--line-hi);}
.rail-util.active svg{opacity:1;color:var(--accent);}
.rail-util .tip{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(-6px);background:var(--bg-3);border:1px solid var(--line-2);padding:5px 10px;border-radius:7px;white-space:nowrap;font-size:var(--t-sm);opacity:0;pointer-events:none;transition:all .12s var(--ease);z-index:50;}
.rail-util:hover .tip{opacity:1;transform:translateY(-50%) translateX(0);}
.rail-util .badge{position:absolute;top:1px;right:3px;min-width:14px;height:14px;border-radius:7px;background:var(--accent);color:#04201f;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;}

/* ============================================================
   MAIN COLUMN
   ============================================================ */
.main{
  position:relative;
  overflow-y:auto;
  background:
    radial-gradient(80% 50% at 50% -10%,rgba(63,208,201,.04),transparent 60%),
    var(--bg);
  scroll-behavior:smooth;
}
.main-inner{max-width:1180px;margin:0 auto;padding:var(--s5) var(--s5) var(--s8);}

/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;gap:var(--s4);
  padding-bottom:var(--s4);margin-bottom:var(--s5);
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.brandline{display:flex;align-items:center;gap:var(--s3);}
.brandline .cursor{color:var(--accent);animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.brandline h1{
  font-size:var(--t-md);font-weight:600;letter-spacing:.5px;color:var(--ink);
}
.brandline .path{color:var(--ink-faint);font-size:var(--t-sm);}
.brandline .path em{color:var(--ink-dim);font-style:normal;}

.host-strip{margin-left:auto;display:flex;align-items:center;gap:var(--s5);}
.host-meter{display:flex;flex-direction:column;gap:5px;min-width:108px;}
.host-meter .hm-top{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-xs);color:var(--ink-dim);letter-spacing:.4px;}
.host-meter .hm-top b{color:var(--ink);font-size:var(--t-sm);font-weight:600;}
.host-meter .hm-top svg{width:12px;height:12px;opacity:.6;vertical-align:-2px;margin-right:4px;}
.bar{height:5px;border-radius:4px;background:var(--bg-3);overflow:hidden;position:relative;}
.bar > span{position:absolute;inset:0;width:0;border-radius:4px;transition:width .6s var(--ease);}
.bar .fill-g{background:linear-gradient(90deg,var(--accent-dim),var(--accent));}
.bar .fill-a{background:linear-gradient(90deg,#6e5d1c,var(--amber));}
.uptime-pill{
  display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--bg-1);font-size:var(--t-xs);color:var(--ink-dim);
  letter-spacing:.5px;white-space:nowrap;
}
.uptime-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 7px var(--hot);}
.uptime-pill b{color:var(--ink);}

/* ============================================================
   FLEET VIEW (overview)
   ============================================================ */
.fleet-head{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap;}
.fleet-stats{display:flex;gap:var(--s2);}
.stat-chip{
  display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--bg-1);
}
.stat-chip .n{font-size:var(--t-xl);font-weight:600;line-height:1;letter-spacing:-.5px;}
.stat-chip .lbl{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;}
.stat-chip .sdot{width:8px;height:8px;border-radius:50%;}
.sdot.hosting{background:var(--hot);box-shadow:0 0 6px var(--hot);}
.sdot.idle{background:var(--amber);}
.sdot.down{background:var(--grey);}
.stat-chip.hosting .n{color:var(--hot);}
.stat-chip.idle .n{color:var(--amber);}
.stat-chip.down .n{color:var(--ink-dim);}

.fleet-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:var(--s4);
}
.tile{
  position:relative;
  border:1px solid var(--line);border-radius:var(--radius-lg);
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  padding:var(--s4);
  cursor:pointer;overflow:hidden;
  transition:border-color .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease);
}
.tile:hover{border-color:var(--line-hi);transform:translateY(-2px);box-shadow:0 16px 40px -22px rgba(0,0,0,.9);}
.tile:active{transform:translateY(0);}
.tile.down{opacity:.92;background:linear-gradient(180deg,#121212,#0e0e0e);}
.tile.down:hover{border-color:var(--red);}
/* left status accent */
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
.tile.hosting::before{background:linear-gradient(180deg,var(--hot),transparent);}
.tile.idle::before{background:linear-gradient(180deg,var(--amber),transparent);}
.tile.down::before{background:linear-gradient(180deg,var(--grey),transparent);}

.tile-top{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s4);}
.tile-ico{
  width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--bg-3);border:1px solid var(--line-2);position:relative;
}
.tile-ico svg{width:23px;height:23px;}
.tile-id{flex:1;min-width:0;}
.tile-id .nm{font-size:var(--t-md);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-id .gm{font-size:var(--t-xs);color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;}
.tile-status{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:1px;font-weight:600;flex:none;padding-top:3px;}
.tile-status .d{width:8px;height:8px;border-radius:50%;}
.tile-status.hosting{color:var(--hot);} .tile-status.hosting .d{background:var(--hot);box-shadow:0 0 7px var(--hot);animation:beacon 2.4s infinite;}
.tile-status.idle{color:var(--amber);} .tile-status.idle .d{background:var(--amber);}
.tile-status.down{color:var(--ink-dim);} .tile-status.down .d{background:var(--grey);}

/* metric row in tile */
.tile-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s2);margin-bottom:var(--s3);}
.metric{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;}
.metric .mv{font-size:var(--t-md);font-weight:600;color:var(--ink);letter-spacing:-.3px;line-height:1.1;}
.metric .mv small{font-size:var(--t-xs);color:var(--ink-faint);font-weight:400;}
.metric .ml{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;margin-top:3px;display:flex;align-items:center;gap:4px;}
.metric .ml svg{width:10px;height:10px;opacity:.6;}
.metric.dim .mv{color:var(--ink-faint);}

/* sparkline */
.spark{height:26px;margin-top:7px;}
.spark svg{width:100%;height:100%;overflow:visible;}

/* tile footer: map + join hint */
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line);}
.tile-map{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);color:var(--ink-dim);min-width:0;}
.tile-map svg{width:13px;height:13px;opacity:.6;flex:none;}
.tile-map span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-go{display:flex;align-items:center;gap:5px;font-size:var(--t-xs);color:var(--ink-faint);transition:color .14s var(--ease),transform .14s var(--ease);flex:none;}
.tile:hover .tile-go{color:var(--accent);transform:translateX(3px);}
.tile-go svg{width:13px;height:13px;}

/* down tile cta */
.down-cta{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line);}
.down-msg{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);color:var(--ink-dim);}
.down-msg svg{width:14px;height:14px;color:var(--grey);}

/* ============================================================
   DETAIL VIEW
   ============================================================ */
.detail{display:none;}
.detail.show{display:block;animation:fadein .2s var(--ease);}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.crumb{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4);font-size:var(--t-sm);color:var(--ink-faint);}
.crumb button{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-1);transition:all .14s var(--ease);color:var(--ink-dim);}
.crumb button:hover{border-color:var(--line-hi);color:var(--ink);background:var(--bg-3);}
.crumb button svg{width:13px;height:13px;}
.crumb .sep{opacity:.5;}
.crumb em{color:var(--ink);font-style:normal;}

/* detail header card */
.dhead{
  display:flex;align-items:center;gap:var(--s4);
  padding:var(--s4) var(--s5);border:1px solid var(--line);border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--bg-2),var(--bg-1));margin-bottom:var(--s4);
  position:relative;overflow:hidden;flex-wrap:wrap;
}
.dhead-ico{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;background:var(--bg-3);border:1px solid var(--line-2);flex:none;}
.dhead-ico svg{width:30px;height:30px;}
.dhead-id{flex:1;min-width:180px;}
.dhead-id .nm{font-size:var(--t-lg);font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:var(--s3);}
.dhead-id .gm{font-size:var(--t-xs);color:var(--ink-faint);letter-spacing:.3px;margin-top:2px;}
.statusbadge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;border:1px solid;}
.statusbadge .d{width:8px;height:8px;border-radius:50%;}
.statusbadge.hosting{color:var(--hot);border-color:rgba(66,245,39,.35);background:rgba(66,245,39,.07);}
.statusbadge.hosting .d{background:var(--hot);box-shadow:0 0 7px var(--hot);animation:beacon 2.4s infinite;}
.statusbadge.idle{color:var(--amber);border-color:rgba(194,161,58,.35);background:rgba(194,161,58,.07);}
.statusbadge.idle .d{background:var(--amber);}
.statusbadge.down{color:var(--ink-dim);border-color:var(--line-2);background:var(--bg-3);}
.statusbadge.down .d{background:var(--grey);}

/* join string in header */
.joinwrap{display:flex;align-items:stretch;gap:0;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--bg);max-width:100%;}
.joinwrap .jl{display:grid;place-items:center;padding:0 11px;background:var(--bg-3);border-right:1px solid var(--line-2);color:var(--ink-faint);}
.joinwrap .jl svg{width:14px;height:14px;}
.joinwrap code{padding:9px 12px;font-size:var(--t-sm);color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.joinwrap .copy{padding:0 13px;background:var(--bg-3);border-left:1px solid var(--line-2);color:var(--ink-dim);transition:all .14s var(--ease);display:grid;place-items:center;}
.joinwrap .copy:hover{background:var(--accent-dim);color:#eafffd;}
.joinwrap .copy.ok{color:var(--hot);background:rgba(66,245,39,.12);}
.joinwrap .copy svg{width:15px;height:15px;}

/* big metric tiles row */
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s4);}
.bigmetric{
  border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  padding:var(--s4);position:relative;overflow:hidden;min-height:108px;display:flex;flex-direction:column;
}
.bigmetric .bm-l{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.bigmetric .bm-l svg{width:13px;height:13px;opacity:.6;}
.bigmetric .bm-v{font-size:var(--t-2xl);font-weight:600;letter-spacing:-1px;line-height:1;color:var(--ink);}
.bigmetric .bm-v small{font-size:var(--t-md);color:var(--ink-faint);font-weight:400;letter-spacing:0;}
.bigmetric .bm-sub{font-size:var(--t-xs);color:var(--ink-faint);margin-top:auto;padding-top:8px;}
.bigmetric .bm-spark{position:absolute;right:0;bottom:0;left:0;height:40px;opacity:.55;pointer-events:none;}
.bigmetric .bm-spark svg{width:100%;height:100%;}
.bigmetric.accent .bm-v{color:var(--accent);}
.bigmetric.dim .bm-v{color:var(--ink-faint);}
.bigmetric .bm-ring{position:absolute;top:var(--s4);right:var(--s4);width:30px;height:30px;}

/* ---- POWER toolbar ---- */
.powerbar{
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s3);border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-1);margin-bottom:var(--s4);
}
.powerbar .pb-l{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:1.5px;margin-right:var(--s2);}
.powerbar .pb-l svg{width:14px;height:14px;}
.pbtn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink);
  font-size:var(--t-sm);letter-spacing:.3px;transition:all .13s var(--ease);
  min-height:38px;
}
.pbtn svg{width:15px;height:15px;}
.pbtn:hover{border-color:var(--line-hi);background:#222;transform:translateY(-1px);}
.pbtn:active{transform:translateY(0);}
.pbtn.primary{background:linear-gradient(180deg,#2a7e26,#1d5e1a);border-color:#327a2c;color:#eafff0;font-weight:600;box-shadow:0 6px 18px -10px rgba(66,245,39,.6);}
.pbtn.primary:hover{background:linear-gradient(180deg,#2f8f2a,#226e1f);}
.pbtn.danger{color:var(--red-hot);border-color:rgba(184,95,95,.4);}
.pbtn.danger:hover{background:rgba(184,95,95,.12);border-color:var(--red);}
.pbtn.ghost{background:transparent;}
.pbtn.icon{padding:9px 11px;}
.pbtn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;}
.pb-spacer{flex:1;}

/* ---- segmented control ---- */
.segwrap{margin-bottom:var(--s4);position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding-top:2px;}
.seg{
  display:inline-flex;gap:2px;padding:4px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg-1);position:relative;
  max-width:100%;overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none;}
.seg-btn{
  position:relative;z-index:2;display:flex;align-items:center;gap:7px;
  padding:8px 15px;border-radius:8px;font-size:var(--t-sm);letter-spacing:.4px;
  color:var(--ink-dim);transition:color .15s var(--ease);white-space:nowrap;
}
.seg-btn svg{width:14px;height:14px;opacity:.8;}
.seg-btn:hover{color:var(--ink);}
.seg-btn.active{color:var(--ink);}
.seg-glow{
  position:absolute;z-index:1;top:4px;bottom:4px;border-radius:8px;
  background:var(--bg-3);border:1px solid var(--line-hi);
  box-shadow:inset 0 0 0 1px rgba(63,208,201,.12);
  transition:left .22s var(--ease),width .22s var(--ease);
}

/* ---- panes ---- */
.pane{display:none;animation:fadein .18s var(--ease);}
.pane.show{display:block;}

.panel{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg-1);overflow:hidden;}
.panel + .panel{margin-top:var(--s4);}
.panel-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s4);border-bottom:1px solid var(--line);}
.panel-h .ph-t{display:flex;align-items:center;gap:9px;font-size:var(--t-sm);text-transform:uppercase;letter-spacing:1.4px;color:var(--ink-dim);}
.panel-h .ph-t svg{width:15px;height:15px;color:var(--accent);opacity:.85;}
.panel-h .ph-r{margin-left:auto;display:flex;align-items:center;gap:var(--s2);}
.panel-b{padding:var(--s4);}

/* ---- runtime: quick actions ---- */
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--s2);}
.qa{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 8px;border-radius:11px;border:1px solid var(--line-2);background:var(--bg-3);
  transition:all .13s var(--ease);text-align:center;
}
.qa svg{width:20px;height:20px;color:var(--ink-dim);transition:color .13s var(--ease);}
.qa span{font-size:var(--t-xs);color:var(--ink-dim);letter-spacing:.3px;}
.qa:hover{border-color:var(--accent-dim);background:#1a2120;transform:translateY(-2px);}
.qa:hover svg{color:var(--accent);}
.qa:hover span{color:var(--ink);}
.qa:active{transform:translateY(0)scale(.97);}

/* ---- sliders ---- */
.sliders{display:grid;gap:var(--s5);}
.slider-row{}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.slider-top .sl{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--ink);letter-spacing:.3px;}
.slider-top .sl svg{width:15px;height:15px;color:var(--ink-dim);}
.slider-top .sv{font-size:var(--t-base);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;}
.slider-top .sv small{color:var(--ink-faint);font-weight:400;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;background:var(--bg-3);outline:none;cursor:pointer;border:1px solid var(--line);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eafffd,var(--accent));border:1px solid var(--accent);box-shadow:0 0 0 4px rgba(63,208,201,.12),0 2px 6px rgba(0,0,0,.6);transition:box-shadow .12s var(--ease);}
input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 6px rgba(63,208,201,.18),0 2px 8px rgba(0,0,0,.6);}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:1px solid var(--accent);}
.slider-ticks{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-faint);margin-top:6px;}

/* ---- change map ---- */
.mapchange{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;}
.selectish{position:relative;flex:1;min-width:200px;}
.selectish select{
  -webkit-appearance:none;appearance:none;width:100%;padding:11px 38px 11px 14px;
  border-radius:9px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink);
  font-size:var(--t-sm);cursor:pointer;
}
.selectish select:focus{border-color:var(--accent-dim);outline:none;}
.selectish::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink-dim);border-bottom:2px solid var(--ink-dim);transform:translateY(-70%)rotate(45deg);pointer-events:none;}

/* ---- console ---- */
.console{background:#070707;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;}
.console-h{display:flex;align-items:center;gap:9px;padding:11px var(--s4);border-bottom:1px solid var(--line);background:var(--bg-1);}
.console-h .dots{display:flex;gap:6px;}
.console-h .dots i{width:10px;height:10px;border-radius:50%;display:block;}
.console-h .dots i:nth-child(1){background:#3a2020;} .console-h .dots i:nth-child(2){background:#3a3020;} .console-h .dots i:nth-child(3){background:#1f3320;}
.console-h .ttl{font-size:var(--t-xs);color:var(--ink-faint);letter-spacing:1px;text-transform:uppercase;}
.console-h .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--hot);letter-spacing:1px;}
.console-h .live .d{width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 6px var(--hot);animation:beacon 1.6s infinite;}
.console-out{padding:var(--s3) var(--s4);height:240px;overflow-y:auto;font-size:var(--t-sm);line-height:1.7;}
.console-out .ln{display:flex;gap:10px;white-space:pre-wrap;word-break:break-word;}
.console-out .ln .ts{color:var(--ink-faint);flex:none;}
.console-out .ln .tx{color:var(--ink-dim);}
.console-out .ln.cmd .tx{color:var(--accent);}
.console-out .ln.cmd .ts{color:var(--accent-dim);}
.console-out .ln.ok .tx{color:var(--green);}
.console-out .ln.warn .tx{color:var(--amber);}
.console-out .ln.err .tx{color:var(--red-hot);}
.console-in{display:flex;align-items:center;gap:9px;padding:11px var(--s4);border-top:1px solid var(--line);background:var(--bg);}
.console-in .pr{color:var(--accent);font-weight:600;}
.console-in input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:var(--t-sm);}
.console-in input::placeholder{color:var(--ink-faint);}
.console-in button{padding:7px 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink-dim);transition:all .13s var(--ease);}
.console-in button:hover{border-color:var(--accent-dim);color:var(--accent);}

/* ---- profiles ---- */
.prof-tabs{display:flex;gap:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap;}
.prof-tab{
  display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--bg-3);transition:all .14s var(--ease);
}
.prof-tab .pd{width:8px;height:8px;border-radius:2px;background:var(--ink-faint);}
.prof-tab.active{border-color:var(--accent-dim);background:#162020;box-shadow:inset 0 0 0 1px rgba(63,208,201,.15);}
.prof-tab.active .pd{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.prof-tab.active span{color:var(--ink);}
.prof-tab span{color:var(--ink-dim);font-size:var(--t-sm);}
.prof-tab.add{border-style:dashed;color:var(--ink-faint);}
.prof-tab.add svg{width:14px;height:14px;}

.field-group{margin-bottom:var(--s5);}
.field-group .fg-h{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:1.4px;color:var(--ink-faint);margin-bottom:var(--s3);display:flex;align-items:center;gap:8px;}
.field-group .fg-h::after{content:"";flex:1;height:1px;background:var(--line);}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3);}
.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-size:var(--t-xs);color:var(--ink-dim);letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
.field label svg{width:12px;height:12px;opacity:.6;}
.field input,.field select{padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink);font-size:var(--t-sm);}
.field input:focus,.field select:focus{border-color:var(--accent-dim);outline:none;}
/* toggle */
.toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-3);}
.toggle span{font-size:var(--t-sm);color:var(--ink);display:flex;align-items:center;gap:8px;}
.toggle span svg{width:14px;height:14px;color:var(--ink-dim);}
.sw{width:42px;height:24px;border-radius:999px;background:var(--bg);border:1px solid var(--line-2);position:relative;transition:all .16s var(--ease);flex:none;}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-faint);transition:all .16s var(--ease);}
.sw.on{background:rgba(63,208,201,.18);border-color:var(--accent-dim);}
.sw.on::after{left:20px;background:var(--accent);box-shadow:0 0 8px var(--accent);}

/* ---- maps ---- */
.maps-list{display:flex;flex-direction:column;gap:var(--s2);}
.map-item{display:flex;align-items:center;gap:var(--s3);padding:12px var(--s3);border-radius:10px;border:1px solid var(--line);background:var(--bg-3);transition:all .13s var(--ease);}
.map-item:hover{border-color:var(--line-hi);}
.map-item .idx{width:24px;height:24px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:var(--t-xs);color:var(--ink-faint);flex:none;}
.map-item.current .idx{background:rgba(66,245,39,.12);color:var(--hot);}
.map-item .thumb{width:46px;height:34px;border-radius:6px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);background:linear-gradient(135deg,#161616,#101010);overflow:hidden;}
.map-item .thumb svg{width:18px;height:18px;opacity:.4;}
.map-item .mi-id{flex:1;min-width:0;}
.map-item .mi-id .nm{font-size:var(--t-sm);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.map-item .mi-id .tag{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;}
.map-item .now{font-size:9px;color:var(--hot);text-transform:uppercase;letter-spacing:1.5px;border:1px solid rgba(66,245,39,.3);padding:3px 8px;border-radius:999px;}
.map-item .grab{color:var(--ink-faint);cursor:grab;}
.map-item .grab svg{width:16px;height:16px;}

/* ---- raw editor ---- */
.editor{background:#070707;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;}
.editor-h{display:flex;align-items:center;gap:var(--s3);padding:11px var(--s4);border-bottom:1px solid var(--line);background:var(--bg-1);}
.editor-h .fn{font-size:var(--t-xs);color:var(--ink-dim);}
.editor-h .fn b{color:var(--ink);}
.editor-body{display:flex;font-size:var(--t-sm);line-height:1.7;}
.editor-gutter{padding:var(--s3) 10px var(--s3) var(--s4);text-align:right;color:var(--ink-faint);user-select:none;background:rgba(255,255,255,.012);border-right:1px solid var(--line);font-variant-numeric:tabular-nums;}
.editor textarea{flex:1;background:none;border:none;outline:none;resize:vertical;padding:var(--s3) var(--s4);color:var(--ink);font-family:var(--mono);font-size:var(--t-sm);line-height:1.7;min-height:300px;white-space:pre;overflow-wrap:normal;tab-size:2;}

/* ============================================================
   EVENTS DRAWER
   ============================================================ */
.events-view{display:none;}
.events-view.show{display:block;animation:fadein .2s var(--ease);}
.ev-head{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap;}
.ev-title{display:flex;align-items:center;gap:11px;font-size:var(--t-lg);font-weight:600;}
.ev-title svg{width:22px;height:22px;color:var(--accent);}
.ev-filter{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.fchip{padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-1);font-size:var(--t-xs);color:var(--ink-dim);transition:all .13s var(--ease);display:flex;align-items:center;gap:6px;}
.fchip .fd{width:7px;height:7px;border-radius:50%;}
.fchip:hover{border-color:var(--line-hi);color:var(--ink);}
.fchip.active{background:var(--bg-3);border-color:var(--accent-dim);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(63,208,201,.12);}

.ev-list{display:flex;flex-direction:column;}
.ev-row{
  display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;gap:var(--s3);
  padding:14px var(--s4);border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-1);margin-bottom:var(--s2);transition:border-color .13s var(--ease);
}
.ev-row:hover{border-color:var(--line-hi);}
.ev-av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:var(--t-md);font-weight:600;color:var(--bg);text-transform:uppercase;}
.ev-who{min-width:0;}
.ev-who .nm{font-size:var(--t-base);color:var(--ink);font-weight:600;}
.ev-who .sv{font-size:var(--t-xs);color:var(--ink-dim);display:flex;align-items:center;gap:6px;margin-top:2px;}
.ev-who .sv svg{width:12px;height:12px;opacity:.7;}
.ev-time{text-align:right;font-size:var(--t-xs);color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.ev-time b{color:var(--ink-dim);font-weight:400;}
.ev-state{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:1px;justify-self:end;padding:5px 11px;border-radius:999px;border:1px solid;}
.ev-state.online{color:var(--hot);border-color:rgba(66,245,39,.3);background:rgba(66,245,39,.06);}
.ev-state.online .d{width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 6px var(--hot);animation:beacon 2s infinite;}
.ev-state.left{color:var(--ink-faint);border-color:var(--line-2);}
.ev-state.left .d{width:7px;height:7px;border-radius:50%;background:var(--grey);}

/* ============================================================
   MODAL (confirm + import)
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:var(--s4);}
.scrim.show{display:flex;animation:fadein .15s var(--ease);}
.modal{width:100%;max-width:420px;border:1px solid var(--line-2);border-radius:var(--radius-lg);background:linear-gradient(180deg,var(--bg-2),var(--bg-1));overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);animation:pop .18s var(--ease);}
@keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-h{display:flex;align-items:center;gap:11px;padding:var(--s4);border-bottom:1px solid var(--line);}
.modal-h .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;}
.modal-h .mi.danger{background:rgba(184,95,95,.12);color:var(--red-hot);border:1px solid rgba(184,95,95,.3);}
.modal-h .mi.accent{background:rgba(63,208,201,.1);color:var(--accent);border:1px solid var(--accent-dim);}
.modal-h .mi svg{width:19px;height:19px;}
.modal-h h3{font-size:var(--t-md);font-weight:600;}
.modal-b{padding:var(--s4);color:var(--ink-dim);font-size:var(--t-sm);line-height:1.6;}
.modal-b code{color:var(--ink);background:var(--bg-3);padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);}
.modal-b input{width:100%;margin-top:var(--s3);padding:11px 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:var(--t-sm);}
.modal-b input:focus{outline:none;border-color:var(--accent-dim);}
.modal-f{display:flex;gap:var(--s2);padding:var(--s4);border-top:1px solid var(--line);justify-content:flex-end;}
.modal-f button{padding:10px 18px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-3);transition:all .13s var(--ease);font-size:var(--t-sm);}
.modal-f button:hover{border-color:var(--line-hi);}
.modal-f button.danger{background:linear-gradient(180deg,#7a2a2a,#5e1d1d);border-color:#7a3232;color:#ffecec;font-weight:600;}
.modal-f button.danger:hover{background:linear-gradient(180deg,#8f2f2f,#6e2222);}
.modal-f button.accent{background:linear-gradient(180deg,#1f6e6a,#155551);border-color:#247a74;color:#eafffd;font-weight:600;}

/* ---- toast ---- */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;border:1px solid var(--line-hi);background:var(--bg-3);box-shadow:0 16px 40px -16px rgba(0,0,0,.9);font-size:var(--t-sm);color:var(--ink);animation:toastin .25s var(--ease);}
.toast svg{width:16px;height:16px;flex:none;}
.toast.ok svg{color:var(--hot);} .toast.info svg{color:var(--accent);} .toast.warn svg{color:var(--amber);} .toast.err svg{color:var(--red-hot);}
@keyframes toastin{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.toast.out{animation:toastout .25s var(--ease) forwards;}
@keyframes toastout{to{transform:translateY(16px);opacity:0;}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
.mobile-only{display:none;}
@media(max-width:760px){
  :root{--rail-w:54px;}
  .main-inner{padding:var(--s4) var(--s3) var(--s8);}
  .host-strip{order:3;width:100%;margin-left:0;justify-content:space-between;gap:var(--s3);}
  .host-meter{min-width:0;flex:1;}
  .mrow{grid-template-columns:1fr 1fr;}
  .fleet-grid{grid-template-columns:1fr;}
  .ev-row{grid-template-columns:36px 1fr;grid-template-areas:"av who" "av meta";row-gap:8px;}
  .ev-av{grid-area:av;}
  .ev-who{grid-area:who;}
  .ev-time{grid-area:meta;text-align:left;justify-self:start;}
  .ev-state{grid-area:meta;justify-self:end;}
  .topbar .path{display:none;}
  .dhead{padding:var(--s4);}
  .powerbar .pb-l{width:100%;margin-bottom:6px;}
  .joinwrap{order:5;width:100%;}
  .dhead-id{width:100%;}
  .corner-tag{bottom:auto;top:8px;right:8px;}
}
@media(max-width:420px){
  .mrow{grid-template-columns:1fr;}
  .qa-grid{grid-template-columns:repeat(2,1fr);}
  .stat-chip{padding:9px 12px;}
  .pbtn span.lbl{display:none;}
  .pbtn.icon span.lbl{display:none;}
}
/* reduce motion */
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const get = id => SERVERS.find(s=>s.id===id);
const statusLabel = s => s==='hosting'?'HOSTING':s==='idle'?'IDLE':s==='down'?'DOWN':'BUSY';

function sparkline(data, color, w=120, h=26){
  const max = Math.max(...data, 1);
  const min = Math.min(...data, 0);
  const range = (max-min)||1;
  const step = w/(data.length-1);
  const pts = data.map((v,i)=>[i*step, h - ((v-min)/range)*(h-3) - 1.5]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L ${w} ${h} L 0 ${h} Z`;
  const gid = 'g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

function ring(pct, color){
  const r=12, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="${r}" fill="none" stroke="#222" stroke-width="3"/>
    <circle cx="15" cy="15" r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 15 15)"/></svg>`;
}

let toastTimer;
function toast(msg, kind='info'){
  const w=$('#toastWrap');
  const icon = kind==='ok'?I.check : kind==='warn'?I.alert : kind==='err'?I.alert : I.zap;
  const t=el('div','toast '+kind, svg(icon)+`<span>${msg}</span>`);
  w.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250);},2200);
}

function renderPowerbar(s){
  const down=s.status==='down';
  const pb=$('#powerbar');
  const btn=(cls,ic,lbl,fn)=>`<button class="pbtn ${cls}" data-act="${fn}">${svg(I[ic],{sw:1.8})}<span class="lbl">${lbl}</span></button>`;
  pb.innerHTML = `
    <span class="pb-l">${svg(I.power,{sw:1.8})} power</span>
    ${down
      ? btn('primary','play','Start','start')
      : btn('','restart','Restart','restart')}
    ${down ? '' : btn('','stop','Stop','stop')}
    ${down ? '' : btn('danger','power','Force Stop','force')}
    <span class="pb-spacer"></span>
    ${btn('ghost','update','Update','update')}
    ${btn('ghost icon','refresh','Refresh','refresh')}
  `;
  $$('.pbtn',pb).forEach(b=>{
    b.onclick=()=>powerAction(b.dataset.act, s);
  });
}

function powerAction(act, s){
  if(act==='force'){
    confirmModal({
      title:'Force stop '+s.name+'?',
      body:`This <b style="color:var(--red-hot)">kills the container immediately</b> — any unsaved state on <code>${s.map}</code> may be lost. Players will be dropped.`,
      confirmLabel:'Force Stop',
      onConfirm:()=>{ toast(s.name+' force-stopped', 'warn'); }
    });
    return;
  }
  const verbs={start:'Starting',restart:'Restarting',stop:'Stopping',update:'Updating',refresh:'Refreshing'};
  toast(verbs[act]+' '+s.name+'…', act==='refresh'?'info':'ok');
}

function setSeg(pane, animate=true){
  currentPane=pane;
  const btns=$$('.seg-btn');
  const glow=$('#segGlow');
  btns.forEach(b=>{
    const on=b.dataset.pane===pane;
    b.classList.toggle('active',on);
    if(on){
      glow.style.left=b.offsetLeft+'px';
      glow.style.width=b.offsetWidth+'px';
    }
  });
  $$('.pane').forEach(p=>p.classList.remove('show'));
  $('#pane-'+pane).classList.add('show');
}
$('#seg').addEventListener('click',e=>{
  const b=e.target.closest('.seg-btn'); if(!b)return;
  setSeg(b.dataset.pane);
});

const CONSOLE_SEED = {
  mc:[
    {t:'19:42:11',c:'',k:'',x:'[Server thread/INFO]: miles joined the game'},
    {t:'19:44:03',c:'',k:'',x:'[Server thread/INFO]: brandon joined the game'},

  ],
  factorio:[
    {t:'12:01:55',c:'',k:'',x:'[JOIN] connor joined the game'},
    {t:'12:30:10',c:'',k:'ok',x:'Saving game as /factorio/saves/_active.zip'},
  ],
  cs2:[
    {t:'—',c:'',k:'warn',x:'Server is IDLE — 0 players, map de_dust2'},
    {t:'18:50:02',c:'',k:'',x:'Dropped josh from server'},
  ],
  prophunt:[
    {t:'22:10:01',c:'',k:'',x:'connor connected (STEAM_0:1:xxxxx)'},
    {t:'22:18:44',c:'',k:'',x:'mara connected'},
    {t:'22:20:00',c:'',k:'ok',x:'round started · ph_restaurant · 5 players'},
  ],
};
function setupConsole(s){
  const out=$('#consoleOut');
  out.innerHTML='';
  const seed = CONSOLE_SEED[s.id]||[{t:'—',c:'',k:'',x:'rcon channel open'}];
  seed.forEach(l=>pushLine(out,l.t,l.x,l.k,l.c));
  out.scrollTop=out.scrollHeight;
  const inp=$('#consoleIn');
  const fire=()=>{
    const v=inp.value.trim(); if(!v)return;
    const ts=new Date().toTimeString().slice(0,8);
    pushLine(out,ts,v,'',true);
    inp.value='';
    setTimeout(()=>{
      const resp = fakeResponse(v,s);
      pushLine(out,ts,resp.x,resp.k);
      out.scrollTop=out.scrollHeight;
    },180);
    out.scrollTop=out.scrollHeight;
  };
  $('#consoleSend').onclick=fire;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')fire(); });
}
function pushLine(out,ts,text,kind,isCmd){
  const ln=el('div','ln'+(isCmd?' cmd':'')+(kind?' '+kind:''));
  ln.innerHTML=`<span class="ts">${isCmd?'>':ts}</span><span class="tx">${text}</span>`;
  out.appendChild(ln);
}
function fakeResponse(cmd,s){
  const c=cmd.toLowerCase();
  if(c==='status') return {x:`hostname: ${s.name}\nmap: ${s.map}  players: ${s.players}${s.cap!=null?'/'+s.cap:''}  cpu: ${s.cpu}%`,k:''};
  if(c.startsWith('say')) return {x:'[rcon] message broadcast',k:'ok'};
  if(c.startsWith('changelevel')||c.startsWith('map ')) return {x:'changelevel queued: '+cmd.split(' ')[1],k:'ok'};
  if(c==='help') return {x:'commands: status · say <msg> · map <name> · kick <id> · sv_gravity <n>',k:''};
  return {x:`'${cmd}' accepted`,k:'ok'};
}

    </div>
  `;

  $$('#profTabs .prof-tab[data-i]').forEach(b=>b.onclick=()=>{ profileState[s.id]=+b.dataset.i; renderProfiles(s); });
  $('#profTabs [data-add]').onclick=()=>toast('New profile — clone current?', 'info');
  $('#applyProf').onclick=()=>{
    if(applyLive) toast(s.profiles[sel]+' applied live', 'ok');
    else confirmModal({
      title:'Apply & restart?',
      body:`Applying <b style="color:var(--ink)">${s.profiles[sel]}</b> restarts the container so the config takes effect. Players will be briefly disconnected.`,
      confirmLabel:'Apply & Restart', accent:true,
      onConfirm:()=>toast('Applied '+s.profiles[sel]+' · restarting…','ok')
    });
  };
  $$('#pane-profiles [data-sw]').forEach(sw=>sw.onclick=()=>sw.classList.toggle('on'));
}

/* ---- MAPS ---- */
function renderMaps(s){
  const p=$('#pane-maps');
  const isWorkshop = ['gmod','prophunt','cs2'].includes(s.id);
  p.innerHTML=`
    <div class="panel">
      <div class="panel-h">
        <div class="ph-t">${svg(I.map)} ${s.id==='factorio'?'Saves':'Rotation'} · ${s.maps.length}</div>
        <div class="ph-r">
          ${isWorkshop?`<button class="pbtn" id="importBtn">${svg(I.download,{sw:1.8})}<span>Import Collection</span></button>`:''}
          <button class="pbtn ghost" id="addMapBtn">${svg(I.plus,{sw:1.8})}<span class="lbl">Add</span></button>
        </div>
      </div>
      <div class="panel-b">
        <div class="maps-list">
          ${s.maps.map((m,i)=>`
            <div class="map-item ${m.cur?'current':''}">
              <div class="idx">${i+1}</div>
              <div class="thumb">${svg(I.map)}</div>
              <div class="mi-id"><div class="nm">${m.n}</div><div class="tag">${m.t}</div></div>
              ${m.cur?`<div class="now">live</div>`:''}
              <div class="grab">${svg(I.drag)}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
  if(isWorkshop) $('#importBtn').onclick=()=>importModal(s);
  $('#addMapBtn').onclick=()=>toast('Add map to rotation', 'info');
}

/* ---- RAW ---- */
function renderRaw(s){
  const p=$('#pane-raw');
  const lines = s.raw.split('\n');
  p.innerHTML=`
    <div class="editor">
      <div class="editor-h">
        <div class="dots" style="display:flex;gap:6px"><i style="width:10px;height:10px;border-radius:50%;background:#3a2020;display:block"></i><i style="width:10px;height:10px;border-radius:50%;background:#3a3020;display:block"></i><i style="width:10px;height:10px;border-radius:50%;background:#1f3320;display:block"></i></div>
        <div class="fn">editing <b>${s.rawFile}</b></div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="pbtn ghost" id="rawRevert">${svg(I.refresh,{sw:1.8})}<span class="lbl">Revert</span></button>
          <button class="pbtn primary" id="rawSave">${svg(I.save,{sw:1.8})}<span>Save</span></button>
        </div>
      </div>
      <div class="editor-body">
        <div class="editor-gutter" id="rawGutter">${lines.map((_,i)=>i+1).join('\n')}</div>
        <textarea id="rawText" spellcheck="false">${s.raw.replace(/</g,'&lt;')}</textarea>
      </div>
    </div>
  `;
  const ta=$('#rawText'), gut=$('#rawGutter');
  const syncGutter=()=>{ const n=ta.value.split('\n').length; gut.textContent=Array.from({length:n},(_,i)=>i+1).join('\n'); };
  ta.addEventListener('input',syncGutter);
  ta.addEventListener('scroll',()=>{gut.scrollTop=ta.scrollTop;});
  $('#rawSave').onclick=()=>{ toast(s.rawFile+' saved', 'ok'); };
  $('#rawRevert').onclick=()=>{ ta.value=s.raw; syncGutter(); toast('Reverted changes', 'info'); };
}

/* ============================================================
   COPY
   ============================================================ */
function copyJoin(str){
  const btn=$('#copyJoin');
  const done=()=>{
    btn.classList.add('ok'); btn.innerHTML=svg(I.check,{sw:2});
    toast('Join string copied', 'ok');
    setTimeout(()=>{btn.classList.remove('ok'); btn.innerHTML=svg(I.copy,{sw:1.8});},1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(done).catch(()=>{fallbackCopy(str);done();});
  } else { fallbackCopy(str); done(); }
}
function fallbackCopy(str){
  const t=document.createElement('textarea'); t.value=str; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  try{document.execCommand('copy');}catch(e){}
  t.remove();
}

/* ============================================================
   MODALS
   ============================================================ */
function confirmModal({title,body,confirmLabel,onConfirm,accent}){
  const m=$('#modal');
  m.innerHTML=`
    <div class="modal-h"><div class="mi ${accent?'accent':'danger'}">${svg(accent?I.restart:I.alert)}</div><h3>${title}</h3></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f"><button id="mCancel">Cancel</button><button class="${accent?'accent':'danger'}" id="mOk">${confirmLabel}</button></div>`;
  showScrim();
  $('#mCancel').onclick=hideScrim;
  $('#mOk').onclick=()=>{ hideScrim(); onConfirm&&onConfirm(); };
}
function importModal(s){
  const m=$('#modal');
  m.innerHTML=`
    <div class="modal-h"><div class="mi accent">${svg(I.download)}</div><h3>Import Workshop collection</h3></div>
    <div class="modal-b">
      Paste a Steam Workshop <b style="color:var(--ink)">collection ID</b>. Maps download on next boot and get added to the rotation.
      <input id="collInput" placeholder="e.g. 3737190377" value="${s.id==='prophunt'?'3737190377':''}" autocomplete="off">
    </div>
    <div class="modal-f"><button id="mCancel">Cancel</button><button class="accent" id="mOk">${svg(I.download,{sw:1.8})} Import</button></div>`;
  showScrim();
  setTimeout(()=>$('#collInput').focus(),50);
  $('#mCancel').onclick=hideScrim;
  $('#mOk').onclick=()=>{
    const v=$('#collInput').value.trim();
    hideScrim();
    toast(v?('Importing collection '+v+'…'):'Enter a collection ID', v?'ok':'warn');
  };
}
function showScrim(){ $('#scrim').classList.add('show'); }
function hideScrim(){ $('#scrim').classList.remove('show'); }
$('#scrim').addEventListener('click',e=>{ if(e.target===$('#scrim'))hideScrim(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')hideScrim(); });

/* ============================================================
   EVENTS
   ============================================================ */
function openEvents(){
  view='events'; currentId=null;
  $('#fleetView').style.display='none';
  $('#detailView').classList.remove('show');
  $('#eventsView').classList.add('show');
  $('#crumbPath').innerHTML='~ / <em>activity</em>';
  $('#eventsUtil').classList.add('active');
  $('#fleetUtil').classList.remove('active');
  renderRail();
  renderEvents();
  $('#main').scrollTop=0;
}
function renderEvents(){
  // filter chips
  const f=$('#evFilter'); f.innerHTML='';
  const all=el('button','fchip'+(evFilter==='all'?' active':''),'All');
  all.onclick=()=>{evFilter='all';renderEvents();};
  f.appendChild(all);
  const used=[...new Set(EVENTS.map(e=>e.sv))];
  used.forEach(svId=>{
    const sv=get(svId);
    const c=el('button','fchip'+(evFilter===svId?' active':''),`<span class="fd" style="background:${sv.accent}"></span>${sv.name}`);
    c.onclick=()=>{evFilter=svId;renderEvents();};
    f.appendChild(c);
  });

  const list=$('#evList'); list.innerHTML='';
  const rows = EVENTS.filter(e=>evFilter==='all'||e.sv===evFilter);
  if(!rows.length){
    list.innerHTML=`<div style="text-align:center;padding:48px;color:var(--ink-faint)">${svg(I.users,{sw:1.5})}<div style="margin-top:12px">No activity for this server.</div></div>`;
    return;
  }
  rows.forEach(e=>{
    const sv=get(e.sv);
    const r=el('div','ev-row');
    const timeLine = e.state==='online'
      ? `${e.joined!=='—'?`since <b>${e.joined}</b> · `:''}online <b>${e.dur}</b>`
      : `left <b>${e.leftAt||'—'}</b> · played <b>${e.dur}</b>`;
    r.innerHTML=`
      <div class="ev-av" style="background:${e.av}">${e.who[0]}</div>
      <div class="ev-who">
        <div class="nm">${e.who}</div>
        <div class="sv">${svg(I[sv.icon])} ${e.svName}</div>
      </div>
      <div class="ev-time">${timeLine}</div>
      <div class="ev-state ${e.state}"><span class="d"></span>${e.state==='online'?'online':'left'}</div>
    `;
    list.appendChild(r);
  });
}

/* ============================================================
   NAV
   ============================================================ */
function goFleet(){
  view='fleet'; currentId=null;
  $('#fleetView').style.display='block';
  $('#detailView').classList.remove('show');
  $('#eventsView').classList.remove('show');
  $('#crumbPath').innerHTML='~ / <em>fleet</em>';
  $('#fleetUtil').classList.remove('active');
  $('#eventsUtil').classList.remove('active');
  renderRail();
  renderFleet();
  $('#main').scrollTop=0;
}
$('#homeBtn').onclick=goFleet;
$('#fleetUtil').onclick=goFleet;
$('#backBtn').onclick=goFleet;
$('#eventsUtil').onclick=openEvents;

window.addEventListener('resize',()=>{ if(view==='detail') setSeg(currentPane,false); });

/* ============================================================
   BOOT
   ============================================================ */
renderRail();
renderFleet();
</script>
