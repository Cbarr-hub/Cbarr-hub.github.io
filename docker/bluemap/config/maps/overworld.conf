# The Minecraft overworld. `world` points at the world folder inside the
# read-only mc-data mount: /app/world/<MC_LEVEL>. The default level is "world"
# (servers.compose.yml MC_LEVEL default) — if you change MC_LEVEL, update this
# path to match (e.g. /app/world/<your-level>).
world: "/app/world/world"
name: "Overworld"
