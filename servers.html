      // Confirm leaving the Profiles tab when there are unsaved edits.
      function guardLeave() {
        if (S.activeTab === 'profiles' && S.dirty) {
          if (!confirm('Discard unsaved profile changes?')) return false
          S.dirty = false
        }
        return true
      }

      function activateTab(name, force) {
        if (!name) return
        if (S.activeTab === name && !force) return
        if (!force && !guardLeave()) {
          // revert visual selection to the current tab
          tabBtns().forEach(b => b.classList.toggle('active', b.dataset.srvtab === S.activeTab))
          return
        }
        S.activeTab = name
        tabBtns().forEach(b => b.classList.toggle('active', b.dataset.srvtab === name))
        TABS.forEach(t => { const p = panelEl(t.key); if (p) p.hidden = t.key !== name })
        if (!S.loaded[name]) {
          S.loaded[name] = true
          if (name === 'runtime') loadRuntime()
          else if (name === 'profiles') loadProfiles()
          else if (name === 'maps') loadMaps()
          else if (name === 'rawcfg') loadRawcfg()
        }
      }

      root.querySelectorAll('[data-srvtab]').forEach(b => {
        b.addEventListener('click', () => activateTab(b.dataset.srvtab))
      })

      // Re-run the visibility gates (e.g. after the schema loads and the game
      // turns out to advertise maps → the Maps tab should appear).
      function regate() {
        const cur = servers.find(x => x.id === id) || S.server
        if (cur) updateStatus(root, cur)
      }

      // ════════════════════════════════════════════════════════════════════
      // RUNTIME TAB
      // ════════════════════════════════════════════════════════════════════
      async function loadRuntime() {
        const body = panelBody('runtime')
        let data
        try { data = await dbGetServerLive(id) }
        catch (e) { body.innerHTML = `<div class="qs-note-block">runtime unavailable: ${esc(e.message)}</div>`; return }
        // Operations (e.g. Factorio "Save Current World As") come from getSettings'
        // `sections` and run via file ops whenever the container is up — they don't
        // need RCON, so they render even when live control is unavailable.
        let settings = null
        try { settings = await dbGetServerSettings(id) } catch {}
        S.live = data
        renderLive(data, settings)
      }

      // One operations section (getSettings().sections[]) → a card with its fields
      // and a Save button. Reuses the .qs-fields label/input grid.
      function renderOpsSection(sec) {
        const inputHtml = (f) => {
          const v = esc(f.value ?? '')
          if (f.type === 'select') return `<select data-ops-field="${esc(f.key)}">${(f.options || []).map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>`
          if (f.type === 'textarea') return `<textarea class="cfg" data-ops-field="${esc(f.key)}">${v}</textarea>`
          return `<input type="${f.type === 'number' ? 'number' : 'text'}" data-ops-field="${esc(f.key)}" value="${v}" placeholder="${esc(f.placeholder || '')}" />`
        }
        return `<div class="rt-block" data-ops-section="${esc(sec.key)}">
          <div class="rt-block-title">${esc(sec.title || 'Operations')}</div>
          <div class="qs-fields">${(sec.fields || []).map(f => `<label>${esc(f.label)}</label>${inputHtml(f)}`).join('')}</div>
          ${sec.note ? `<div class="rt-hint">${esc(sec.note)}</div>` : ''}
          <button class="retro-btn primary" data-ops-save="${esc(sec.key)}">${esc(sec.saveLabel || 'Save')}</button>
        </div>`
      }
      function wireOps(body, sections) {
        body.querySelectorAll('[data-ops-save]').forEach(btn => {
          const key = btn.dataset.opsSave
          const sec = sections.find(s => s.key === key)
          btn.addEventListener('click', () => {
            const root = btn.closest('[data-ops-section]')
            const values = { section: key }
            root.querySelectorAll('[data-ops-field]').forEach(el => { values[el.dataset.opsField] = el.value })
            withBtn(btn, btn.textContent.trim(), async () => {
              const r = await dbSaveServerSettings(id, values)
              logLine(`> ${sec?.title || key}`, r?.saveName ? `saved as “${r.saveName}”` : (r?.ok ? 'done' : JSON.stringify(r)))
            }).catch(() => {})
          })
        })
      }

      function renderLive(data, settings) {
        const body = panelBody('runtime')
        const sections = (settings && Array.isArray(settings.sections)) ? settings.sections : []
        const opsHtml = sections.map(renderOpsSection).join('')
        if (!data || !data.available) {
          body.innerHTML = opsHtml +
            `<div class="qs-note-block">${esc(data?.reason || 'live control unavailable — start the server first')}</div>`
          wireOps(body, sections)
          return
        }
        const actions = (data.actions || []).map(a =>
          `<button class="retro-btn${a.danger ? ' danger' : ''}" data-rt-act="${esc(a.key)}"${a.arg ? ` data-rt-arg="${esc(a.arg)}"` : ''}>${esc(a.label)}</button>`).join('')

        const controls = (data.controls || [])
        const controlsHtml = controls.length ? `
          <div class="rt-block">
            <div class="rt-block-title">Live Tuning <span class="rt-live">live</span></div>
            <div class="rt-ranges">${controls.map(c => {
              const def = c.default ?? c.min ?? 0
              return `<div class="rt-range">
                <label for="rt-${esc(c.key)}">${esc(c.label)}</label>
                <input id="rt-${esc(c.key)}" type="range" data-rt-range="${esc(c.key)}" min="${esc(c.min)}" max="${esc(c.max)}" step="${esc(c.step)}" value="${esc(def)}" />
                <span class="rt-range-val" data-rt-rangeval="${esc(c.key)}">${esc(def)}${esc(c.suffix || '')}</span>
                <button class="retro-btn" data-rt-set="${esc(c.key)}">Set</button>
              </div>`
            }).join('')}</div>
            <div class="rt-hint">Drag a slider, then <b>Set</b> to push it to the running server (cheats-gated values toggle sv_cheats for you).</div>
          </div>` : ''

        let changeMapHtml = ''
        if (data.changeMap) {
          changeMapHtml = `
            <div class="rt-block">
              <div class="rt-block-title">Change Map <span class="rt-live">live</span></div>
              <div class="rt-map-bar">
                <select data-rt-map><option value="">— loading maps… —</option></select>
                <button class="retro-btn" data-rt-changemap>Change Now</button>
              </div>
            </div>`
        }

        body.innerHTML = `
          ${opsHtml}
          ${actions ? `<div class="rt-block">
            <div class="rt-block-title">Quick Actions</div>
            <div class="rt-actions">${actions}</div>
          </div>` : ''}
          ${controlsHtml}
          ${changeMapHtml}
          <div class="rt-block">
            <div class="rt-block-title">Console</div>
            <div class="rt-cmd-bar">
              <input type="text" data-rt-cmd placeholder="${esc(data.commandHint || 'console command…')}" />
              <button class="retro-btn" data-rt-send>Send</button>
            </div>
            <div class="rt-hint">Any console / RCON command — output appears in the console below.</div>
          </div>`

        // quick actions (some may carry an inline arg prompt)
        body.querySelectorAll('[data-rt-act]').forEach(btn => {
          btn.addEventListener('click', () => {
            let value
            if (btn.dataset.rtArg) {
              value = prompt(`${btn.textContent.trim()} — ${btn.dataset.rtArg}:`)
              if (value == null) return
            }
            withBtn(btn, btn.textContent.trim(), async () => {
              const r = await dbServerLiveAction(id, btn.dataset.rtAct, value)
              logLine(`> ${btn.textContent.trim()}`, r?.output)
            }).catch(() => {})
          })
        })

        // live range sliders
        body.querySelectorAll('[data-rt-range]').forEach(slider => {
          const key = slider.dataset.rtRange
          const ctl = controls.find(c => c.key === key)
          const valEl = body.querySelector(`[data-rt-rangeval="${key}"]`)
          slider.addEventListener('input', () => { if (valEl) valEl.textContent = slider.value + (ctl?.suffix || '') })
        })
        body.querySelectorAll('[data-rt-set]').forEach(btn => {
          const key = btn.dataset.rtSet
          const slider = body.querySelector(`[data-rt-range="${key}"]`)
          const ctl = controls.find(c => c.key === key)
          btn.addEventListener('click', () => withBtn(btn, `Set ${ctl?.label || key}`, async () => {
            const r = await dbServerLiveAction(id, key, String(slider.value))
            logLine(`> ${ctl?.label || key} → ${slider.value}${ctl?.suffix || ''}`, r?.output)
          }).catch(() => {}))
        })

        // change-map select — populate from the live settings/schema map block
        if (data.changeMap) {
          const mapSel = body.querySelector('[data-rt-map]')
          populateMapSelect(mapSel)
          const cm = body.querySelector('[data-rt-changemap]')
          if (cm) cm.addEventListener('click', () => {
            const val = mapSel.value
            if (!val) return
            withBtn(cm, 'Change map', async () => {
              const r = await dbServerLiveAction(id, 'change_map', val)
              logLine(`> change map → ${val}`, r?.output)
            }).catch(() => {})
          })
        }

        const cmdEl = body.querySelector('[data-rt-cmd]')
        const send = () => {
          const cmd = cmdEl.value.trim()
          if (!cmd) return
          withBtn(body.querySelector('[data-rt-send]'), cmd, async () => {
            const r = await dbServerLiveCommand(id, cmd)
            logLine(`> ${cmd}`, r?.output); cmdEl.value = ''
          }).catch(() => {}).finally(() => cmdEl.focus())
        }
        body.querySelector('[data-rt-send]').addEventListener('click', send)
        cmdEl.addEventListener('keydown', e => { if (e.key === 'Enter') send() })

        wireOps(body, sections)
      }

      // reusable map-select populator (stock / collection / workshop optgroups)
      async function populateMapSelect(sel) {
        if (!sel) return
        let opts = ''
        try {
          const m = (await dbGetServerSettings(id))?.map || { stock: [], collection: [], workshop: [], current: '' }
          const plainGroup = (label, names) => names?.length
            ? `<optgroup label="${label}">` + names.map(n => `<option value="${esc(n)}"${n === m.current ? ' selected' : ''}>${esc(n)}</option>`).join('') + '</optgroup>'
            : ''
          opts = plainGroup('Stock', m.stock)
          opts += plainGroup('Collection', m.collection)
          if (m.workshop?.length) opts += '<optgroup label="Workshop">' +
            m.workshop.map(w => { const v = `ws:${w.id}`; return `<option value="${esc(v)}"${v === m.current ? ' selected' : ''}>${esc(w.name)}</option>` }).join('') + '</optgroup>'
        } catch {}
        sel.innerHTML = opts || '<option value="">(no maps)</option>'
      }

      // ════════════════════════════════════════════════════════════════════
      // PROFILES TAB  (schema-driven editor + presets/sharing)
      // ════════════════════════════════════════════════════════════════════
      async function loadProfiles() {
        const body = panelBody('profiles')
        let schema
        try { schema = await dbGetProfileSchema(id) }
        catch (e) { body.innerHTML = `<div class="qs-note-block">profiles unavailable: ${esc(e.message)}</div>`; return }
        if (!schema?.groups?.length) {
          body.innerHTML = `<div class="qs-note-block">This game has no structured startup config — use the Raw Config tab.</div>`
          return
        }
        S.schema = schema
        S.cvarRef = schema.cvarRef || []
        regate()   // schema may reveal a Maps tab
        await reloadProfileList()
      }

      async function reloadProfileList(selectId) {
        try {
          const { profiles, activeId } = await dbListProfiles(id)
          S.list = profiles || []
          S.activeId = activeId ?? null
        } catch (e) { setErr(e.message); return }
        const want = selectId ?? S.editId ?? S.activeId ?? S.list[0]?.id
        await openProfile(want)
      }

      async function openProfile(profileId) {
        S.editId = profileId == null ? null : Number(profileId)
        S.dirty = false
        if (S.editId == null) { S.values = {}; renderProfiles(); return }
        try {
          const full = await dbGetProfile(id, S.editId)
          S.values = { ...(full?.settings || {}) }
        } catch (e) { setErr(e.message); S.values = {} }
        renderProfiles()
      }

      // Schema-driven field renderer. switch on f.type; UNKNOWN → text input so an
      // unfamiliar schema never hard-fails the page.
      function profFieldHtml(f) {
        const v = S.values[f.key]
        const lid = `prof-${id}-${f.key}`
        const lbl = `<label for="${lid}">${esc(f.label)}</label>`
        const help = f.help ? `<div class="field-help">${esc(f.help)}</div>` : ''

        if (f.type === 'info') {
          const bodyTxt = (f.help || '').split('\n').map(esc).join('<br>')
          return `<div class="prof-info"><b>${esc(f.label)}</b><div class="field-help">${bodyTxt}</div></div>`
        }

        if (f.type === 'bool') {
          const on = v === '1' || v === 1 || v === true
          return lbl + `<input id="${lid}" data-pf="${esc(f.key)}" data-pt="bool" type="checkbox" class="switch"${on ? ' checked' : ''} />` + help
        }

        if (f.type === 'slider') {
          // range track + numeric mirror (two-way bound) + suffix readout.
          const min = f.min ?? 0, max = f.max ?? 100, step = f.step ?? 1
          const cur = (v ?? f.default ?? min)
          return lbl + `<div class="pf-range" data-pf="${esc(f.key)}" data-pt="number">
              <input type="range" data-pf-slider min="${esc(min)}" max="${esc(max)}" step="${esc(step)}" value="${esc(cur)}" />
              <input type="number" data-pf-num min="${esc(min)}" max="${esc(max)}" step="${esc(step)}" value="${esc(cur)}" />
              <span class="pf-range-val" data-pf-val>${esc(f.suffix || '')}</span>
            </div>` + help
        }

        if (f.type === 'segmented') {
          const opts = (f.options || [])
          const cur = String(v ?? f.default ?? (opts[0]?.value ?? ''))
          const btns = opts.map(o =>
            `<button type="button" class="seg-btn${String(o.value) === cur ? ' on' : ''}" data-seg-val="${esc(o.value)}">${esc(o.label)}</button>`).join('')
          return lbl + `<div class="seg" data-pf="${esc(f.key)}" data-pt="segmented">${btns}</div>` + help
        }

        if (f.type === 'cvar') {
          const dlid = `dl-${id}-${f.key}`
          const sugg = (f.suggest || []).map(o => `<option value="${esc(o.value)}">${esc(o.label || o.value)}</option>`).join('')
          const t = f.valueType === 'number' ? 'number' : 'text'
          return lbl + `<input id="${lid}" data-pf="${esc(f.key)}" data-pt="${t === 'number' ? 'number' : 'text'}" type="${t}" list="${dlid}" value="${esc(v ?? '')}" autocomplete="off" /><datalist id="${dlid}">${sugg}</datalist>` + help
        }

        if (f.type === 'password') {
          // empty value means "unchanged" when the backend returns a •••• sentinel.
          const shown = (v === '••••' || v == null) ? '' : v
          return lbl + `<div class="pf-pass">
              <input id="${lid}" data-pf="${esc(f.key)}" data-pt="text" type="password" value="${esc(shown)}" placeholder="${v === '••••' ? 'unchanged' : ''}" autocomplete="new-password" />
              <button type="button" class="mini-btn" data-pf-reveal title="Show/hide">👁</button>
            </div>` + help
        }

        if (f.type === 'select') {
          // map-catalog combo (CS): by-name picker + add-workshop + import collection
          if (f.addWorkshop) return mapCatalogFieldHtml(f, lid, lbl, help, v)
          if (f.custom) {
            const dlid = `dl-${id}-${f.key}`
            const opts = (f.options || []).map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')
            return lbl + `<input id="${lid}" data-pf="${esc(f.key)}" data-pt="text" type="text" list="${dlid}" value="${esc(v ?? '')}" placeholder="map name" autocomplete="off" /><datalist id="${dlid}">${opts}</datalist>` + help
          }
          if (f.style === 'segmented' && (f.options || []).length <= 5) {
            const opts = (f.options || [])
            const cur = String(v ?? (opts[0]?.value ?? ''))
            const btns = opts.map(o => `<button type="button" class="seg-btn${String(o.value) === cur ? ' on' : ''}" data-seg-val="${esc(o.value)}">${esc(o.label)}</button>`).join('')
            return lbl + `<div class="seg" data-pf="${esc(f.key)}" data-pt="segmented">${btns}</div>` + help
          }
          // grouped optgroups when options carry .group
          let optsHtml
          if ((f.options || []).some(o => o.group)) {
            const byGroup = {}
            ;(f.options || []).forEach(o => { (byGroup[o.group || 'Other'] ??= []).push(o) })
            optsHtml = Object.entries(byGroup).map(([g, os]) =>
              `<optgroup label="${esc(g)}">${os.map(o => `<option value="${esc(o.value)}"${String(o.value) === String(v) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</optgroup>`).join('')
          } else {
            optsHtml = (f.options || []).map(o =>
              `<option value="${esc(o.value)}"${String(o.value) === String(v) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')
          }
          return lbl + `<select id="${lid}" data-pf="${esc(f.key)}" data-pt="select">${optsHtml}</select>` + help
        }

        if (f.type === 'textarea') {
          return lbl + `<textarea id="${lid}" data-pf="${esc(f.key)}" data-pt="text" class="cfg" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>${esc(v ?? '')}</textarea>` + help
        }

        if (f.type === 'maplist') {
          return `<label class="ml-label">${esc(f.label)}</label>`
            + `<div class="maplist" data-pf="${esc(f.key)}" data-pt="maplist">${maplistHtml(f)}</div>` + help
        }

        if (f.type === 'mapcatalog') {
          // mount point for the shared Map panel inline in a profile group.
          return `<label class="ml-label">${esc(f.label)}</label>`
            + `<div class="maplist"><div class="field-help">Manage maps in the <b>Maps</b> tab.</div></div>` + help
        }

        if (f.type === 'mapsync') {
          return `<label class="ml-label">${esc(f.label)}</label>`
            + `<div class="maplist"><button type="button" class="retro-btn" data-mapsync>⟳ Sync from Collection</button></div>` + help
        }

        // number, text, and ANY unknown type → input (number gets numeric type,
        // everything else degrades to a text input).
        const attrs = [
          f.min != null ? `min="${f.min}"` : '',
          f.max != null ? `max="${f.max}"` : '',
          f.step != null ? `step="${f.step}"` : '',
          f.placeholder ? `placeholder="${esc(f.placeholder)}"` : '',
        ].filter(Boolean).join(' ')
        const type = f.type === 'number' ? 'number' : 'text'
        const unit = (f.type === 'number' && f.suffix) ? `<span class="field-unit">${esc(f.suffix)}</span>` : ''
        return lbl + `<span><input id="${lid}" data-pf="${esc(f.key)}" data-pt="${type}" type="${type}" value="${esc(v ?? '')}" ${attrs} />${unit}</span>` + help
      }

      // CS map-catalog field markup (used both inline and by the Maps tab catalog).
      function mapCatalogFieldHtml(f, lid, lbl, help, v) {
        const opts = [...(f.options || [])]
        if (v != null && v !== '' && !opts.some(o => String(o.value) === String(v))) {
          const fb = String(v).startsWith('ws:') ? `Workshop ${String(v).slice(3)}` : String(v)
          opts.unshift({ value: v, label: fb })
        }
        const optsHtml = opts.map(o =>
          `<option value="${esc(o.value)}"${String(o.value) === String(v) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')
        const isWs = String(v ?? '').startsWith('ws:')
        const importBtn = f.addCollection
          ? `<button type="button" class="mini-btn" data-mc-import-toggle title="Import every map from a Steam Workshop collection">⤓ Import Collection</button>` : ''
        const importForm = f.addCollection
          ? `<div class="mc-import" data-mc-import style="display:none">
              <input type="text" data-mc-collection placeholder="Collection ID (digits)" inputmode="numeric" />
              <button type="button" class="mini-btn" data-mc-collection-save>Import</button>
              <button type="button" class="mini-btn" data-mc-collection-cancel>Cancel</button>
            </div>` : ''
        return lbl + `
          <div class="mapcat" data-mapcat="${esc(f.key)}">
            <div class="inline">
              <select id="${lid}" data-pf="${esc(f.key)}" data-pt="text">${optsHtml}</select>
              <button type="button" class="mini-btn" data-mc-toggle>＋ Workshop Map</button>
              ${importBtn}
              <button type="button" class="mini-btn x" data-mc-remove title="Remove the selected Workshop map from your list"${isWs ? '' : ' disabled'}>Remove</button>
            </div>
            <div class="mc-add" data-mc-add style="display:none">
              <input type="text" data-mc-id placeholder="Workshop ID (digits)" inputmode="numeric" />
              <input type="text" data-mc-name placeholder="Name (optional — auto-filled from Steam)" />
              <button type="button" class="mini-btn" data-mc-save>Add</button>
              <button type="button" class="mini-btn" data-mc-cancel>Cancel</button>
            </div>
            ${importForm}
            <div class="mc-busy" data-mc-busy style="display:none"></div>
          </div>` + help
      }

      function maplistHtml(f) {
        const arr = Array.isArray(S.values[f.key]) ? S.values[f.key] : []
        const rows = arr.length
          ? arr.map((m, i) => `
              <div class="maplist-row">
                <span class="mi-idx">${i + 1}</span>
                <span class="mi-name" title="${esc(m)}">${esc(m)}</span>
                ${i === 0 ? '<span class="mi-boot" title="the server boots into this map">start</span>' : ''}
                <button type="button" class="mini-btn" data-ml-up="${i}"${i === 0 ? ' disabled' : ''}>↑</button>
                <button type="button" class="mini-btn" data-ml-down="${i}"${i === arr.length - 1 ? ' disabled' : ''}>↓</button>
                <button type="button" class="mini-btn x" data-ml-del="${i}">✕</button>
              </div>`).join('')
          : `<div class="maplist-empty">No maps in rotation yet.</div>`
        const addable = f.options || []
        const dlOpts = addable.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')
        const grouped = addable.some(o => o.group)
        let addControl
        if (grouped) {
          const byGroup = {}
          addable.forEach(o => { (byGroup[o.group || 'Other'] ??= []).push(o) })
          const groupsHtml = Object.entries(byGroup).map(([g, opts]) =>
            `<optgroup label="${esc(g)}">${opts.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</optgroup>`).join('')
          addControl = `<select data-ml-pick>${groupsHtml || '<option value="">(no maps)</option>'}</select>`
        } else if (f.custom) {
          addControl = `<input type="text" data-ml-pick list="mldl-${id}-${f.key}" placeholder="add a map by name…" autocomplete="off" /><datalist id="mldl-${id}-${f.key}">${dlOpts}</datalist>`
        } else {
          addControl = `<select data-ml-pick${addable.length ? '' : ' disabled'}>${addable.length ? dlOpts : '<option value="">(no maps discovered)</option>'}</select>`
        }
        return `
          <div class="maplist-rows">${rows}</div>
          <div class="maplist-add">
            ${addControl}
            <button type="button" class="mini-btn" data-ml-add${grouped || f.custom || addable.length ? '' : ' disabled'}>＋ Add</button>
          </div>`
      }

      function renderProfiles() {
        const body = panelBody('profiles')
        const opts = S.list.length
          ? S.list.map(p =>
              `<option value="${esc(p.id)}"${p.id === S.editId ? ' selected' : ''}>${esc(p.name)}${p.id === S.activeId ? ' ✓' : ''}</option>`).join('')
          : '<option value="">(no profiles)</option>'
        const isActive = S.editId != null && S.editId === S.activeId
        let badge
        if (isActive) badge = `<span class="pf-badge live">● live${S.dirty ? ' · unsaved' : ''}</span>`
        else badge = `<span class="pf-badge dirty">○ not applied${S.dirty ? ' · unsaved' : ''}</span>`

        const groups = (S.schema.groups || []).map((g, gi) => `
          <details class="prof-group"${(gi === 0 && !g.advanced) ? ' open' : ''}>
            <summary>${esc(g.title)}${g.advanced ? ' <span class="field-unit">advanced</span>' : ''}</summary>
            ${g.note ? `<div class="field-help" style="padding:6px 10px 0">${esc(g.note)}</div>` : ''}
            <div class="prof-grid">${(g.fields || []).map(profFieldHtml).join('')}</div>
          </details>`).join('')

        const apply = S.schema.apply || {}
        const liveApply = apply.mode === 'live'
        const applyLabel = apply.label || '▶ Apply &amp; Restart'
        const applyTitle = liveApply
          ? 'Save your edits, then push them to the running server live over RCON (no restart)'
          : 'Save your edits, write them as the live startup config, and restart to load them'
        const applyNote = liveApply
          ? `${apply.note ? esc(apply.note) + ' ' : ''}Applies instantly over RCON — reverts on container restart.`
          : `${S.schema.note ? esc(S.schema.note) + ' ' : ''}Written to boot config; container restarts to take effect.`

        body.innerHTML = `
          <div class="pf-toolbar">
            <div class="pf-select">
              <span class="pf-lbl">Profile</span>
              <select data-prof-pick>${opts}</select>
              ${badge}
            </div>
            <div class="pf-manage">
              <button class="mini-btn" data-prof-new title="Create a new profile from defaults">＋ New</button>
              <button class="mini-btn" data-prof-clone title="Clone the current edits into a new profile">⎘ Clone</button>
              <button class="mini-btn" data-prof-capture title="Snapshot the server's live config into a new profile">⤓ Capture</button>
              <button class="mini-btn" data-prof-export title="Download this profile's settings as JSON">⇄ Export</button>
              <button class="mini-btn" data-prof-import title="Import a profile from a JSON file">⇲ Import</button>
              <button class="mini-btn x" data-prof-delete title="Delete this profile">🗑 Delete</button>
            </div>
          </div>
          <div class="pf-groups">${groups}</div>
          <div class="pf-actions">
            <div class="pf-actions-btns">
              <button class="retro-btn primary" data-prof-apply title="${applyTitle}">${applyLabel}</button>
              <button class="retro-btn" data-prof-save title="Save your edits to this profile (no restart)">Save</button>
            </div>
            <div class="pf-actions-note">${applyNote}</div>
          </div>`

        wireProfileEvents()
      }

      // Pull every field back into S.values (maplists already live there; sliders,
      // segmented buttons and password sentinels are read via their data-pt).
      function readProfileForm() {
        const body = panelBody('profiles')
        body.querySelectorAll('[data-pf]').forEach(el => {
          const key = el.dataset.pf, t = el.dataset.pt
          if (t === 'maplist') return
          if (t === 'segmented') {
            // fall back to the first option so a value is always read back
            const on = el.querySelector('.seg-btn.on') || el.querySelector('.seg-btn')
            if (on) S.values[key] = on.dataset.segVal
            return
          }
          if (t === 'number' && el.classList.contains('pf-range')) {
            const num = el.querySelector('[data-pf-num]')
            if (num) S.values[key] = num.value === '' ? '' : Number(num.value)
            return
          }
          if (t === 'bool') S.values[key] = el.checked ? '1' : '0'
          else if (t === 'number') S.values[key] = el.value === '' ? '' : Number(el.value)
          else S.values[key] = el.value
        })
        return S.values
      }

      function wireProfileEvents() {
        const body = panelBody('profiles')
        const markDirty = () => {
          if (!S.dirty) {
            S.dirty = true
            const badge = body.querySelector('.pf-badge')
            if (badge && !/unsaved/.test(badge.textContent)) badge.textContent += ' · unsaved'
          }
        }
        // any field edit lights the dirty flag
        body.querySelectorAll('[data-pf]').forEach(el => {
          el.addEventListener('input', markDirty)
          el.addEventListener('change', markDirty)
        })

        const pick = body.querySelector('[data-prof-pick]')
        if (pick) pick.addEventListener('change', () => {
          if (!guardLeave2()) { pick.value = String(S.editId ?? ''); return }
          openProfile(pick.value)
        })
        // local guard for switching profiles (separate from the tab guard)
        function guardLeave2() {
          if (!S.dirty) return true
          if (confirm('Discard unsaved changes to this profile?')) { S.dirty = false; return true }
          return false
        }

        const onClick = (sel, fn) => { const b = body.querySelector(sel); if (b) b.addEventListener('click', () => fn(b)) }
        const curName = () => (S.list.find(p => p.id === S.editId)?.name) || 'profile'

        // slider ↔ number mirror + segmented buttons
        body.querySelectorAll('.pf-range').forEach(rng => {
          const slider = rng.querySelector('[data-pf-slider]')
          const num = rng.querySelector('[data-pf-num]')
          if (!slider || !num) return
          const val = rng.querySelector('[data-pf-val]')
          const suffix = val ? val.textContent : ''
          const sync = (src) => { if (src === 'slider') num.value = slider.value; else slider.value = num.value; if (val) val.textContent = `${slider.value}${suffix}` }
          if (val) val.textContent = `${slider.value}${suffix}`
          slider.addEventListener('input', () => { sync('slider'); markDirty() })
          num.addEventListener('input', () => { sync('num'); markDirty() })
        })
        body.querySelectorAll('.seg').forEach(seg => {
          seg.querySelectorAll('.seg-btn').forEach(btn => btn.addEventListener('click', () => {
            seg.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('on'))
            btn.classList.add('on'); markDirty()
          }))
        })
        body.querySelectorAll('[data-pf-reveal]').forEach(btn => btn.addEventListener('click', () => {
          const inp = btn.parentElement.querySelector('input')
          inp.type = inp.type === 'password' ? 'text' : 'password'
        }))

        onClick('[data-prof-save]', (b) => withBtn(b, 'Save profile', async () => {
          if (S.editId == null) return
          readProfileForm()
          await dbUpdateProfile(id, S.editId, { settings: S.values })
          S.dirty = false
          logLine(`Profile "${curName()}" saved ✓`)
          await reloadProfileList(S.editId)
        }).catch(() => {}))

        onClick('[data-prof-apply]', (b) => {
          if (S.editId == null) return
          const apply = S.schema.apply || {}
          const liveApply = apply.mode === 'live'
          const confirmMsg = apply.confirm
            || 'Apply this profile and restart the server now?\n\nThe server reloads with this config and briefly disconnects any players.'
          if (!confirm(confirmMsg)) return
          withBtn(b, liveApply ? 'Apply live' : 'Apply & restart', async () => {
            readProfileForm()
            await dbUpdateProfile(id, S.editId, { settings: S.values })
            S.dirty = false
            const r = await dbApplyProfile(id, S.editId)
            if (liveApply) {
              logLine(`Applied "${r?.name}" live ✓`)
            } else {
              logLine(`Applied "${r?.name}" ✓ — restarting to load it…`)
              await dbServerAction(id, 'reboot')
              await new Promise(res => setTimeout(res, 2500))
              await refresh()
              logLine(`Restarted ✓ — now running "${r?.name}"`)
            }
            await reloadProfileList(S.editId)
          }).catch(() => {})
        })

        onClick('[data-prof-new]', (b) => {
          const name = (prompt('Name for the new profile:') || '').trim()
          if (!name) return
          withBtn(b, 'New profile', async () => {
            const p = await dbCreateProfile(id, name)
            logLine(`Created profile "${p.name}" ✓`)
            await reloadProfileList(p.id)
          }).catch(() => {})
        })

        // Clone = client-side: create a new profile from the CURRENT form values.
        onClick('[data-prof-clone]', (b) => {
          const name = (prompt('Clone this profile — name the copy:') || '').trim()
          if (!name) return
          withBtn(b, 'Clone', async () => {
            readProfileForm()
            const p = await dbCreateProfile(id, name, S.values)
            logLine(`Cloned as "${p.name}" ✓`)
            await reloadProfileList(p.id)
          }).catch(() => {})
        })

        onClick('[data-prof-capture]', (b) => {
          const name = (prompt('Capture the server’s current live config as a profile named:') || '').trim()
          if (!name) return
          withBtn(b, 'Capture', async () => {
            const p = await dbCaptureProfile(id, name)
            logLine(`Captured current config as "${p.name}" ✓`)
            await reloadProfileList(p.id)
          }).catch(() => {})
        })

        // Export = client-only: download a JSON file of the current settings.
        onClick('[data-prof-export]', () => {
          readProfileForm()
          const doc = { gamertownProfile: 1, game: id, name: curName(), settings: S.values }
          const json = JSON.stringify(doc, null, 2)
          const blob = new Blob([json], { type: 'application/json' })
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = `${id}-${(curName() || 'profile').replace(/[^a-z0-9_-]+/gi, '_')}.json`
          document.body.appendChild(a); a.click(); a.remove()
          setTimeout(() => URL.revokeObjectURL(url), 1000)
          logLine(`Exported profile "${curName()}" ✓`)
        })

        // Import = client-only: file-pick → parse → dbCreateProfile (backend validates).
        onClick('[data-prof-import]', () => {
          const inp = document.createElement('input')
          inp.type = 'file'; inp.accept = '.json,application/json'
          inp.addEventListener('change', () => {
            const file = inp.files?.[0]
            if (!file) return
            const reader = new FileReader()
            reader.onload = () => {
              let parsed
              try { parsed = JSON.parse(String(reader.result)) }
              catch (e) { setErr(`import failed: not valid JSON (${e.message})`); return }
              const settings = parsed?.settings ?? parsed
              if (!settings || typeof settings !== 'object') { setErr('import failed: no settings object found'); return }
              const name = (prompt('Name for the imported profile:', parsed?.name || 'Imported') || '').trim()
              if (!name) return
              withBtn(null, 'Import profile', async () => {
                const p = await dbCreateProfile(id, name, settings)
                logLine(`Imported profile "${p.name}" ✓`)
                await reloadProfileList(p.id)
              }).catch(() => {})
            }
            reader.readAsText(file)
          })
          inp.click()
        })

        onClick('[data-prof-delete]', (b) => {
          if (S.editId == null) return
          const name = curName()
          if (!confirm(`Delete profile "${name}"? This can't be undone.`)) return
          withBtn(b, 'Delete profile', async () => {
            await dbDeleteProfile(id, S.editId)
            logLine(`Deleted profile "${name}" ✓`)
            S.editId = null; S.dirty = false
            await reloadProfileList()
          }).catch(() => {})
        })

        // per-field widget wiring
        ;(S.schema.groups || []).forEach(g => (g.fields || []).forEach(f => {
          if (f.type === 'maplist') wireMaplist(f)
          if (f.type === 'select' && f.addWorkshop) wireMapCatalog(f, body)
        }))

        body.querySelector('[data-mapsync]')?.addEventListener('click', (e) => {
          const btn = e.currentTarget
          withBtn(btn, 'Sync maps', async () => {
            readProfileForm()
            const r = await dbSyncServerMaps(id)
            S.schema = await dbGetProfileSchema(id)
            S.cvarRef = S.schema.cvarRef || S.cvarRef
            renderProfiles()
            logLine(`Synced maps from collection ✓ — ${(r?.maps || []).length} installed`)
          }).catch(() => {})
        })
      }

      // CS map-catalog field wiring (inline in the Profiles tab). scope = the
      // element to search within (the profiles body or the maps panel body).
      function wireMapCatalog(f, scope) {
        const wrap = [...scope.querySelectorAll('.mapcat')].find(w => w.dataset.mapcat === f.key)
        if (!wrap) return
        const sel = wrap.querySelector('select[data-pf]')
        const addBox = wrap.querySelector('[data-mc-add]')
        const idEl = wrap.querySelector('[data-mc-id]')
        const nameEl = wrap.querySelector('[data-mc-name]')
        const removeBtn = wrap.querySelector('[data-mc-remove]')
        const showAdd = (on) => { addBox.style.display = on ? 'flex' : 'none'; if (on) { idEl.value = ''; nameEl.value = ''; idEl.focus() } }
        const syncRemove = () => { if (removeBtn) removeBtn.disabled = !String(sel.value || '').startsWith('ws:') }
        sel.addEventListener('change', syncRemove); syncRemove()

        const importBox = wrap.querySelector('[data-mc-import]')
        const collEl = wrap.querySelector('[data-mc-collection]')
        const busyEl = wrap.querySelector('[data-mc-busy]')
        const showImport = (on) => { if (!importBox) return; importBox.style.display = on ? 'flex' : 'none'; if (on) { addBox.style.display = 'none'; collEl.value = ''; collEl.focus() } }

        wrap.querySelector('[data-mc-toggle]')?.addEventListener('click', () => { showImport(false); showAdd(addBox.style.display === 'none') })
        wrap.querySelector('[data-mc-cancel]')?.addEventListener('click', () => showAdd(false))
        const save = wrap.querySelector('[data-mc-save]')
        save?.addEventListener('click', () => {
          const wsId = (idEl.value || '').trim(), nm = (nameEl.value || '').trim()
          if (!/^\d{1,20}$/.test(wsId)) { setErr('Workshop ID must be digits'); return }
          withBtn(save, 'Add workshop map', async () => {
            const row = await dbAddServerMap(id, wsId, nm)
            const label = row?.name || nm || `Workshop ${wsId}`
            const val = `ws:${wsId}`
            let opt = [...sel.options].find(o => o.value === val)
            if (!opt) { opt = document.createElement('option'); opt.value = val; sel.appendChild(opt) }
            opt.textContent = label; sel.value = val; S.values[f.key] = val
            showAdd(false); syncRemove()
            logLine(`Added workshop map "${label}" (${wsId}) ✓`)
          }).catch(() => {})
        })

        // PREVIEW-SEAM: import is the *commit* call (dbImportServerCollection). When
        // a keyless previewCollection endpoint exists, call it here first and let
        // the user check which ids to import; until then it's import-then-curate.
        wrap.querySelector('[data-mc-import-toggle]')?.addEventListener('click', () => showImport(importBox.style.display === 'none'))
        wrap.querySelector('[data-mc-collection-cancel]')?.addEventListener('click', () => showImport(false))
        const collSave = wrap.querySelector('[data-mc-collection-save]')
        collSave?.addEventListener('click', () => {
          const cid = (collEl.value || '').trim()
          if (!/^\d{1,20}$/.test(cid)) { setErr('Collection ID must be digits'); return }
          if (busyEl) { busyEl.style.display = 'block'; busyEl.textContent = 'Fetching collection from Steam…' }
          withBtn(collSave, 'Import collection', async () => {
            const r = await dbImportServerCollection(id, cid)
            logLine(`Imported ${r?.imported ?? 0} map(s) from collection ${cid} ✓`)
            if (r?.requiresRestart) logLine(r.note || 'Restart Hosting so Steam downloads + mounts the collection.')
            readProfileForm()
            S.schema = await dbGetProfileSchema(id)
            S.cvarRef = S.schema.cvarRef || S.cvarRef
            renderProfiles()
          }).catch(() => {}).finally(() => { if (busyEl) busyEl.style.display = 'none' })
        })

        removeBtn?.addEventListener('click', () => {
          const val = String(sel.value || '')
          if (!val.startsWith('ws:')) return
          const wsId = val.slice(3)
          const opt = [...sel.options].find(o => o.value === val)
          const label = opt ? opt.textContent : `Workshop ${wsId}`
          if (!confirm(`Remove "${label}" from your Workshop map list?\n\nThis only removes it from the picker — it doesn't unsubscribe on Steam or change a running server.`)) return
          withBtn(removeBtn, 'Remove workshop map', async () => {
            try { await dbDeleteServerMap(id, wsId) } catch (e) { if (e.status !== 404) throw e }
            opt?.remove()
            sel.value = sel.options[0]?.value || ''
            S.values[f.key] = sel.value
            syncRemove()
            logLine(`Removed workshop map "${label}" ✓`)
          }).catch(() => {})
        })
      }

      function wireMaplist(f) {
        const body = panelBody('profiles')
        const scopes = [body, panelBody('maps')].filter(Boolean)
        scopes.forEach(scope => {
          const wrap = [...scope.querySelectorAll('.maplist')].find(w => w.dataset.pf === f.key)
          if (!wrap) return
          const arr = () => (Array.isArray(S.values[f.key]) ? S.values[f.key] : (S.values[f.key] = []))
          const rerender = () => { wrap.innerHTML = maplistHtml(f); wireMaplistRows(wrap, f, arr, rerender) }
          wireMaplistRows(wrap, f, arr, rerender)
        })
      }
      function wireMaplistRows(wrap, f, arr, rerender) {
        wrap.querySelectorAll('[data-ml-up]').forEach(b => b.addEventListener('click', () => {
          const i = Number(b.dataset.mlUp); const a = arr(); [a[i - 1], a[i]] = [a[i], a[i - 1]]; rerender(); S.dirty = true
        }))
        wrap.querySelectorAll('[data-ml-down]').forEach(b => b.addEventListener('click', () => {
          const i = Number(b.dataset.mlDown); const a = arr(); [a[i + 1], a[i]] = [a[i], a[i + 1]]; rerender(); S.dirty = true
        }))
        wrap.querySelectorAll('[data-ml-del]').forEach(b => b.addEventListener('click', () => {
          arr().splice(Number(b.dataset.mlDel), 1); rerender(); S.dirty = true
        }))
        const add = wrap.querySelector('[data-ml-add]')
        if (add) add.addEventListener('click', () => {
          const picked = (wrap.querySelector('[data-ml-pick]')?.value || '').trim()
          if (!picked) return
          if (!/^[a-z0-9_]{1,64}$/.test(picked)) { setErr(`invalid map name: ${picked}`); return }
          setErr(''); arr().push(picked); rerender(); S.dirty = true
        })
      }

      // ════════════════════════════════════════════════════════════════════
      // MAPS TAB  (unified collection import + catalog + rotation/boot picker)
      // ════════════════════════════════════════════════════════════════════
      async function loadMaps() {
        const body = panelBody('maps')
        try {
          if (!S.schema) { S.schema = await dbGetProfileSchema(id) }
        } catch (e) { body.innerHTML = `<div class="qs-note-block">maps unavailable: ${esc(e.message)}</div>`; return }
        S.cvarRef = S.schema?.cvarRef || S.cvarRef
        // Catalog source differs by game (CS DB catalog vs GMOD/PH installed maps).
        await refreshMapCatalog()
        // Hydrate the active profile into S.values so the rotation/boot picker isn't
        // empty and Save targets the right profile, even when the Maps tab is opened
        // before the Profiles tab (the two tabs share S.values / S.editId).
        if (S.editId == null) {
          try {
            if (!S.list.length) {
              const { profiles, activeId } = await dbListProfiles(id)
              S.list = profiles || []; S.activeId = activeId ?? null
            }
            const pid = S.activeId ?? S.list[0]?.id
            if (pid != null) {
              const full = await dbGetProfile(id, pid)
              S.editId = pid; S.values = { ...(full?.settings || {}) }
            }
          } catch {}
        }
        renderMapPanel()
      }

      // The rotation model is derived from the schema: a maplist field ⇒ ordered
      // rotation (GMOD/PH, first = boot); otherwise a single boot-map picker (CS).
      function mapField() {
        for (const g of (S.schema?.groups || [])) {
          for (const f of (g.fields || [])) {
            if (f.type === 'maplist') return { kind: 'list', f }
            if (f.type === 'select' && f.addWorkshop) return { kind: 'single', f }
          }
        }
        return null
      }

      // Refresh S.maps from the right source for this game: CS = DB catalog,
      // GMOD/PH = the schema's maplist options (installed maps). Re-fetches the
      // schema first so freshly-synced/imported maps appear.
      async function refreshMapCatalog() {
        const mf = mapField()
        if (mf?.kind === 'single') { try { S.maps = await dbListServerMaps(id) } catch { S.maps = [] } }
        else { S.maps = (mf?.kind === 'list' && Array.isArray(mf.f.options)) ? mf.f.options : [] }
      }

      function renderMapPanel() {
        const body = panelBody('maps')
        const mf = mapField()
        const rotationModel = mf?.kind || 'single'
        // CS has an editable DB catalog (add/rename/delete, import — no sync).
        // GMOD/PH have a read-only installed-map list driven by the collection
        // (sync to install — no add/rename/delete). Drives the left pane's controls.
        const editableCatalog = rotationModel === 'single'

        // catalog rows: CS catalog (with rename/delete) or GMOD/PH installed maps (read-only)
        const catRows = (S.maps || []).length
          ? S.maps.map(w => {
              const rid = esc(w.workshopId ?? w.id ?? w.value ?? '')
              const nm = esc(w.name || w.label || w.value || '')
              return `<div class="coll-row" data-map-row="${rid}">
                <span class="mi-name" title="${nm}">${nm}</span>
                ${editableCatalog ? `<button type="button" class="mini-btn" data-map-rename title="Rename">✎</button>
                <button type="button" class="mini-btn x" data-map-del title="Remove from catalog">✕</button>` : ''}
              </div>`
            }).join('')
          : `<div class="map-empty">${editableCatalog
              ? 'No catalog maps yet — import a collection or add a Workshop map.'
              : 'No installed maps yet — import a collection, Restart Hosting, then Sync.'}</div>`

        // rotation/boot column
        let rotCol
        if (rotationModel === 'list' && mf) {
          rotCol = `
            <div class="map-pane">
              <div class="map-pane-head"><span class="map-pane-title">Rotation (first = boot)</span></div>
              <div class="maplist" data-pf="${esc(mf.f.key)}" data-pt="maplist">${maplistHtml(mf.f)}</div>
              <div class="map-foot"><button type="button" class="retro-btn" data-rot-save>Save Rotation</button></div>
              <div class="field-help">Saved to the active profile — shared with the Profiles tab.</div>
            </div>`
        } else if (mf) {
          // single boot-map picker (CS) — reuse the map-catalog combo field
          const v = S.values[mf.f.key]
          rotCol = `
            <div class="map-pane">
              <div class="map-pane-head"><span class="map-pane-title">Boot Map</span></div>
              ${mapCatalogFieldHtml(mf.f, `mapboot-${id}`, '', '', v)}
              <div class="map-foot"><button type="button" class="retro-btn" data-boot-save>Set Boot Map</button></div>
              <div class="field-help">Live map change is on the <b>Runtime</b> tab.</div>
            </div>`
        } else {
          rotCol = `<div class="map-pane"><div class="map-empty">This game has no map rotation.</div></div>`
        }

        body.innerHTML = `
          <div class="map-import">
            <div class="map-import-head">Import a Steam Workshop collection</div>
            <div class="coll-row">
              <input type="text" data-coll-id placeholder="collection id (digits)" inputmode="numeric" />
              <button type="button" class="mini-btn" data-coll-import>⤓ Import Collection</button>
            </div>
            <div class="coll-result" data-coll-result></div>
          </div>
          <div class="map-cols">
            <div class="map-pane">
              <div class="map-pane-head">
                <span class="map-pane-title">${editableCatalog ? 'Workshop Catalog' : 'Installed Maps'}</span>
                ${editableCatalog ? `<button type="button" class="mini-btn" data-map-addws>＋ Add WS</button>` : ''}
              </div>
              <div class="map-rows">${catRows}</div>
              ${editableCatalog ? `<div class="mc-add" data-map-addbox style="display:none;margin-top:6px">
                <input type="text" data-map-wsid placeholder="Workshop ID (digits)" inputmode="numeric" />
                <input type="text" data-map-wsname placeholder="Name (optional)" />
                <button type="button" class="mini-btn" data-map-wssave>Add</button>
                <button type="button" class="mini-btn" data-map-wscancel>Cancel</button>
              </div>` : ''}
              ${!editableCatalog ? `<div class="map-foot"><button type="button" class="retro-btn" data-map-sync title="Install maps downloaded from the collection at the last boot">⟳ Sync from Collection</button></div>` : ''}
            </div>
            ${rotCol}
          </div>`

        wireMapPanel(rotationModel, mf)
      }

      function wireMapPanel(rotationModel, mf) {
        const body = panelBody('maps')

        // unified collection import (same call for CS/TTT/PH)
        const collImport = body.querySelector('[data-coll-import]')
        collImport?.addEventListener('click', () => {
          const cid = (body.querySelector('[data-coll-id]').value || '').trim()
          if (!/^\d{1,20}$/.test(cid)) { setErr('Collection ID must be digits'); return }
          const resEl = body.querySelector('[data-coll-result]')
          if (!confirm(`Import all maps from collection ${cid}?`)) return
          resEl.innerHTML = `<div class="mc-busy">Fetching collection from Steam…</div>`
          withBtn(collImport, 'Import collection', async () => {
            const r = await dbImportServerCollection(id, cid)
            logLine(`Imported ${r?.imported ?? 0} map(s) from collection ${cid} ✓`)
            // result list (post-import "curate" view — PREVIEW-SEAM above)
            const list = (r?.maps || []).map(m => `<div class="coll-row"><span class="mi-name">${esc(m.label || m.value)}</span></div>`).join('')
            resEl.innerHTML = `<div class="field-help">Imported ${r?.imported ?? 0} map(s)${r?.requiresRestart ? ' — Restart Hosting to download + mount them.' : ' — selectable now.'}</div>${list ? `<div class="coll-list">${list}</div>` : ''}`
            if (r?.requiresRestart && confirm('This collection mounts at boot. Restart Hosting now to download + mount it?')) {
              logLine('Restarting to mount collection…')
              await dbServerAction(id, 'reboot')
              await new Promise(res => setTimeout(res, 2500))
              await refresh()
            }
            // re-fetch schema + catalog and re-render
            try { S.schema = await dbGetProfileSchema(id); S.cvarRef = S.schema.cvarRef || S.cvarRef } catch {}
            await refreshMapCatalog()
            renderMapPanel()
          }).catch(() => { resEl.innerHTML = '' })
        })

        // catalog: add WS / rename / delete
        const addBox = body.querySelector('[data-map-addbox]')
        body.querySelector('[data-map-addws]')?.addEventListener('click', () => {
          addBox.style.display = addBox.style.display === 'none' ? 'flex' : 'none'
          if (addBox.style.display === 'flex') body.querySelector('[data-map-wsid]').focus()
        })
        body.querySelector('[data-map-wscancel]')?.addEventListener('click', () => { addBox.style.display = 'none' })
        const wsSave = body.querySelector('[data-map-wssave]')
        wsSave?.addEventListener('click', () => {
          const wsId = (body.querySelector('[data-map-wsid]').value || '').trim()
          const nm = (body.querySelector('[data-map-wsname]').value || '').trim()
          if (!/^\d{1,20}$/.test(wsId)) { setErr('Workshop ID must be digits'); return }
          withBtn(wsSave, 'Add workshop map', async () => {
            await dbAddServerMap(id, wsId, nm)
            S.maps = await dbListServerMaps(id)
            logLine(`Added workshop map ${wsId} ✓`)
            renderMapPanel()
          }).catch(() => {})
        })
        body.querySelectorAll('[data-map-rename]').forEach(b => b.addEventListener('click', () => {
          const row = b.closest('[data-map-row]'); const wsId = row?.dataset.mapRow
          const cur = row?.querySelector('.mi-name')?.textContent || ''
          const name = (prompt('Rename map:', cur) || '').trim()
          if (!name) return
          withBtn(b, 'Rename map', async () => {
            await dbRenameServerMap(id, wsId, name)
            S.maps = await dbListServerMaps(id)
            logLine(`Renamed map ${wsId} → "${name}" ✓`)
            renderMapPanel()
          }).catch(() => {})
        }))
        body.querySelectorAll('[data-map-del]').forEach(b => b.addEventListener('click', () => {
          const row = b.closest('[data-map-row]'); const wsId = row?.dataset.mapRow
          const nm = row?.querySelector('.mi-name')?.textContent || wsId
          if (!confirm(`Remove "${nm}" from the catalog?`)) return
          withBtn(b, 'Remove map', async () => {
            try { await dbDeleteServerMap(id, wsId) } catch (e) { if (e.status !== 404) throw e }
            S.maps = await dbListServerMaps(id)
            logLine(`Removed map "${nm}" ✓`)
            renderMapPanel()
          }).catch(() => {})
        }))
        // sync (GMOD/PH)
        body.querySelector('[data-map-sync]')?.addEventListener('click', (e) => {
          const btn = e.currentTarget
          withBtn(btn, 'Sync maps', async () => {
            const r = await dbSyncServerMaps(id)
            try { S.schema = await dbGetProfileSchema(id) } catch {}
            await refreshMapCatalog()
            logLine(`Synced maps from collection ✓ — ${(r?.maps || []).length} installed`)
            renderMapPanel()
          }).catch(() => {})
        })

        // rotation (list) — shares S.values with Profiles
        if (rotationModel === 'list' && mf) {
          wireMaplist(mf.f)
          body.querySelector('[data-rot-save]')?.addEventListener('click', (e) => {
            const btn = e.currentTarget
            withBtn(btn, 'Save rotation', async () => {
              if (S.editId == null) { setErr('Open a profile in the Profiles tab first.'); return }
              await dbUpdateProfile(id, S.editId, { settings: S.values })
              logLine('Rotation saved to profile ✓')
            }).catch(() => {})
          })
        } else if (mf) {
          // single boot-map (CS): wire the catalog combo + Set boot map
          wireMapCatalog(mf.f, body)
          body.querySelector('[data-boot-save]')?.addEventListener('click', (e) => {
            const btn = e.currentTarget
            const sel = body.querySelector(`.mapcat[data-mapcat="${mf.f.key}"] select[data-pf]`)
            withBtn(btn, 'Set boot map', async () => {
              if (S.editId == null) { setErr('Open a profile in the Profiles tab first.'); return }
              if (sel) S.values[mf.f.key] = sel.value
              await dbUpdateProfile(id, S.editId, { settings: S.values })
              logLine(`Boot map set to ${sel?.value || '(unchanged)'} ✓`)
            }).catch(() => {})
          })
        }
      }

      // ════════════════════════════════════════════════════════════════════
      // RAW CONFIG TAB  (file editor + cvar reference + lint + diff + snippets)
      // ════════════════════════════════════════════════════════════════════
      async function loadRawcfg() {
        const body = panelBody('rawcfg')
        try {
          const [{ files }, configs] = await Promise.all([
            dbListServerConfig(id),
            dbListServerConfigs(id).catch(() => []),
          ])
          S.files = files || []
          S.configs = configs || []
        } catch (e) { body.innerHTML = `<div class="qs-note-block">raw config unavailable: ${esc(e.message)}</div>`; return }
        // cvar reference comes from the profile schema (load it if not yet fetched)
        if (!S.schema) { try { S.schema = await dbGetProfileSchema(id) } catch {} }
        S.cvarRef = S.schema?.cvarRef || []
        renderRawcfg()
      }

      function renderRawcfg() {
        const body = panelBody('rawcfg')
        const fileOpts = S.files.length
          ? S.files.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('')
          : '<option value="">(no editable files)</option>'

        const hasRef = (S.cvarRef || []).length > 0
        const snipRows = (S.configs || []).length
          ? S.configs.map(c => `<div class="rc-snip-row" data-snip-row="${esc(c.id)}">
              <span class="rc-snip-name" title="${esc(c.name)}">${esc(c.name)}</span>
              <button type="button" class="mini-btn" data-snip-load>load</button>
              <button type="button" class="mini-btn x" data-snip-del>✕</button>
            </div>`).join('')
          : `<div class="map-empty">No saved snippets.</div>`

        const sideHtml = `
          <div class="rc-side">
            ${hasRef ? `
              <div class="rc-side-title">Cvar Reference</div>
              <input type="text" class="rc-filter" data-rc-filter placeholder="filter…" />
              <div class="rc-ref-list" data-rc-reflist></div>
              <div class="rc-sep"></div>` : ''}
            <div class="rc-side-title">Saved Snippets</div>
            <div class="rc-snip-list" data-rc-sniplist>${snipRows}</div>
            <button type="button" class="mini-btn" data-snip-add>＋ Save current as…</button>
          </div>`

        body.innerHTML = `
          <div class="rawcfg-grid">
            <div class="rc-editor">
              <div class="panel-row">
                <label>File</label>
                <select data-cfg-select>${fileOpts}</select>
              </div>
              <textarea class="cfg" data-cfg-text placeholder="select a file…" disabled></textarea>
              <div class="rc-lint" data-rc-lint></div>
              <div class="rc-toolbar">
                <button class="retro-btn" data-cfg-revert disabled>⤺ Revert</button>
                <button class="retro-btn" data-cfg-diff disabled>≡ Diff</button>
                <button class="retro-btn primary" data-cfg-save disabled>💾 Save File</button>
              </div>
              <div class="rc-diff" data-rc-diff style="display:none"></div>
            </div>
            ${sideHtml}
          </div>`

        wireRawcfg()
      }

      function wireRawcfg() {
        const body = panelBody('rawcfg')
        const sel = body.querySelector('[data-cfg-select]')
        const text = body.querySelector('[data-cfg-text]')
        const saveBtn = body.querySelector('[data-cfg-save]')
        const revertBtn = body.querySelector('[data-cfg-revert]')
        const diffBtn = body.querySelector('[data-cfg-diff]')
        const lintEl = body.querySelector('[data-rc-lint]')
        const diffEl = body.querySelector('[data-rc-diff]')

        async function loadFile(file) {
          if (!file) { text.value = ''; text.disabled = true; saveBtn.disabled = revertBtn.disabled = diffBtn.disabled = true; return }
          text.disabled = true; text.value = 'loading…'
          try {
            const { content, truncated } = await dbReadServerConfig(id, file)
            text.value = content; S.fileBaseline = content; S.curFile = file
            text.disabled = false; saveBtn.disabled = revertBtn.disabled = diffBtn.disabled = false
            if (truncated) setErr('note: file was truncated (very large file)')
            lint()
          } catch (e) { setErr(e.message); text.value = ''; text.disabled = true; saveBtn.disabled = true }
        }

        // client-side lint: unknown cvar → soft warn; JSON parse error blocks save
        // for .json files only. Advisory; never blocks .cfg saves.
        let blockSave = false
        function lint() {
          const file = sel.value || ''
          const val = text.value
          if (/\.json$/i.test(file)) {
            try { JSON.parse(val || '{}'); lintEl.className = 'rc-lint'; lintEl.textContent = ''; blockSave = false }
            catch (e) { lintEl.className = 'rc-lint err'; lintEl.textContent = `⚠ JSON error: ${e.message} — fix before saving`; blockSave = true }
          } else {
            blockSave = false
            const ref = S.cvarRef || []
            const known = new Set(ref.map(c => String(c.name)))
            const warns = []
            val.split('\n').forEach((line, i) => {
              const ln = line.trim()
              if (!ln || ln.startsWith('//') || ln.startsWith('#') || ln.startsWith('"')) return
              const m = ln.match(/^([a-zA-Z0-9_]+)\s+(.+)$/)
              if (!m) return
              const [, name, rawv] = m
              if (ref.length && !known.has(name)) { warns.push(`line ${i + 1}: unknown cvar '${name}'`); return }
              const def = ref.find(c => String(c.name) === name)
              if (def && def.type === 'number') {
                const n = Number(rawv.replace(/["';].*$/, '').trim())
                if (!Number.isNaN(n)) {
                  if (def.min != null && n < def.min) warns.push(`line ${i + 1}: ${name} ${n} < min ${def.min}`)
                  if (def.max != null && n > def.max) warns.push(`line ${i + 1}: ${name} ${n} > max ${def.max}`)
                }
              }
            })
            lintEl.className = 'rc-lint'
            lintEl.textContent = warns.length ? '⚠ ' + warns.slice(0, 6).join('  ·  ') + (warns.length > 6 ? `  (+${warns.length - 6} more)` : '') : ''
          }
          saveBtn.disabled = blockSave
        }
        let lintTimer
        text.addEventListener('input', () => { clearTimeout(lintTimer); lintTimer = setTimeout(lint, 300); diffEl.style.display = 'none' })

        sel.addEventListener('change', () => loadFile(sel.value))
        if (sel.value) loadFile(sel.value)

        revertBtn.addEventListener('click', () => { text.value = S.fileBaseline; diffEl.style.display = 'none'; lint() })

        diffBtn.addEventListener('click', () => {
          if (diffEl.style.display !== 'none') { diffEl.style.display = 'none'; return }
          diffEl.innerHTML = lineDiff(S.fileBaseline, text.value)
          diffEl.style.display = 'block'
        })

        saveBtn.addEventListener('click', () => {
          const file = sel.value
          if (!file || blockSave) return
          withBtn(saveBtn, 'Save file', async () => {
            await dbWriteServerConfig(id, file, text.value)
            S.fileBaseline = text.value
            diffEl.style.display = 'none'
            logLine(`Saved ${file} ✓`)
          }).catch(() => {})
        })

        // cvar reference list (filterable; [ins] inserts at the caret)
        const refList = body.querySelector('[data-rc-reflist]')
        const filterEl = body.querySelector('[data-rc-filter]')
        function renderRef() {
          if (!refList) return
          const q = (filterEl?.value || '').toLowerCase()
          const rows = (S.cvarRef || [])
            .filter(c => !q || String(c.name).toLowerCase().includes(q) || String(c.help || '').toLowerCase().includes(q))
            .slice(0, 200)
            .map(c => `<div class="rc-ref-row">
                <span class="rc-ref-meta" title="${esc(c.help || '')}">${esc(c.name)} <small>${esc(c.type || '')}${c.default != null ? ' ' + esc(c.default) : ''}</small>${c.help ? `<div class="rc-ref-help">${esc(c.help)}</div>` : ''}</span>
                <button type="button" class="mini-btn" data-rc-ins="${esc(c.name)}" data-rc-def="${esc(c.default ?? '')}">ins</button>
              </div>`).join('')
          refList.innerHTML = rows || '<div class="map-empty">no matches</div>'
          refList.querySelectorAll('[data-rc-ins]').forEach(b => b.addEventListener('click', () => {
            if (text.disabled) return
            const snippet = `${b.dataset.rcIns} ${b.dataset.rcDef}`.trim() + '\n'
            const p = text.selectionStart ?? text.value.length
            text.value = text.value.slice(0, p) + snippet + text.value.slice(p)
            text.focus(); lint()
          }))
        }
        filterEl?.addEventListener('input', renderRef)
        renderRef()

        // saved snippet library (DB-backed)
        body.querySelectorAll('[data-snip-load]').forEach(b => b.addEventListener('click', () => {
          const cid = b.closest('[data-snip-row]')?.dataset.snipRow
          withBtn(b, 'Load snippet', async () => {
            const c = await dbGetServerConfigBody(id, cid)
            if (!text.disabled) { text.value = c?.body ?? ''; lint() }
            logLine(`Loaded snippet "${c?.name || cid}" into editor`)
          }).catch(() => {})
        }))
        body.querySelectorAll('[data-snip-del]').forEach(b => b.addEventListener('click', () => {
          const cid = b.closest('[data-snip-row]')?.dataset.snipRow
          if (!confirm('Delete this saved snippet?')) return
          withBtn(b, 'Delete snippet', async () => {
            await dbDeleteServerConfig(id, cid)
            S.configs = await dbListServerConfigs(id).catch(() => [])
            renderRawcfg()
          }).catch(() => {})
        }))
        body.querySelector('[data-snip-add]')?.addEventListener('click', (e) => {
          const name = (prompt('Name this snippet:') || '').trim()
          if (!name) return
          withBtn(e.currentTarget, 'Save snippet', async () => {
            await dbCreateServerConfig(id, name, text.value)
            S.configs = await dbListServerConfigs(id).catch(() => [])
            logLine(`Saved snippet "${name}" ✓`)
            renderRawcfg()
          }).catch(() => {})
        })
      }

      // expose the per-card hooks updateStatus needs (tab gating + activation)
      // — set BEFORE the first updateStatus so the boot gate can pick a tab.
      root._card = { S, activateTab, tabBtns, panelEl }

      // ── boot: gate tabs from current status, then activate the default tab ──
      const initData = servers.find(x => x.id === id)
      if (initData) updateStatus(root, initData)

      // Pull fresh status on mount so the gates use current data. Also prefetch
      // the profile schema so the Maps-tab gate (which depends on the schema's
      // map fields) is correct without the user first opening Profiles.
      ;(async () => {
        try {
          const fresh = await dbGetServerStatus(id)
          const i = servers.findIndex(x => x.id === id)
          if (i >= 0) servers[i] = { ...servers[i], ...fresh }
          S.server = servers[i] ?? fresh
          updateStatus(root, S.server)
          renderTopFromState()
        } catch {}
        if (!S.schema) { try { S.schema = await dbGetProfileSchema(id); S.cvarRef = S.schema.cvarRef || []; regate() } catch {} }
      })()
    }

    // Gate tab visibility from status and auto-switch if the active tab hides.
    function updateStatus(root, s) {
      const { cls, label, meta } = statusBits(s)
      root.querySelector('.dot').className = `dot ${cls}`
      root.querySelector('.status .label').textContent = label
      root.querySelector('.status .meta').innerHTML = meta

      const running = s.status === 'running'
      const hosting = s.gameStatus === 'hosting'
      const show = (...keys) => keys.forEach(k => { const b = root.querySelector(`[data-act="${k}"]`); if (b) b.style.display = '' })
      const hide = (...keys) => keys.forEach(k => { const b = root.querySelector(`[data-act="${k}"]`); if (b) b.style.display = 'none' })
      if (running) { show('reboot', 'shutdown', 'stop', 'refresh', 'update'); hide('start') }
      else { show('start', 'refresh'); hide('reboot', 'shutdown', 'stop', 'update') }

      const card = root._card
      if (!card) return
      const { S } = card

      // Tab visibility gates (priority order: runtime, profiles, maps, rawcfg).
      const hasMaps = !!(S.schema && (S.schema.groups || []).some(g => (g.fields || []).some(f =>
        f.type === 'maplist' || f.type === 'mapcatalog' || (f.type === 'select' && f.addWorkshop)))) || (S.maps || []).length > 0
      const vis = {
        runtime: hosting,
        profiles: running,
        maps: running && hasMaps,
        rawcfg: running,
      }
      const order = ['runtime', 'profiles', 'maps', 'rawcfg']
      order.forEach(name => {
        const b = card.tabBtns().find(x => x.dataset.srvtab === name)
        if (b) b.hidden = !vis[name]
        const p = card.panelEl(name)
        if (p && !vis[name]) p.hidden = true
      })

      // Pick / keep an active tab among the visible ones.
      const firstVisible = order.find(n => vis[n])
      if (!firstVisible) {
        // nothing to show (server down) — clear active state
        S.activeTab = null
        card.tabBtns().forEach(b => b.classList.remove('active'))
        return
      }
      if (!S.activeTab || !vis[S.activeTab]) {
        card.activateTab(firstVisible, true)
      } else {
        // keep current; ensure its panel is visible + tab marked active
        card.activateTab(S.activeTab, true)
      }
    }

    function formatUpdate(res) {
      if (!res?.steps) return JSON.stringify(res, null, 2)
      return res.steps.map(st => {
        const head = `── ${st.name} (exit ${st.exitCode}) ──`
        return [head, st.stdout, st.stderr && `[stderr]\n${st.stderr}`].filter(Boolean).join('\n')
      }).join('\n\n')
    }
  </script>

</body>
</html>
