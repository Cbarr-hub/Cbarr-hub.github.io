# Game-server containers, layered on top of docker-compose.yml.
#
# Prod normally uses tools/gt.sh prod. Manual compose from /root/gamertown relies
# on project .env for game-service interpolation and docker-compose.yml env_file
# entries for /etc/gamertown/secrets.env:
#
#   docker compose -f docker-compose.yml -f servers.compose.yml up -d --build

# Shared GMOD-family base: gmod + prophunt run the same LinuxGSM image and differ
# only in container_name / environment / ports / volume (overridden per service).
x-gmod-base: &gmod-base
  build: { context: ., dockerfile: docker/gmod/Dockerfile }
  image: gamertown-gmod
  restart: unless-stopped
  stop_grace_period: 90s

services:
  # Scoped Docker Engine proxy. The app talks to THIS (read-only socket, minimal
  # permissions) — never the raw /var/run/docker.sock, which is ~root on the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1          # inspect/list containers
      EXEC: 1                # create/start exec for config read/write
      POST: 1                # start/stop/exec/restart
      INFO: 1                # read-only host facts for the fleet dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      - docker-proxy

  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft   # must equal the registry `container` locator, else
                                # compose names it <project>-minecraft-1 (applies to
                                # every game container below).
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD:?set MINECRAFT_RCON_PASSWORD in project .env}
      MEMORY: "6G"
      LEVEL: ${MC_LEVEL:-world}
    volumes:
      - mc-data:/data
    ports:
      - "25565:25565"

  # RLCraft — modded Minecraft (Forge 1.12.2, modpack v2.9.3). Same itzg image
  # FAMILY as vanilla MC but the java8 tag (Forge < 1.18 needs Java 8).
  # KEYLESS install (no CurseForge API key): itzg installs vanilla Forge 1.12.2
  # from the official Forge maven, then overlays the RLCraft *server pack*
  # (mods + config, ~179 mods) via GENERIC_PACK straight from CurseForge's CDN
  # (forgecdn — no account/key). The server pack ships NO Forge jar or start
  # script, so GENERIC_PACK-over-TYPE=FORGE is the correct shape (AUTO_CURSEFORGE
  # would need a CF_API_KEY). Bump RLCRAFT_SERVER_PACK_URL (+ FORGE_VERSION if the
  # new release needs it) to move to a newer RLCraft. First boot installs Forge +
  # ~179 mods + preps spawn (several min), so the image healthcheck is disabled
  # (it would mark the container unhealthy mid-prep). NOT wired into the bluemap
  # service: BlueMap requires MC >= 1.13, so RLCraft has no web map. Host port
  # 25566 (vanilla MC owns 25565); RCON stays internal on the image default 25575
  # (reached as rlcraft:25575 over the compose network — not published).
  rlcraft:
    image: itzg/minecraft-server:java8
    container_name: rlcraft     # must equal the registry `container` locator
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RLCRAFT_RCON_PASSWORD:?set RLCRAFT_RCON_PASSWORD in project .env}
      MEMORY: "6G"                # verify keeper headroom first; Aikar flags below
      USE_AIKAR_FLAGS: "true"
      TYPE: FORGE
      VERSION: "1.12.2"
      FORGE_VERSION: "14.23.5.2860"   # RLCraft v2.9.3's Forge build
      GENERIC_PACK: ${RLCRAFT_SERVER_PACK_URL:-https://mediafilez.forgecdn.net/files/4612/990/RLCraft+Server+Pack+1.12.2+-+Release+v2.9.3.zip}
      LEVEL: ${RLCRAFT_LEVEL:-rlcraft}
      LEVEL_TYPE: BIOMESOP        # Biomes O' Plenty worldgen — FIRST-BOOT ONLY
      DIFFICULTY: "3"             # Hard (RLCraft is balanced for it)
      ENABLE_COMMAND_BLOCK: "true"   # RLCraft structures/villagers depend on it
      ALLOW_FLIGHT: "true"           # else flying mounts/abilities get kicked
      MAX_TICK_TIME: "-1"            # large RLCraft structures exceed the 60s watchdog
    volumes:
      - rlcraft-data:/data
    ports:
      - "25566:25565"
    healthcheck:
      disable: true               # modded boot far exceeds the default start_period

  factorio:
    image: factoriotools/factorio
    container_name: factorio
    restart: unless-stopped
    environment:
      SAVE_NAME: _active
      GENERATE_NEW_SAVE: "true"
      LOAD_LATEST_SAVE: "false"
    volumes:
      - factorio-data:/factorio
    ports:
      - "34197:34197/udp"         # game port (matches the registry)
      # RCON 27015 is NOT published: the app reaches it on the compose network as
      # factorio:27015. (Publishing it would also collide with the CS2 host port 27015.)

  counterstrike:
    image: joedwards32/cs2
    container_name: counterstrike
    restart: unless-stopped
    environment:
      SRCDS_TOKEN: ${CS2_GSLT:-}
      CS2_SERVERNAME: Gamertown
      CS2_RCONPW: ${CS2_RCON_PASSWORD:?set CS2_RCON_PASSWORD in project .env}
      CS2_PORT: "27015"
      CS2_MAXPLAYERS: "10"
      CS2_GAMEALIAS: competitive
      CS2_STARTMAP: de_dust2
    volumes:
      - cs2-data:/home/steam/cs2-dedicated
    ports:
      - "27015:27015"
      - "27015:27015/udp"

  gmod:
    <<: *gmod-base
    container_name: gmod
    environment:
      GAMEMODE: terrortown
      PORT: "27066"
      GSLT: ${GMOD_GSLT:-}
      RCON_PASSWORD: ${GMOD_RCON_PASSWORD:?set GMOD_RCON_PASSWORD in project .env}
      WORKSHOP_COLLECTION: ${GMOD_WORKSHOP_COLLECTION:-3736674438}
      DEFAULT_MAP: ${GMOD_DEFAULT_MAP:-ttt_clue_se}
      SKIP_CSS: ${SKIP_CSS:-}
      # Addons with custom assets that connecting CLIENTS must download
      # (resource.AddWorkshop — the collection mount is server-side only):
      # Advanced Silenced AWP + TTT Weapon Collection + Detective P90.
      WORKSHOP_CLIENT_DL: ${GMOD_CLIENT_DL:-2058216025,194965598,253737433}
    volumes:
      - gmod-data:/data
    ports:
      - "27066:27066/tcp"
      - "27066:27066/udp"

  prophunt:
    <<: *gmod-base
    container_name: prophunt
    environment:
      GAMEMODE: prop_hunt
      PORT: "27067"
      GSLT: ${PROPHUNT_GSLT:-}
      RCON_PASSWORD: ${PROPHUNT_RCON_PASSWORD:?set PROPHUNT_RCON_PASSWORD in project .env}
      WORKSHOP_COLLECTION: ${PROPHUNT_WORKSHOP_COLLECTION:-3737190377}
      DEFAULT_MAP: ${PROPHUNT_DEFAULT_MAP:-ph_restaurant}
      SKIP_CSS: ${SKIP_CSS:-}
      # Same client-download hook as gmod; off by default (PH clients get the
      # gamemode pushed automatically — list taunt/asset packs here if needed).
      WORKSHOP_CLIENT_DL: ${PROPHUNT_CLIENT_DL:-}
    volumes:
      - ph-data:/data
    ports:
      - "27067:27067/tcp"
      - "27067:27067/udp"

  # BlueMap: 3D web map of the Minecraft world, rendered from a READ-ONLY mc-data
  # mount and served on :8100 (internal only; Caddy proxies it at /map/ behind the
  # auth gate). Preserve the bluemap-data + bluemap-web volumes so restarts take
  # the changed-region update path instead of a full re-render — see
  # docs/bluemap-performance.md. The command below symlinks the active ${MC_LEVEL}
  # world to /app/world (no per-env config edits; volume.subpath is avoided so
  # BlueMap can boot before Minecraft has created the world directory).
  bluemap:
    image: ghcr.io/bluemap-minecraft/bluemap:v5.20
    container_name: bluemap
    restart: unless-stopped
    cpus: ${BLUEMAP_CPUS:-4}    # startup cap; the app-side tuner adjusts it live
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      MC_LEVEL: ${MC_LEVEL:-world}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -eu;
        case "$${MC_LEVEL}" in ""|/*|.*|*../*|*\\*) echo "unsafe MC_LEVEL: $${MC_LEVEL}" >&2; exit 1;; esac;
        ln -sfn "/app/mc-data/$${MC_LEVEL}" /app/world;
        exec java -jar cli.jar -r -u -w -m overworld,nether,end
    volumes:
      # Full volume, read-only; /app/world is a symlink to /app/mc-data/<MC_LEVEL>.
      - mc-data:/app/mc-data:ro
      - ./docker/bluemap/config:/app/config
      - bluemap-data:/app/data    # render state + downloaded assets; preserve for diff updates
      - bluemap-web:/app/web      # generated web app + map tiles; preserve to avoid full rebuilds
    expose:
      - "8100"                    # internal only; Caddy reaches it as bluemap:8100

volumes:
  mc-data:
  rlcraft-data:
  factorio-data:
  cs2-data:
  gmod-data:
  ph-data:
  bluemap-data:
  bluemap-web:
