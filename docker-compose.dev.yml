# Gamertown — DEV override. Live-reload backend + localhost self-signed TLS.
#
# Use ON TOP OF the base stack (it reuses the same secrets via .env.local):
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.dev.yml up --build
#   → then open https://localhost  (accept the self-signed cert)
#
# Differences from production:
#   - Caddy serves `localhost` with a self-signed cert (tls internal), so no hosts
#     entry and no real Origin cert are needed. These `environment` values override
#     the bundle's SITE_ADDRESS / CADDY_TLS (environment > env_file in compose).
#   - The app is built from the Dockerfile `dev` stage (nodemon) with backend/src
#     bind-mounted, so saving a source file restarts the server in-place — no
#     rebuild. nodemon uses --legacy-watch (polling) because inotify events don't
#     cross Docker Desktop bind mounts on Windows/macOS.
#   - The app port is published to localhost for direct (non-TLS) API access.
#   - PUBLIC_HOST defaults to 127.0.0.1 (API/health on localhost), BUT a game client
#     on THIS machine binds to the host LAN IP and CANNOT reach 127.0.0.1 through
#     Docker NAT — so to actually join a game server set DEV_PUBLIC_HOST=<your LAN IP>
#     in .env.local and the panel emits `connect <LAN-IP>:27066`. The gmod/prophunt
#     containers also boot LAN/insecure (LAN_INSECURE=1) so there's no VAC / Steam-auth
#     step to fail over NAT. See docs/local-dev.md.

services:
  app:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      # Set DEV_PUBLIC_HOST=<your LAN IP> in .env.local to join game servers from a
      # client on this machine (127.0.0.1 is unreachable from a LAN-bound game client).
      PUBLIC_HOST: ${DEV_PUBLIC_HOST:-127.0.0.1}
    volumes:
      - ./backend/src:/app/src:ro   # live source; node_modules stay baked in the image
    ports:
      - "127.0.0.1:3000:3000"       # direct API access, e.g. http://localhost:3000/api/health

  caddy:
    environment:
      SITE_ADDRESS: localhost
      CADDY_TLS: tls internal

  # GMOD/TTT + Prop Hunt: boot LAN + insecure in dev so a game client on THIS machine
  # can connect. A Source client binds to the host LAN IP and can't reach the server
  # via Steam-auth over Docker NAT — connect by the host's LAN IP (DEV_PUBLIC_HOST),
  # NOT 127.0.0.1. The GSLT/Workshop still work (the entrypoint keeps them). See
  # docs/local-dev.md. NEVER set LAN_INSECURE on prod.
  gmod:
    environment:
      LAN_INSECURE: "1"

  prophunt:
    environment:
      LAN_INSECURE: "1"
