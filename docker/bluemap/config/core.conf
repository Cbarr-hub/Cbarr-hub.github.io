# BlueMap core config (HOCON). Minimal — unspecified keys take BlueMap defaults.
# accept-download MUST be true or BlueMap refuses to start (it fetches the
# Minecraft client assets it needs to render block textures on first run).
accept-download: true

# Where BlueMap keeps its render state / caches (a named volume in compose).
data: "/app/data"

# Let BlueMap create render workers for all available cores. The app dynamically
# caps the container CPU quota: high when nobody is online, low when players join.
render-thread-count: 0

# BlueMap 5.16+ supports Java render-thread priority. 1 is MIN_PRIORITY, keeping
# map rendering polite when Minecraft, Caddy, or the app need CPU.
render-thread-priority: 1

metrics: false
