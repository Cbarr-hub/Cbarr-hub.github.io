<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamertown Solutions — Sign In</title>
  <link rel="stylesheet" href="site.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at top, rgba(66, 245, 39, 0.12), transparent 30%),
                  radial-gradient(circle at bottom right, rgba(0, 255, 255, 0.08), transparent 28%),
                  var(--bg);
    }

    .auth-shell {
      width: min(560px, 100%);
      background: rgba(18, 24, 35, 0.96);
      border: 2px solid rgba(123, 184, 95, 0.25);
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(0, 255, 0, 0.08);
      overflow: hidden;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .auth-title {
      font-size: clamp(1.7rem, 2.3vw, 2.2rem);
      letter-spacing: 0.02em;
      margin-bottom: 0.25rem;
    }

    .auth-copy {
      color: #a3f9a3;
      line-height: 1.7;
    }

    .auth-form {
      display: grid;
      gap: 1rem;
      width: 100%;
    }

    .auth-form label {
      display: grid;
      gap: 0.4rem;
      font-size: 0.95rem;
      color: #d4d4b8;
    }

    .auth-form input {
      width: 100%;
      background: #242424;
      border: 2px solid #3a3a3a;
      color: var(--text);
      padding: 0.95rem 1rem;
      border-radius: 12px;
    }

    .auth-form button {
      width: 100%;
      cursor: pointer;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--accent-soft);
      color: var(--bg);
      padding: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .auth-form button:hover {
      background: transparent;
      color: var(--accent-soft);
    }

    .auth-status {
      min-height: 3rem;
      padding: 1rem;
      border-radius: 16px;
      border: 1px solid rgba(123, 184, 95, 0.15);
      background: rgba(255, 255, 255, 0.03);
      color: #c3f4c3;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .auth-status.error {
      color: #ff9aa8;
      border-color: rgba(255, 154, 164, 0.3);
    }

    .auth-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .auth-links a {
      color: var(--link);
      font-size: 0.95rem;
      text-decoration: underline;
    }

    .auth-note {
      font-size: 0.85rem;
      color: #8aa888;
      line-height: 1.5;
    }
  </style>
  <link rel="stylesheet" href="site-tabs.css" />
  <script src="site-tabs.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <div>
      <h1 class="auth-title">Gamertown auth center</h1>
      <p class="auth-copy">
        Sign in with your Gamertown account. Accounts are issued by an administrator —
        there is no public sign-up.
      </p>
    </div>

    <div class="auth-status" id="authStatus">Ready to sign in.</div>

    <form class="auth-form" id="signInForm">
      <label>
        Username
        <input type="text" id="loginUsername" autocomplete="username" required maxlength="64" />
      </label>
      <label>
        Password
        <input type="password" id="loginPassword" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign In</button>
    </form>

    <p class="auth-note">
      Need an account? Contact an administrator.
    </p>

    <div class="auth-links">
      <a href="index.html">Return to homepage</a>
      <a href="final.html">Final page (auth only)</a>
    </div>
  </div>

  <script type="module">
    import { dbFindUser } from './db.js'
    import { loadSession } from './auth.js'

    const authStatus = document.getElementById('authStatus')
    const signInForm = document.getElementById('signInForm')

    const setStatus = (text, isError = false) => {
      authStatus.textContent = text
      authStatus.classList.toggle('error', isError)
    }

    const existing = await loadSession()
    if (existing) {
      window.location.href = 'final.html'
    }

    signInForm.addEventListener('submit', async (event) => {
      event.preventDefault()
      setStatus('Signing in...', false)

      const username = document.getElementById('loginUsername').value.trim()
      const password = document.getElementById('loginPassword').value

      if (!username || !password) {
        setStatus('Username and password are required.', true)
        return
      }

      try {
        await dbFindUser(username, password)
      } catch (err) {
        setStatus(err.message || 'Invalid username or password.', true)
        return
      }

      setStatus('Signed in. Redirecting...', false)
      window.location.href = 'final.html'
    })
  </script>
</body>
</html>
