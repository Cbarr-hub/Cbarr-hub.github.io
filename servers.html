<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GamerTownCloud :: Server Control</title>
  <link rel="stylesheet" href="site-tabs.css" />
  <script src="site-tabs.js" defer></script>
  <style>
    body {
      background: #2a2a2a;
      color: #d4d4b8;
      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
      margin: 0;
    }

    a { color: #7bb85f; }
    a:visited { color: #7bb85f; }
    a:hover { color: #42F527; }

    #wrap { padding: 10px 14px; max-width: 1240px; margin: 0 auto; width: auto; }

    .sec-head {
      background: #1e2e1e;
      border: 1px solid #7bb85f;
      border-bottom: none;
      padding: 4px 6px;
      color: #d4d4b8;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── server card ── */
    .srv {
      border: 1px solid #3a3a3a;
      background: #222222;
      margin-bottom: 14px;
    }
    .srv-head {
      background: #1a1a1a;
      border-bottom: 1px solid #3a3a3a;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .srv-name { color: #d4d4b8; font-weight: bold; font-size: 13px; }

    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #555555; display: inline-block; }
    .dot.hosting { background: #42F527; box-shadow: 0 0 4px #42F527; }
    .dot.idle    { background: #c2a13a; box-shadow: 0 0 4px #c2a13a; }
    .dot.down    { background: #888888; }
    .dot.unknown { background: #555555; }
    .dot.busy { background: #c2a13a; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .status .label { color: #999999; text-transform: uppercase; letter-spacing: 1px; }
    .status .meta { color: #666666; }

    .srv-body { padding: 8px; }

    .server-actions {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
      padding: 8px;
      border: 1px solid #333333;
      background: #1d1d1d;
    }

    .action-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #999999;
      font-size: 10px;
      min-height: 14px;
    }

    .action-spinner {
      display: none;
      width: 10px;
      height: 10px;
      border: 2px solid #555555;
      border-top-color: #42F527;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .server-actions[aria-busy="true"] .action-spinner {
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .action-groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .action-group {
      display: grid;
      align-content: start;
      gap: 5px;
      min-width: 0;
      padding: 7px;
      border: 1px solid #3a3a3a;
      background: #181818;
    }

    .action-group[hidden] {
      display: none;
    }

    .action-group-title {
      color: #42F527;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .action-group-note {
      color: #777777;
      font-size: 10px;
      line-height: 1.35;
    }

    .action-group .retro-btn {
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 680px) {
      .action-groups {
        grid-template-columns: 1fr;
      }
    }

    /* container power row — replaces the old 3-group Game-Service / Virtual-Machine
       / Maintenance layout (a single-purpose game container IS the game). */
    .power-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .power-spacer { flex: 1 1 12px; min-width: 8px; }
    button.retro-btn.warn { background: linear-gradient(#6a5a1a, #4a3f12); border-color: #c2a13a; }
    button.retro-btn.warn:hover:not(:disabled) {
      background: linear-gradient(#8a7424, #6a5a1a); color: #f0d878; border-color: #f0d878;
      box-shadow: inset 0 1px 0 rgba(240,216,120,.2), 0 0 9px rgba(194,161,58,.35);
    }

    .connbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .connbar .clbl { color: #7bb85f; font-size: 11px; font-weight: bold; }
    .connbar code {
      flex: 1; min-width: 0; background: #141414; border: 1px solid #2a2a2a; color: #b8d4a0;
      padding: 4px 6px; font-family: "Courier New", monospace; font-size: 12px;
      white-space: nowrap; overflow: auto;
    }
    .copy-btn { background: #2a3a4a; border: 1px solid #5f8fb8; color: #d4d4b8; padding: 4px 10px;
      font-size: 11px; font-weight: bold; cursor: pointer; font-family: Verdana, Arial, sans-serif; }
    .copy-btn:hover { background: #3a5a7a; color: #9fd0ff; }

    button.retro-btn {
      display: inline-flex;
      align-items: center;
      background: #2a4a1a;
      color: #d4d4b8;
      border: 1px solid #7bb85f;
      padding: 4px 12px;
      font-family: Verdana, Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
    }
    button.retro-btn:hover { background: #3a6a2a; color: #42F527; }
    button.retro-btn:disabled { background: #333333; color: #555555; border-color: #3a3a3a; cursor: default; }
    button.retro-btn.danger { background: #4a1a1a; border-color: #b85f5f; }
    button.retro-btn.danger:hover { background: #6a2a2a; color: #ff7777; }

    /* collapse the error row entirely when empty so it doesn't pad the gap
       between the power controls and the first section below; only the rare
       error case reserves space. */
    .srv-err { color: #ff6666; font-size: 11px; }
    .srv-err:not(:empty) { margin-top: 6px; min-height: 14px; }

    /* ── config / update panel (Phase 3) ── */
    .panel { border-top: 1px dashed #3a3a3a; margin-top: 8px; padding-top: 8px; }
    .panel-title { color: #42F527; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .qs-fields { display: grid; grid-template-columns: 120px 1fr; gap: 6px 8px; align-items: center; margin-bottom: 8px; max-width: 420px; }
    .qs-fields label { color: #7bb85f; font-size: 11px; font-weight: bold; }
    .qs-fields select, .qs-fields input { width: 100%; }
    .qs-note { color: #999; font-size: 10px; font-style: italic; margin-left: 8px; }
    .qs-sep { border-top: 1px dashed #3a3a3a; margin: 10px 0; }
    .qs-section-title { color: #7bb85f; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .qs-note-block { color: #999; font-size: 10px; font-style: italic; margin-top: 8px; }
    .qs-fields .retro-btn { padding: 2px 8px; }
    .qs-fields .inline { display: flex; gap: 6px; align-items: center; }
    .qs-fields .inline select { flex: 1; min-width: 0; }
    /* ── Runtime (live) panel — grouped blocks: Quick Actions · Change Map · Console ── */
    .rt-block { margin-bottom: 12px; }
    .rt-block:last-child { margin-bottom: 0; }
    .rt-block-title { color: #7fc0f0; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; }
    .rt-live { color: #0a0a0a; background: #4f9fd0; font-size: 8px; font-weight: bold; padding: 1px 5px; border-radius: 2px; margin-left: 6px; letter-spacing: .5px; text-transform: uppercase; }
    .rt-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
    .rt-actions .retro-btn { width: 100%; justify-content: center; font-family: "Courier New", monospace; }
    .rt-map-bar, .rt-cmd-bar { display: flex; gap: 6px; align-items: center; }
    .rt-map-bar select, .rt-cmd-bar input { flex: 1; min-width: 0; }
    .rt-cmd-bar input { font-family: "Courier New", monospace; }
    .rt-hint { color: #6a7a6a; font-size: 10px; font-style: italic; margin-top: 5px; }
    [data-rt-cmd] { flex: 1; min-width: 0; font-family: "Courier New", monospace; }
    /* live RANGE controls — slider rows for continuous cvars (gravity/speed/…) */
    .rt-ranges { display: grid; gap: 8px; }
    .rt-range { display: grid; grid-template-columns: 104px 1fr 58px auto; gap: 9px; align-items: center; }
    .rt-range > label { color: #7bb85f; font-size: 11px; font-weight: bold; }
    .rt-range input[type=range] { width: 100%; accent-color: #4f9fd0; cursor: pointer; }
    .rt-range-val { color: #b8d4a0; font-family: "Courier New", monospace; font-size: 12px; text-align: right;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.5); background: #141414; border: 1px solid #2a2a2a; border-radius: 2px; padding: 2px 5px; }
    .rt-range .retro-btn { padding: 3px 11px; font-family: "Courier New", monospace; }
    @media (max-width: 520px) {
      .rt-range { grid-template-columns: 84px 1fr auto; }
      .rt-range-val { display: none; }
    }

    /* ── unified per-server console + per-button loading spinner ── */
    .console {
      background: #101410; border: 1px solid #2a2a2a; color: #b8d4a0;
      padding: 6px 8px; font-family: "Courier New", monospace; font-size: 11px;
      white-space: pre-wrap; max-height: 200px; overflow: auto; margin-top: 10px;
    }
    button.retro-btn.loading { position: relative; color: transparent !important; pointer-events: none; }
    button.retro-btn.loading::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 11px; height: 11px; margin: -6px 0 0 -6px;
      border: 2px solid rgba(123,184,95,0.35); border-top-color: #42F527;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .panel-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .panel label { color: #7bb85f; font-size: 11px; font-weight: bold; }
    select, input[type=text], input[type=number] {
      background: #1a1a1a; border: 1px solid #3a3a3a; color: #d4d4b8;
      padding: 3px 4px; font-family: Verdana, Arial, sans-serif; font-size: 11px;
    }
    textarea.cfg {
      width: 100%; box-sizing: border-box; height: 160px; resize: vertical;
      background: #1a1a1a; border: 1px solid #3a3a3a; color: #d4d4b8;
      padding: 4px; font-family: "Courier New", monospace; font-size: 12px;
    }
    pre.out {
      background: #141414; border: 1px solid #2a2a2a; color: #b8d4a0;
      padding: 6px; font-family: "Courier New", monospace; font-size: 11px;
      white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 6px 0 0;
    }

    /* ── startup-config Profiles editor ── */
    .prof-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
    .prof-bar select { flex: 1 1 150px; min-width: 0; }
    .prof-bar .retro-btn { padding: 3px 9px; }
    .prof-active { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
      padding: 2px 7px; border: 1px solid #2a4a1a; background: #162016; color: #42F527; white-space: nowrap; }
    .prof-active.off { color: #c2a13a; border-color: #3a2f10; background: #201c10; }
    .prof-group { border: 1px solid #2a2a2a; background: #141914; margin-bottom: 8px; }
    .prof-group > summary { color: #7bb85f; font-size: 11px; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; padding: 6px 9px; cursor: pointer; list-style: none; background: #1a201a; user-select: none; }
    .prof-group > summary::-webkit-details-marker { display: none; }
    .prof-group > summary::before { content: '▸'; color: #5f8f4f; margin-right: 6px; }
    .prof-group[open] > summary::before { content: '▾'; }
    .prof-grid { display: grid; grid-template-columns: 150px 1fr; gap: 7px 10px; align-items: center; padding: 10px; }
    .prof-grid label { color: #7bb85f; font-size: 11px; font-weight: bold; }
    .prof-grid input, .prof-grid select, .prof-grid textarea { width: 100%; box-sizing: border-box; }
    .prof-grid input[type=checkbox].switch { width: auto; accent-color: #42F527; transform: scale(1.25); justify-self: start; }
    .prof-grid .field-help { grid-column: 1 / -1; color: #777; font-size: 10px; font-style: italic; margin-top: -3px; }
    .prof-grid .ml-label { grid-column: 1 / -1; margin-top: 2px; }
    /* CS map field: by-name select + inline add-workshop form */
    .mapcat .inline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .mapcat .inline select { flex: 1 1 160px; min-width: 0; }
    .mc-add { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .mc-add input { flex: 1 1 110px; min-width: 0; }
    /* CS: import every map from a Steam Workshop collection (names auto-fetched) */
    .mc-import { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .mc-import input { flex: 1 1 150px; min-width: 0; }
    .mc-busy { color: #7fc0f0; font-size: 10px; font-style: italic; margin-top: 5px; }
    /* profile management row (New / Duplicate / Capture / Delete) */
    .prof-manage { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #2a2a2a; flex-wrap: wrap; }
    .prof-manage .retro-btn { padding: 3px 9px; }
    /* ordered map-rotation list builder */
    .maplist { grid-column: 1 / -1; }
    .prof-info { grid-column: 1 / -1; padding: 3px 0 4px; border-top: 1px solid #1e1e1e; }
    .prof-info b { color: #b8d4a0; font-size: 11px; }
    .maplist-rows { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
    .maplist-row { display: flex; align-items: center; gap: 6px; background: #101410; border: 1px solid #2a2a2a; padding: 3px 6px; }
    .maplist-row .mi-idx { color: #5f8f4f; font-size: 10px; width: 18px; text-align: right; }
    .maplist-row .mi-name { flex: 1; min-width: 0; color: #b8d4a0; font-family: "Courier New", monospace; font-size: 11px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .maplist-row .mi-boot { flex: none; color: #0c0c0c; background: #42F527; font-size: 9px; font-weight: bold;
      text-transform: uppercase; letter-spacing: 0.5px; padding: 1px 5px; border-radius: 2px; }
    .mini-btn { background: #23331a; border: 1px solid #4a6a3a; color: #b8d4a0; font-size: 11px; line-height: 1;
      padding: 2px 7px; cursor: pointer; font-family: Verdana, Arial, sans-serif; }
    .mini-btn:hover { background: #33491f; color: #42F527; }
    .mini-btn:disabled { opacity: 0.3; cursor: default; }
    .mini-btn.x { border-color: #7a3a3a; color: #d88; }
    .mini-btn.x:hover { background: #3a1a1a; color: #ff7777; }
    .maplist-add { display: flex; gap: 6px; }
    .maplist-add select { flex: 1; min-width: 0; }
    .maplist-empty { color: #777; font-size: 10px; font-style: italic; padding: 3px 0; }

    /* ── Profile editor (Configuration section): toolbar · groups · action footer.
       Consolidates profile management up top, the fields in the middle, and the
       Save / Apply-&-Restart actions in a clear footer — a single top-to-bottom flow. ── */
    .pf-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
      padding: 8px 10px; margin-bottom: 10px; border: 1px solid #2f3f2a; border-radius: 3px;
      background: linear-gradient(#1b211b, #161a16); box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }
    .pf-select { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; min-width: 0; }
    .pf-lbl { color: var(--gt-green); font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; flex: none; }
    .pf-select select { flex: 1; min-width: 80px; max-width: 260px; }
    .pf-manage { display: flex; flex-wrap: wrap; gap: 5px; flex: none; }
    .pf-manage .mini-btn { padding: 5px 9px; }
    .mini-btn.loading { position: relative; color: transparent !important; pointer-events: none; }
    .mini-btn.loading::after { content:''; position:absolute; left:50%; top:50%; width:9px; height:9px;
      margin:-5px 0 0 -5px; border:2px solid rgba(123,184,95,.35); border-top-color:var(--gt-green);
      border-radius:50%; animation: spin .7s linear infinite; }

    .pf-groups { display: grid; gap: 8px; }
    .prof-group { border-color: #283228; }
    .prof-group > summary { background: linear-gradient(#1a201a, #161a16); }

    .pf-actions {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px;
      padding: 10px 12px; border: 1px solid #2f3f2a; border-radius: 3px;
      background: linear-gradient(#181d18, #131613); box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
    }
    .pf-actions-btns { display: flex; gap: 8px; flex: none; }
    .pf-actions-note { flex: 1 1 180px; color: #8a9a7a; font-size: 10px; line-height: 1.5; }
    .pf-actions-note b { color: #b8d4a0; }
    button.retro-btn.primary {
      background: linear-gradient(#3f9a28, #2c6e1b); border-color: #5fd23a; color: #eafce4;
      box-shadow: inset 0 1px 0 rgba(160,255,120,.30), 0 0 10px rgba(66,245,39,.22);
    }
    button.retro-btn.primary:hover:not(:disabled) {
      background: linear-gradient(#4cb330, #3a8a22); color: #fff; border-color: #6fff44;
      box-shadow: inset 0 1px 0 rgba(180,255,140,.40), 0 0 16px rgba(66,245,39,.45);
    }

    /* collapsible raw-config section */
    details.rawcfg { border-top: 1px dashed #3a3a3a; margin-top: 8px; padding-top: 8px; }
    details.rawcfg > summary { color: #7bb85f; font-size: 11px; font-weight: bold; cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px; list-style: none; user-select: none; }
    details.rawcfg > summary::-webkit-details-marker { display: none; }
    details.rawcfg > summary::before { content: '▸'; color: #5f8f4f; margin-right: 6px; }
    details.rawcfg[open] > summary::before { content: '▾'; }

    /* per-panel loading placeholder (sleek shimmer) */
    .panel-ldg { display: flex; align-items: center; gap: 8px; color: #6f9f5f; font-size: 11px;
      font-style: italic; padding: 8px 2px; }
    .panel-ldg::before {
      content: ''; width: 12px; height: 12px; flex: none;
      border: 2px solid rgba(123,184,95,0.30); border-top-color: #42F527;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }

    /* card sections: group panels into Configuration / Runtime, each
       with a distinct accent so the conceptual areas are visually separated. */
    .srv-section { border-left: 3px solid #2a2a2a; padding-left: 12px; margin-top: 16px; }
    /* the first section sits right under the power controls — keep that gap tight */
    .srv-body > .srv-section:first-of-type { margin-top: 10px; }
    .srv-section-head { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; }
    .srv-section-head span { font-size: 10px; font-weight: normal; text-transform: none; letter-spacing: 0; font-style: italic; color: #777; margin-left: 8px; }
    .srv-section.cfg { border-left-color: #42F527; }
    .srv-section.cfg .srv-section-head { color: #42F527; }
    .srv-section.rt  { border-left-color: #4f9fd0; }
    .srv-section.rt  .srv-section-head { color: #7fc0f0; }
    /* the section head already separates the group → drop the first panel's divider */
    .srv-section > .srv-section-head + .panel { border-top: none; margin-top: 6px; padding-top: 2px; }

    /* ── Proxmox host dashboard ── */
    .dash {
      border: 1px solid #7bb85f; border-top: none;
      background: linear-gradient(180deg, #1c241c 0%, #161616 100%);
      padding: 12px; margin-bottom: 16px;
      box-shadow: inset 0 0 24px rgba(66,245,39,0.05);
    }
    .dash-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .dash-node { color: #42F527; font-weight: bold; font-size: 13px; letter-spacing: 1px; text-shadow: 0 0 6px rgba(66,245,39,0.4); }
    .dash-node .host { color: #d4d4b8; text-shadow: none; }
    .dash-sub { color: #777; font-size: 10px; }
    .dash-sub b { color: #b8d4a0; font-weight: bold; }
    .dash-refresh { color: #666; font-size: 10px; font-style: italic; }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .dash-tile {
      border: 1px solid #333; background: #141914; padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .dash-tile.wide { align-items: stretch; }
    .tile-label { color: #7bb85f; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

    /* radial gauges */
    .gauge { position: relative; width: 108px; height: 108px; }
    .gauge svg { transform: rotate(-90deg); display: block; width: 100%; height: 100%; }
    .gauge .track { stroke: #2a2a2a; }
    .gauge .fill { stroke: #42F527; stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(66,245,39,0.6)); transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease; }
    .gauge.warn .fill { stroke: #c2a13a; filter: drop-shadow(0 0 3px rgba(194,161,58,0.6)); }
    .gauge.crit .fill { stroke: #ff6666; filter: drop-shadow(0 0 3px rgba(255,102,102,0.6)); }
    .gauge-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .gauge-pct { color: #d4d4b8; font-size: 20px; font-weight: bold; font-family: "Courier New", monospace; }
    .gauge-meta { color: #777; font-size: 9px; margin-top: 2px; }

    /* stat rows (uptime / load / versions tile) */
    .stat-rows { display: grid; gap: 7px; width: 100%; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px dashed #2a2a2a; padding-bottom: 5px; }
    .stat-row:last-child { border-bottom: none; padding-bottom: 0; }
    .stat-k { color: #7bb85f; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-v { color: #d4d4b8; font-size: 11px; font-family: "Courier New", monospace; text-align: right; word-break: break-word; }

    /* standalone Events section: player-session table (spans all servers) */
    .events-panel { border: 1px solid #2a2a2a; background: #0d0f0c; margin-top: 14px; }
    .events-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-bottom: 1px solid #2a2a2a; background: #121512; }
    .events-title { color: #42F527; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
    .events-spacer { flex: 1; }
    .events-bar .retro-btn { padding: 2px 8px; }
    .events-select { background: #101410; color: #b8d4a0; border: 1px solid #2a2a2a;
      font-family: "Courier New", monospace; font-size: 11px; padding: 2px 6px; }
    .events-body { padding: 10px; }
    .event-table { display: flex; flex-direction: column; gap: 2px; }
    .event-row { display: grid; grid-template-columns: 1.4fr 1.1fr 1.2fr 1.2fr 0.8fr; gap: 6px; align-items: baseline;
      background: #101410; border: 1px solid #2a2a2a; padding: 4px 7px; font-size: 11px; }
    .event-table.with-srv .event-row { grid-template-columns: 0.9fr 1.3fr 1.1fr 1.1fr 1.1fr 0.7fr; }
    .event-row.online { border-color: #2f5f25; background: #0f140d; }
    .event-thead { background: transparent; border: none; padding: 2px 7px;
      color: #7bb85f; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
    .event-row .ev-name { color: #b8d4a0; font-weight: bold; min-width: 0; word-break: break-word; }
    .event-row .ev-srv { color: #7bb85f; min-width: 0; word-break: break-word; }
    .event-row .ev-id, .event-row .ev-in, .event-row .ev-out, .event-row .ev-dur {
      color: #d4d4b8; font-family: "Courier New", monospace; }
    .event-uid { cursor: help; border-bottom: 1px dotted #555; }
    .event-none { color: #6a6a5a; }
    .ev-online { color: #42F527; font-weight: bold; }

    /* horizontal bars (disk / load) */
    .bar { width: 100%; height: 8px; background: #2a2a2a; border: 1px solid #333; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #42F527; box-shadow: 0 0 6px rgba(66,245,39,0.5); transition: width 0.6s ease, background 0.4s ease; }
    .bar.warn > span { background: #c2a13a; }
    .bar.crit > span { background: #ff6666; }
    .load-list { display: flex; gap: 6px; }
    .load-chip { flex: 1; text-align: center; background: #101410; border: 1px solid #2a2a2a; padding: 4px 0; color: #b8d4a0; font-family: "Courier New", monospace; font-size: 11px; }
    .load-chip small { display: block; color: #666; font-size: 8px; letter-spacing: 1px; }

    /* quick-connect strip (join strings live with the host data) */
    .qc { margin-top: 14px; border-top: 1px solid #2a2a2a; padding-top: 10px; }
    .qc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .qc-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #242424; }
    .qc-row:last-child { border-bottom: none; padding-bottom: 0; }
    .qc-name { color: #d4d4b8; font-weight: bold; font-size: 11px; min-width: 132px; }
    .qc-code { flex: 1; min-width: 0; background: #141414; border: 1px solid #2a2a2a; color: #b8d4a0;
      padding: 3px 7px; font-family: "Courier New", monospace; font-size: 11px; white-space: nowrap; overflow: auto; }
    .qc-down { flex: 1; color: #666; font-size: 10px; font-style: italic; }
    .qc-copy { flex: none; }
    .play-btn {
      flex: none; display: inline-block;
      background: #2a4a1a; border: 1px solid #7bb85f; color: #d4d4b8;
      padding: 4px 10px; font-size: 11px; font-weight: bold; cursor: pointer;
      text-decoration: none; font-family: Verdana, Arial, sans-serif;
    }
    .play-btn:visited { color: #d4d4b8; }
    .play-btn:hover { background: #3a6a2a; color: #42F527; }

    /* brand header */
    #brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .brand-name { font-size: 20px; font-weight: bold; letter-spacing: 1px; color: #d4d4b8; }
    .brand-cloud { color: #42F527; text-shadow: 0 0 8px rgba(66,245,39,0.45); }
    .brand-tag { color: #777; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
    .fleet-summary { color: #777; font-size: 10px; }
    .fleet-summary b { color: #42F527; }
    .dash-err { color: #ff6666; font-size: 11px; }

    /* ── game tab bar ── */
    .tab {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1a1a1a; border: 1px solid #3a3a3a; border-bottom: none;
      color: #999; padding: 8px 16px; font-family: Verdana, Arial, sans-serif;
      font-size: 12px; font-weight: bold; cursor: pointer; position: relative; top: 1px;
      transition: color 0.15s, background 0.15s;
    }
    .tab:hover { color: #d4d4b8; background: #232323; }
    .tab.active { background: #1e2e1e; color: #42F527; border-color: #7bb85f; text-shadow: 0 0 6px rgba(66,245,39,0.4); }
    .tab .dot { width: 8px; height: 8px; }
    .tab-name { letter-spacing: 0.5px; }
    @media (max-width: 520px) {
      .tab { flex: 1 1 auto; justify-content: center; padding: 8px 10px; }
      .qc-name { min-width: 0; }
    }

    #gate { padding: 24px 8px; color: #ff6666; font-size: 13px; }
    #gate a { font-weight: bold; }

    #footer-bar {
      border-top: 1px solid #3a3a3a;
      background: #1f1f1f;
      padding: 6px 8px;
      color: #999999;
      font-size: 10px;
      margin-top: 20px;
    }

    /* ───────────────────────────────────────────────────────────────────────────
       POLISH LAYER — visual refinement only. Overrides earlier rules via the
       cascade; adds NO new DOM/selectors that JS depends on. Amplifies the existing
       phosphor-green CRT-terminal identity (depth · glow · motion · scanlines).
       ─────────────────────────────────────────────────────────────────────────── */
    :root {
      --gt-green: #42F527; --gt-green-soft: #7bb85f; --gt-amber: #c2a13a;
      --gt-ink: #d4d4b8; --gt-line: #444;
    }

    /* smooth micro-interactions on everything interactive */
    button.retro-btn, .copy-btn, .play-btn, .mini-btn, .tab, .qc-code,
    .dash-tile, .qc-row, .prof-group > summary, details.rawcfg > summary,
    .action-group, .srv {
      transition: background .15s ease, color .15s ease, border-color .15s ease,
                  box-shadow .2s ease, transform .08s ease;
    }

    /* buttons — subtle depth, phosphor hover bloom, crisp press */
    button.retro-btn {
      background: linear-gradient(#345c20, #284916);
      border-color: #6fae53; border-radius: 2px; letter-spacing: .3px;
      box-shadow: inset 0 1px 0 rgba(130,210,95,.18), 0 1px 2px rgba(0,0,0,.45);
    }
    button.retro-btn:hover:not(:disabled) {
      background: linear-gradient(#447826, #356019); color: var(--gt-green);
      border-color: var(--gt-green);
      box-shadow: inset 0 1px 0 rgba(150,235,110,.25), 0 0 9px rgba(66,245,39,.35);
    }
    button.retro-btn:active:not(:disabled) {
      transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
    }
    button.retro-btn:disabled { background: #2a2a2a; box-shadow: none; opacity: .6; }
    button.retro-btn.danger { background: linear-gradient(#5a2020, #401616); border-color: #b85f5f; }
    button.retro-btn.danger:hover:not(:disabled) {
      background: linear-gradient(#7a2e2e, #5a2020); color: #ff8a8a; border-color: #ff8a8a;
      box-shadow: inset 0 1px 0 rgba(255,130,130,.2), 0 0 9px rgba(255,90,90,.35);
    }
    .play-btn, .copy-btn { border-radius: 2px; }
    .play-btn:hover { box-shadow: 0 0 9px rgba(66,245,39,.35); }

    /* status dots — richer phosphor glow + a calm "live" breathing while hosting */
    .dot.hosting { box-shadow: 0 0 7px var(--gt-green), 0 0 2px var(--gt-green); animation: gt-breathe 2.6s ease-in-out infinite; }
    .dot.idle    { box-shadow: 0 0 6px var(--gt-amber); }
    @keyframes gt-breathe { 0%,100% { box-shadow: 0 0 5px var(--gt-green); } 50% { box-shadow: 0 0 12px var(--gt-green), 0 0 3px var(--gt-green); } }

    /* cards + grouped panels — layered depth, faint top hairline */
    .srv { border-color: var(--gt-line); border-radius: 3px; background: linear-gradient(#242424,#1e1e1e); box-shadow: 0 2px 12px rgba(0,0,0,.4); }
    .srv-head { background: linear-gradient(#202020,#161616); box-shadow: inset 0 1px 0 rgba(255,255,255,.03); }
    .server-actions, .action-group { border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    .action-group:hover { border-color: #4d4d4d; }
    .panel-title, .tile-label, .action-group-title, .srv-section-head { text-shadow: 0 0 6px rgba(66,245,39,.12); }

    /* tabs — clearer active underline + phosphor bloom */
    .tab:hover { box-shadow: inset 0 -2px 0 rgba(123,184,95,.45); }
    .tab.active { box-shadow: inset 0 -2px 0 var(--gt-green), 0 0 12px rgba(66,245,39,.16); }

    /* terminal-inset feel for code/readouts; quick-connect row hover */
    .qc-code, .stat-v, .load-chip, textarea.cfg, .cfg, [data-rt-cmd], .gauge-pct {
      box-shadow: inset 0 1px 3px rgba(0,0,0,.5); border-radius: 2px;
    }
    .qc-row:hover { background: rgba(123,184,95,.05); }

    /* dashboard depth + a faint CRT flicker on the brand glyph */
    .dash { border-radius: 3px; box-shadow: 0 2px 14px rgba(0,0,0,.45); }
    .dash-tile, .load-chip { border-radius: 3px; }
    .brand-cloud { animation: gt-flicker 8s steps(1) infinite; }
    @keyframes gt-flicker { 0%,95%,100% { opacity: 1; } 96% { opacity: .8; } 97% { opacity: 1; } 98.5% { opacity: .88; } }

    .prof-group > summary:hover, details.rawcfg > summary:hover { color: var(--gt-green); }

    /* whisper-subtle CRT atmosphere: fine scanlines + corner vignette.
       Fixed, pointer-events:none (never blocks clicks); native dialogs/selects
       still render above. Honors reduced-motion + respects readability. */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.045) 2px 3px);
      opacity: .55;
    }
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9997;
      background: radial-gradient(125% 125% at 50% 38%, transparent 62%, rgba(0,0,0,.26) 100%);
    }
    @media (prefers-reduced-motion: reduce) {
      .dot.hosting, .brand-cloud { animation: none; }
    }

    /* ─────────────────────────────────────────────────────────────────────────
       FLEET DECK — the top "command deck": an aggregate header (host facts + two
       fleet-total gauges) over one self-contained ENTITY per game (status · live
       resources · join · quick power). Each entity is also the navigator → opens
       that game's full management card below. Pure additive styling on the
       existing phosphor-green CRT identity.
       ───────────────────────────────────────────────────────────────────────── */
    .fleet-header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 16px 24px; padding: 2px 2px 14px; border-bottom: 1px solid #2a2a2a; margin-bottom: 14px;
    }
    .fleet-id { min-width: 0; }
    .fleet-id .dash-node { font-size: 14px; }
    .fleet-id .dash-sub { margin-top: 3px; }
    .fleet-gauges { display: flex; gap: 22px; }
    .fleet-gauge { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .fleet-glabel { color: #7bb85f; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      text-align: center; line-height: 1.55; }
    .fleet-glabel b { color: #d4d4b8; font-family: "Courier New", monospace; letter-spacing: 0; text-transform: none; font-size: 11px; }

    .gauge.sm { width: 76px; height: 76px; }
    .gauge.sm .gauge-pct { font-size: 16px; }
    .gauge.sm .gauge-meta { font-size: 8px; margin-top: 0; }

    .entity-grid {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: stretch;
    }
    @media (max-width: 1180px) { .entity-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px)  { .entity-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 480px)  { .entity-grid { grid-template-columns: 1fr; } }
    .entity {
      border: 1px solid #333; border-top: 2px solid #3a3a3a; border-radius: 3px;
      background: linear-gradient(#1c211c, #161616); padding: 10px; cursor: pointer;
      display: flex; flex-direction: column; gap: 9px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02), 0 2px 8px rgba(0,0,0,.35);
      transition: border-color .15s, box-shadow .2s, transform .08s ease, background .15s;
    }
    .entity:hover { border-color: #4d4d4d; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(0,0,0,.5); }
    .entity:focus-visible { outline: none; border-color: var(--gt-green-soft); }
    .entity.hosting { border-top-color: #2f7a22; }
    .entity.idle    { border-top-color: #6a5a1a; }
    .entity.active {
      border-color: var(--gt-green); border-top-color: var(--gt-green);
      background: linear-gradient(#1f271f, #171717);
      box-shadow: 0 0 0 1px rgba(66,245,39,.32), 0 0 20px rgba(66,245,39,.12), inset 0 1px 0 rgba(255,255,255,.03);
    }

    .ent-head { display: flex; align-items: center; gap: 7px; }
    .ent-name { color: #d4d4b8; font-weight: bold; font-size: 13px; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ent-state { color: #888; font-size: 9px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .entity.hosting .ent-state { color: var(--gt-green); text-shadow: 0 0 6px rgba(66,245,39,.4); }
    .entity.idle .ent-state { color: var(--gt-amber); }

    /* per-game meters: clean aligned [label · bar · value] rows (no radial — the
       radial gauges are reserved for the fleet TOTAL up top). */
    .ent-meters { display: grid; gap: 7px; }
    .meter { display: grid; grid-template-columns: 34px 1fr 60px; gap: 8px; align-items: center; }
    .meter-k { color: #7bb85f; font-size: 9px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .meter .bar { height: 7px; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
    .meter-v { color: #d4d4b8; font-size: 10px; font-family: "Courier New", monospace; text-align: right;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meter.up .meter-up { grid-column: 2 / 4; color: #b8d4a0; font-size: 10px; font-family: "Courier New", monospace; }

    .ent-conn { display: flex; align-items: center; gap: 6px; }
    .ent-code { flex: 1; min-width: 0; background: #0f130f; border: 1px solid #2a2a2a; color: #b8d4a0;
      padding: 3px 6px; font-family: "Courier New", monospace; font-size: 10px; border-radius: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
    .ent-down { flex: 1; color: #666; font-size: 10px; font-style: italic; }
    .ent-mini { flex: none; background: #1f2a18; border: 1px solid #3f5a2f; color: #b8d4a0;
      font-size: 11px; line-height: 1; padding: 4px 7px; cursor: pointer; border-radius: 2px;
      font-family: Verdana, Arial, sans-serif; text-decoration: none; transition: background .15s, color .15s, border-color .15s; }
    .ent-mini:hover { background: #2c3d20; color: var(--gt-green); border-color: #5f8f4f; }
    .ent-mini.play { color: #9fd0ff; border-color: #3f5a7a; background: #16202c; }
    .ent-mini.play:hover { color: #cfe8ff; border-color: #5f8fb8; background: #1e2f42; }

    .ent-controls { display: flex; gap: 6px; align-items: center; margin-top: auto; }
    .ent-btn { background: linear-gradient(#345c20,#284916); border: 1px solid #6fae53; color: #d4d4b8;
      font-size: 12px; line-height: 1; padding: 5px 10px; cursor: pointer; border-radius: 2px;
      font-family: Verdana, Arial, sans-serif; font-weight: bold;
      box-shadow: inset 0 1px 0 rgba(130,210,95,.18), 0 1px 2px rgba(0,0,0,.45);
      transition: background .15s, color .15s, border-color .15s, box-shadow .2s; }
    .ent-btn:hover { color: var(--gt-green); border-color: var(--gt-green); box-shadow: 0 0 9px rgba(66,245,39,.35); }
    .ent-btn.go { background: linear-gradient(#2f7a22,#236018); }
    .ent-btn.x  { background: linear-gradient(#5a2020,#401616); border-color: #b85f5f; }
    .ent-btn.x:hover { color: #ff8a8a; border-color: #ff8a8a; box-shadow: 0 0 9px rgba(255,90,90,.35); }
    .ent-btn.manage { margin-left: auto; background: #1a1a1a; border-color: #3a3a3a; color: #9fbf8f; font-weight: normal; }
    .ent-btn.manage:hover { color: var(--gt-green); border-color: #6fae53; box-shadow: none; }
    .ent-btn.loading { position: relative; color: transparent !important; pointer-events: none; }
    .ent-btn.loading::after { content:''; position:absolute; left:50%; top:50%; width:11px; height:11px;
      margin:-6px 0 0 -6px; border:2px solid rgba(123,184,95,.35); border-top-color:var(--gt-green);
      border-radius:50%; animation: spin .7s linear infinite; }

    .dash-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px;
      border-top: 1px dashed #242424; padding-top: 8px; }

    @media (max-width: 560px) {
      .fleet-header { justify-content: center; }
      .fleet-gauges { gap: 18px; }
      .entity-grid { grid-template-columns: 1fr; }
    }

    /* ─────────────────────────────────────────────────────────────────────────
       REDESIGN — tabbed per-game card (Runtime / Profiles / Maps / Raw Config).
       Power controls stay above the tabs; the unified console stays below them.
       New classes only — every token + component above is reused as-is.
       ───────────────────────────────────────────────────────────────────────── */
    .srv-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--gt-line); flex-wrap: wrap; margin-top: 10px; }
    .srv-tabs .tab { padding: 7px 16px; top: 1px; }
    .srv-tabs .tab[hidden] { display: none; }
    .tabpanel { padding: 12px 2px; }
    .tabpanel[hidden] { display: none; }

    /* slider field (profile editor) — track + readout + numeric mirror */
    .pf-range { display: grid; grid-template-columns: 1fr 64px auto; gap: 8px; align-items: center; }
    .pf-range input[type=range] { width: 100%; accent-color: var(--gt-green); cursor: pointer; }
    .pf-range input[type=number] { width: 100%; box-sizing: border-box; }
    .pf-range-val { font-family: "Courier New", monospace; color: var(--gt-green-soft); min-width: 46px; text-align: right; }
    .field-unit { color: #777; margin-left: 4px; font-size: 10px; }

    /* segmented control (small enums) */
    .seg { display: inline-flex; border: 1px solid #3a3a3a; border-radius: 2px; overflow: hidden; flex-wrap: wrap; }
    .seg-btn { padding: 3px 9px; background: #161616; color: #b8d4a0; border: none; border-right: 1px solid #3a3a3a;
      cursor: pointer; font-family: Verdana, Arial, sans-serif; font-size: 11px; }
    .seg-btn:last-child { border-right: none; }
    .seg-btn.on { background: #1e2e1e; color: var(--gt-green); }
    .seg-btn:hover:not(.on) { background: #1d231d; }

    /* password field with reveal toggle */
    .pf-pass { display: flex; gap: 6px; align-items: center; }
    .pf-pass input { flex: 1; min-width: 0; }
    .pf-pass .mini-btn { padding: 3px 8px; }

    /* presets/sharing badge in the profile toolbar */
    .pf-badge { font-size: 10px; padding: 1px 6px; border-radius: 2px; white-space: nowrap; }
    .pf-badge.live { color: var(--gt-green); border: 1px solid #2e5a2e; }
    .pf-badge.dirty { color: var(--gt-amber); border: 1px solid #5a4a1e; }

    /* unified Map panel: collection import + catalog + rotation/boot picker */
    .map-import { border: 1px solid #333; background: #181818; padding: 8px; margin-bottom: 10px; border-radius: 3px; }
    .map-import-head { color: var(--gt-green); font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .coll-row { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
    .coll-row input { flex: 1 1 150px; min-width: 0; }
    .coll-result { margin-top: 7px; }
    .coll-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; max-height: 180px; overflow: auto; }
    .map-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 700px) { .map-cols { grid-template-columns: 1fr; } }
    .map-pane { border: 1px solid #2a2a2a; background: #141914; border-radius: 3px; padding: 8px; }
    .map-pane-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
    .map-pane-title { color: #7bb85f; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .map-rows { display: flex; flex-direction: column; gap: 3px; }
    .map-empty { color: #777; font-size: 10px; font-style: italic; padding: 3px 0; }
    .map-foot { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .map-boot-bar { display: flex; gap: 6px; align-items: center; }
    .map-boot-bar select { flex: 1; min-width: 0; }

    /* Raw-config power tools: editor + reference/snippet sidebar */
    .rawcfg-grid { display: grid; grid-template-columns: 1fr 280px; gap: 10px; }
    @media (max-width: 780px) { .rawcfg-grid { grid-template-columns: 1fr; } }
    .rc-editor { min-width: 0; }
    .rc-lint { font-family: "Courier New", monospace; font-size: 10px; color: var(--gt-amber); min-height: 14px; margin: 4px 0; white-space: pre-wrap; }
    .rc-lint.err { color: #e06c6c; }
    .rc-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
    .rc-side { border: 1px solid #333; background: #181818; padding: 8px; border-radius: 3px; }
    .rc-side-title { color: #7bb85f; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .rc-filter { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
    .rc-ref-list { max-height: 220px; overflow: auto; }
    .rc-ref-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid #262626; }
    .rc-ref-row .rc-ref-meta { color: #b8d4a0; font-family: "Courier New", monospace; font-size: 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .rc-ref-row .rc-ref-meta small { color: #777; }
    .rc-ref-help { color: #7a7a64; font-style: italic; font-size: 9px; }
    .rc-snip-list { display: flex; flex-direction: column; gap: 3px; margin: 5px 0; }
    .rc-snip-row { display: flex; align-items: center; gap: 6px; }
    .rc-snip-row .rc-snip-name { flex: 1; min-width: 0; color: #b8d4a0; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-sep { border-top: 1px dashed #2a2a2a; margin: 9px 0; }
    .rc-diff { font-family: "Courier New", monospace; font-size: 11px; white-space: pre; background: #141414; border: 1px solid #333;
      padding: 6px; max-height: 220px; overflow: auto; margin-top: 6px; border-radius: 2px; }
    .rc-del { color: #e06c6c; }
    .rc-add { color: var(--gt-green); }
    .rc-ctx { color: #6a6a5a; }
  </style>
</head>
<body>

  <div id="wrap">
    <div id="gate" style="display:none"></div>

    <div id="panel" style="display:none">
      <div id="brand">
        <span class="brand-name">GamerTown<span class="brand-cloud">Cloud</span></span>
        <span class="brand-tag">game server control</span>
      </div>
      <div class="sec-head">Fleet Status</div>
      <div id="dashboard" class="dash">
        <div class="dash-err" style="font-style:italic;color:#999">loading fleet&hellip;</div>
      </div>

      <div class="sec-head">Server Control</div>
      <div id="server-list">
        <div style="padding:12px;color:#999;font-style:italic">loading...</div>
      </div>
    </div>
  </div>

  <div id="footer-bar">
    &copy; 2026 GamerTownCloud &mdash; all realities reserved
  </div>

  <script type="module">
    import {
      dbGetServers, dbGetServerStatus, dbServerAction,
      dbListServerConfig, dbReadServerConfig, dbWriteServerConfig, dbUpdateServer,
      dbGetServerSettings, dbSaveServerSettings,
      dbListServerMaps, dbAddServerMap, dbRenameServerMap, dbDeleteServerMap, dbSyncServerMaps, dbImportServerCollection,
      dbListServerConfigs, dbGetServerConfigBody, dbCreateServerConfig, dbUpdateServerConfig, dbDeleteServerConfig,
      dbGetServerLive, dbServerLiveCommand, dbServerLiveAction,
      dbGetServerSessions,
      dbListProfiles, dbGetProfileSchema, dbGetProfile, dbCreateProfile,
      dbUpdateProfile, dbDeleteProfile, dbApplyProfile, dbCaptureProfile,
      dbGetNodeStatus,
    } from './db.js'
    import { loadSession } from './auth.js'

    const gate  = document.getElementById('gate')
    const panel = document.getElementById('panel')

    // Page state — declared before the admin gate so boot() (called from the
    // gate, below) can never touch these bindings in their temporal dead zone.
    // The gate runs after a top-level `await`, so without hoisting these a slow
    // (e.g. mobile) load could resume boot() before the original declarations
    // ran → "Cannot access 'servers' before initialization".
    let servers = []
    let activeId = null
    let lastNode = null   // last Docker host snapshot — lets the deck re-render without re-hitting /node

    // ── admin gate ─────────────────────────────────────────────
    const session = await loadSession()
    if (!session) {
      gate.style.display = 'block'
      gate.innerHTML = 'You must <a href="signin.html">sign in</a> as an admin to control servers.'
    } else if (!session.isAdmin) {
      gate.style.display = 'block'
      gate.textContent = 'Admins only. Your account does not have server-control access.'
    } else {
      panel.style.display = 'block'
      boot()
    }

    // ── helpers ────────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
    function fmtUptime(sec) {
      sec = Math.floor(sec || 0)
      if (sec <= 0) return ''
      const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60)
      if (d) return `up ${d}d ${h}h`
      if (h) return `up ${h}h ${m}m`
      return `up ${m}m`
    }
    function fmtBytes(n) {
      if (n == null || !Number.isFinite(n)) return '—'
      const u = ['B','KB','MB','GB','TB']
      let i = 0
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++ }
      return `${n < 10 && i > 0 ? n.toFixed(1) : Math.round(n)} ${u[i]}`
    }

    // ── Proxmox host dashboard ─────────────────────────────────────────────
    const GAUGE_C = 2 * Math.PI * 46  // circumference for r=46 radial gauge

    function sevClass(pct) { return pct >= 90 ? 'crit' : pct >= 70 ? 'warn' : '' }

    function gaugeHtml(pct, center, meta, extraCls = '') {
      const p = Math.max(0, Math.min(100, pct || 0))
      const offset = GAUGE_C * (1 - p / 100)
      return `
        <div class="gauge ${sevClass(p)}${extraCls ? ' ' + extraCls : ''}">
          <svg width="108" height="108" viewBox="0 0 108 108">
            <circle class="track" cx="54" cy="54" r="46" fill="none" stroke-width="10"></circle>
            <circle class="fill" cx="54" cy="54" r="46" fill="none" stroke-width="10"
              stroke-dasharray="${GAUGE_C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>
          </svg>
          <div class="gauge-center">
            <span class="gauge-pct">${center}</span>
            ${meta ? `<span class="gauge-meta">${esc(meta)}</span>` : ''}
          </div>
        </div>`
    }

    function barHtml(pct) {
      const p = Math.max(0, Math.min(100, pct || 0))
      return `<div class="bar ${sevClass(p)}"><span style="width:${p.toFixed(1)}%"></span></div>`
    }

    // Copy text to the clipboard with a graceful fallback for non-secure
    // contexts, and flash the triggering button. Shared by Quick Connect + cards.
    async function copyToClipboard(str, btn) {
      try {
        await navigator.clipboard.writeText(str)
      } catch {
        const ta = document.createElement('textarea')
        ta.value = str; ta.style.position = 'fixed'; ta.style.opacity = '0'
        document.body.appendChild(ta); ta.select()
        try { document.execCommand('copy') } catch {}
        ta.remove()
      }
      if (btn) { const old = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = old }, 1200) }
    }

    // Quick Connect: every server's copyable join string surfaced next to the
    // host data, plus a one-line fleet summary. Status dots reflect last poll.
    function fleetHtml() {
      if (!servers.length) return ''
      const rows = servers.map(s => {
        const { cls, label } = statusBits(s)
        const conn = s.connect?.string
        const launch = s.connect?.launch
        return `<div class="qc-row">
          <span class="dot ${cls}" title="${esc(label)}"></span>
          <span class="qc-name">${esc(s.name)}</span>
          ${conn
            ? `<code class="qc-code">${esc(conn)}</code><button class="copy-btn qc-copy" data-qc-copy="${esc(conn)}">Copy</button>${launch
                ? `<a class="play-btn" href="${esc(launch)}" title="Open the game and connect to this server">Launch via Steam</a>`
                : ''}`
            : `<span class="qc-down">${esc(label.toLowerCase())} — no join address</span>`}
        </div>`
      }).join('')
      const hosting = servers.filter(s => s.gameStatus === 'hosting').length
      const running = servers.filter(s => s.status === 'running').length
      return `<div class="qc">
        <div class="qc-head">
          <span class="tile-label">Quick Connect</span>
          <span class="fleet-summary"><b>${running}</b>/${servers.length} up &middot; <b>${hosting}</b> hosting</span>
        </div>
        ${rows}
      </div>`
    }

    function wireQuickConnect() {
      document.querySelectorAll('[data-qc-copy]').forEach(btn => {
        btn.addEventListener('click', () => copyToClipboard(btn.dataset.qcCopy, btn))
      })
    }

    // Fleet "command deck" (Docker host). Instead of separate host tiles + a Quick
    // Connect list, every game is ONE self-contained ENTITY — status, live CPU/mem,
    // uptime, join string, and quick power — and the header rolls the per-container
    // cpu/mem up into a single fleet-vs-host TOTAL. Each entity is also the
    // navigator: click it to open that game's full management card below.
    function fleetTotals(n) {
      const run = servers.filter(s => s.status === 'running')
      const cpuCores = run.reduce((a, s) => a + (s.cpu || 0), 0)   // sum of per-container "cores' worth"
      const mem = run.reduce((a, s) => a + (s.mem || 0), 0)
      return {
        run: run.length,
        cpuCores,
        cpuPct: n?.ncpu ? (cpuCores / n.ncpu) * 100 : 0,
        mem,
        memPct: n?.memTotal ? (mem / n.memTotal) * 100 : 0,
      }
    }

    function entityHtml(s) {
      const { cls, label } = statusBits(s)
      const up = s.status === 'running'
      const cpuPct = up && s.cpu != null ? s.cpu * 100 : 0
      const memPct = up && s.maxmem ? (s.mem / s.maxmem) * 100 : 0
      const conn = s.connect?.string, launch = s.connect?.launch
      const active = s.id === activeId
      const controls = up
        ? `<button class="ent-btn" data-ent-act="reboot" data-ent-id="${esc(s.id)}" title="Restart">⟳</button>
           <button class="ent-btn x" data-ent-act="shutdown" data-ent-id="${esc(s.id)}" title="Stop">■</button>`
        : `<button class="ent-btn go" data-ent-act="start" data-ent-id="${esc(s.id)}" title="Start">▸ Start</button>`
      return `
        <div class="entity ${cls}${active ? ' active' : ''}" data-entity="${esc(s.id)}" tabindex="0" role="button" aria-pressed="${active}" title="Manage ${esc(s.name)}">
          <div class="ent-head">
            <span class="dot ${cls}"></span>
            <span class="ent-name">${esc(s.name)}</span>
            <span class="ent-state">${esc(label)}</span>
          </div>
          <div class="ent-meters">
            <div class="meter"><span class="meter-k">CPU</span>${up ? barHtml(cpuPct) : '<div class="bar"></div>'}<span class="meter-v">${up ? cpuPct.toFixed(0) + '%' : '—'}</span></div>
            <div class="meter" title="${up && s.maxmem ? esc(fmtBytes(s.mem) + ' / ' + fmtBytes(s.maxmem)) : ''}"><span class="meter-k">Mem</span>${up && s.maxmem ? barHtml(memPct) : '<div class="bar"></div>'}<span class="meter-v">${up ? fmtBytes(s.mem) : '—'}</span></div>
            <div class="meter up"><span class="meter-k">Up</span><span class="meter-up">${up ? esc((fmtUptime(s.uptime) || '—').replace(/^up /, '')) : 'offline'}</span></div>
          </div>
          <div class="ent-conn">
            ${conn
              ? `<code class="ent-code" title="${esc(conn)}">${esc(conn)}</code>
                 <button class="ent-mini" data-ent-copy="${esc(conn)}" title="Copy join string">⧉</button>
                 ${launch ? `<a class="ent-mini play" href="${esc(launch)}" title="Launch via Steam">▶</a>` : ''}`
              : `<span class="ent-down">no join address</span>`}
          </div>
          <div class="ent-controls">
            ${controls}
            <button class="ent-btn manage" data-ent-manage="${esc(s.id)}">Manage ▸</button>
          </div>
        </div>`
    }

    function fleetHeaderHtml(n) {
      const t = fleetTotals(n)
      const cores = n.ncpu ? `${t.cpuCores.toFixed(2)} / ${n.ncpu} cores` : `${t.cpuCores.toFixed(2)} cores`
      return `
        <div class="fleet-header">
          <div class="fleet-id">
            <span class="dash-node">▣ DOCKER <span class="host">${esc(n.name || 'host')}</span></span>
            <div class="dash-sub">${esc(n.ncpu ? n.ncpu + ' cores' : '')}${n.memTotal ? ' &middot; ' + fmtBytes(n.memTotal) + ' RAM' : ''}${n.os ? ' &middot; ' + esc(n.os) : ''}</div>
            <div class="dash-sub">${n.engineVersion ? '<b>Docker ' + esc(n.engineVersion) + '</b>' : ''}${n.containersRunning != null ? (n.engineVersion ? ' &middot; ' : '') + n.containersRunning + '/' + n.containers + ' containers up' : ''}</div>
          </div>
          <div class="fleet-gauges">
            <div class="fleet-gauge">
              ${gaugeHtml(t.cpuPct, t.cpuPct.toFixed(0) + '%', '')}
              <span class="fleet-glabel">Fleet CPU<br><b>${cores}</b></span>
            </div>
            <div class="fleet-gauge">
              ${gaugeHtml(t.memPct, t.memPct.toFixed(0) + '%', '')}
              <span class="fleet-glabel">Fleet RAM<br><b>${fmtBytes(t.mem)} / ${fmtBytes(n.memTotal)}</b></span>
            </div>
          </div>
        </div>`
    }

    function renderDockerDashboard(n) {
      lastNode = n
      const host = document.getElementById('dashboard')
      host.innerHTML = `
        ${fleetHeaderHtml(n)}
        <div class="entity-grid">${servers.map(entityHtml).join('') || '<div class="dash-sub">no servers</div>'}</div>
        <div class="dash-foot">
          <span class="dash-refresh">live &middot; refreshes every 10s</span>
          <span class="dash-refresh">updated ${new Date().toLocaleTimeString()}</span>
        </div>`
      wireEntities()
    }

    // Re-render the deck from current servers[] + the last host snapshot — used
    // after an action / card refresh without re-hitting /node.
    function renderTopFromState() { if (lastNode) renderDockerDashboard(lastNode) }

    function wireEntities() {
      const host = document.getElementById('dashboard')
      host.querySelectorAll('[data-ent-copy]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation(); copyToClipboard(b.dataset.entCopy, b)
      }))
      host.querySelectorAll('.ent-mini.play').forEach(a => a.addEventListener('click', e => e.stopPropagation()))
      host.querySelectorAll('[data-ent-act]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation(); entityAction(b.dataset.entId, b.dataset.entAct, b)
      }))
      host.querySelectorAll('[data-ent-manage]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation(); selectServer(b.dataset.entManage)
      }))
      host.querySelectorAll('[data-entity]').forEach(card => {
        const open = () => selectServer(card.dataset.entity)
        card.addEventListener('click', open)
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open() } })
      })
    }

    // Open a game's full management card below the deck + highlight its entity.
    function selectServer(id) {
      if (!servers.some(s => s.id === id)) return
      activeId = id
      renderActiveCard()
      renderTopFromState()
      document.getElementById('server-list')?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }

    // Quick power control from an entity — container start/restart/stop, which work
    // on every game. Re-syncs the deck + the open card afterward.
    async function entityAction(id, act, btn) {
      if (act === 'shutdown' && !confirm('Stop this server now? Active players will be disconnected.')) return
      if (btn) btn.classList.add('loading')
      try {
        await dbServerAction(id, act)
        await new Promise(r => setTimeout(r, 1500))
        try { servers = await dbGetServers() } catch {}
        renderTopFromState()
        const root = document.getElementById(`srv-${id}`)
        const s = servers.find(x => x.id === id)
        if (root && s) updateStatus(root, s)
      } catch (e) {
        alert(`${actionLabels[act] || act} failed: ${e.message}`)
      } finally {
        if (btn) btn.classList.remove('loading')
      }
    }

    function renderDashboard(n) {
      if (n && n.kind === 'docker') return renderDockerDashboard(n)
      const host = document.getElementById('dashboard')
      const cpuPct = n.cpu != null ? n.cpu * 100 : 0
      const memPct = (n.memory?.total) ? (n.memory.used / n.memory.total) * 100 : 0
      const diskPct = (n.rootfs?.total) ? (n.rootfs.used / n.rootfs.total) * 100 : 0
      const swapPct = (n.swap?.total) ? (n.swap.used / n.swap.total) * 100 : 0
      const load = n.loadavg || []
      const loadChips = ['1m','5m','15m'].map((lbl, i) =>
        `<div class="load-chip">${(load[i] ?? 0).toFixed(2)}<small>${lbl}</small></div>`).join('')

      host.innerHTML = `
        <div class="dash-head">
          <div>
            <span class="dash-node">▣ NODE <span class="host">${esc(n.node || 'pve')}</span></span>
            <div class="dash-sub">${esc(n.cpus ? n.cpus + ' cores' : '')}${n.cpuModel ? ' &middot; ' + esc(n.cpuModel) : ''}</div>
          </div>
          <div class="dash-sub" style="text-align:right">
            ${n.pveversion ? `<div><b>${esc(n.pveversion)}</b></div>` : ''}
            ${n.kversion ? `<div>${esc(n.kversion)}</div>` : ''}
          </div>
        </div>
        <div class="dash-grid">
          <div class="dash-tile">
            <span class="tile-label">CPU</span>
            ${gaugeHtml(cpuPct, cpuPct.toFixed(0) + '%', n.cpus ? n.cpus + ' cores' : '')}
          </div>
          <div class="dash-tile">
            <span class="tile-label">Memory</span>
            ${gaugeHtml(memPct, memPct.toFixed(0) + '%', `${fmtBytes(n.memory?.used)} / ${fmtBytes(n.memory?.total)}`)}
          </div>
          <div class="dash-tile wide">
            <span class="tile-label">Host</span>
            <div class="stat-rows">
              <div class="stat-row"><span class="stat-k">Uptime</span><span class="stat-v">${esc((fmtUptime(n.uptime) || 'down').replace(/^up /,''))}</span></div>
              <div class="stat-row"><span class="stat-k">Disk (/)</span><span class="stat-v">${fmtBytes(n.rootfs?.used)} / ${fmtBytes(n.rootfs?.total)}</span></div>
              <div class="stat-row" style="border:none;padding:0">${barHtml(diskPct)}</div>
              ${n.swap?.total ? `<div class="stat-row"><span class="stat-k">Swap</span><span class="stat-v">${swapPct.toFixed(0)}%</span></div>` : ''}
            </div>
          </div>
          <div class="dash-tile wide">
            <span class="tile-label">Load Average</span>
            <div class="load-list">${loadChips}</div>
            <div class="stat-rows" style="margin-top:8px">
              <div class="stat-row"><span class="stat-k">Per-core 1m</span><span class="stat-v">${n.cpus ? ((load[0] ?? 0) / n.cpus * 100).toFixed(0) + '%' : '—'}</span></div>
              ${n.cpus ? `<div class="stat-row" style="border:none;padding:0">${barHtml((load[0] ?? 0) / n.cpus * 100)}</div>` : ''}
            </div>
          </div>
        </div>
        ${fleetHtml()}
        <div class="dash-head" style="margin:10px 0 0">
          <span class="dash-refresh">live &middot; refreshes every 10s</span>
          <span class="dash-refresh">updated ${new Date().toLocaleTimeString()}</span>
        </div>`
      wireQuickConnect()
    }

    async function refreshDashboard() {
      try {
        // Pull host facts + the live per-game cpu/mem/status together so the deck's
        // gauges + fleet total stay current (the servers list carries the stats).
        const [n, all] = await Promise.all([
          dbGetNodeStatus(),
          dbGetServers().catch(() => null),
        ])
        if (Array.isArray(all)) servers = all
        renderDashboard(n)
      } catch (e) {
        const host = document.getElementById('dashboard')
        // Keep any previously-rendered deck; only show error on first load.
        if (host.querySelector('.entity-grid')) return
        host.innerHTML = `<div class="dash-err">fleet stats unavailable: ${esc(e.message)}</div>`
      }
    }

    function startDashboard() {
      refreshDashboard()
      setInterval(refreshDashboard, 10000)
    }

    async function boot() {
      try {
        servers = await dbGetServers()
      } catch (e) {
        document.getElementById('server-list').innerHTML =
          `<div style="padding:12px;color:#ff6666">error: ${esc(e.message)}</div>`
        return
      }
      render()
      startDashboard()
    }

    // Tabbed layout: a tab bar + a single active card. Only the selected game's
    // panels are mounted/fetched, which keeps the page light (one game's worth of
    // API calls instead of all four). All per-card logic stays scoped to its
    // #srv-<id> root, so wiring one card at a time is equivalent to the old
    // render-all approach — just cleaner and lighter.
    function render() {
      const host = document.getElementById('server-list')
      if (!servers.length) {
        host.innerHTML = '<div style="padding:12px;color:#999">no servers configured</div>'
        return
      }
      if (!activeId || !servers.some(s => s.id === activeId)) activeId = servers[0].id
      // The fleet deck (above) is the navigator now — clicking an entity selects it.
      // The Events section is standalone (spans all servers), below the active card.
      host.innerHTML = '<div id="active-card"></div><div id="events-section"></div>'
      renderActiveCard()
      renderEventsSection()
    }

    function renderActiveCard() {
      const host = document.getElementById('active-card')
      const s = servers.find(x => x.id === activeId)
      if (!host || !s) return
      host.innerHTML = cardHtml(s)
      wireCard(s.id)
    }

    // ── standalone Events section (player sessions, spans all servers) ──────────
    // Lives on its own below the active card so the per-game tabs stay uncramped.
    // A host-side collector writes the join/leave rows; this just reads + displays.
    let eventsFilter = 'all'      // 'all' | a server id
    let eventsRows = []

    const evClock = (sec) => sec ? new Date(sec * 1000).toLocaleString([], {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
    }) : '—'
    function evDur(s) {
      const open = s.left_at == null
      let n = Math.max(0, (open ? Math.floor(Date.now() / 1000) : s.left_at) - s.joined_at)
      const h = Math.floor(n / 3600); n %= 3600
      const m = Math.floor(n / 60); const sec = n % 60
      const str = h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`
      return open ? `${str}+` : str
    }
    // SteamID64 / Mojang UUID are long — abbreviate for the table; full value on hover.
    function evId(s) {
      if (!s.uid) return '<span class="event-none" title="no native id (CS2 redacts SteamIDs)">—</span>'
      const u = String(s.uid)
      const abbr = u.length > 14 ? `${u.slice(0, 6)}…${u.slice(-4)}` : u
      return `<span class="event-uid" title="${esc(u)}">${esc(abbr)}</span>`
    }

    function renderEventsSection() {
      const host = document.getElementById('events-section')
      if (!host) return
      const opts = ['<option value="all">All servers</option>']
        .concat(servers.map(s => `<option value="${esc(s.id)}"${eventsFilter === s.id ? ' selected' : ''}>${esc(s.name)}</option>`))
        .join('')
      host.innerHTML = `
        <div class="events-panel">
          <div class="events-bar">
            <span class="events-title">▦ Player Events</span>
            <span class="qs-note">Join/leave history collected on the host — independent of this page.</span>
            <span class="events-spacer"></span>
            <select class="events-select" data-ev-filter aria-label="Filter events by server">${opts}</select>
            <button class="retro-btn" type="button" data-ev-refresh>↻ Refresh</button>
          </div>
          <div class="events-body" data-ev-body><div class="panel-ldg">Loading…</div></div>
        </div>`
      host.querySelector('[data-ev-filter]')?.addEventListener('change', (e) => {
        eventsFilter = e.target.value
        loadEventsSection()
      })
      host.querySelector('[data-ev-refresh]')?.addEventListener('click', (e) =>
        withBtnBare(e.currentTarget, loadEventsSection))
      loadEventsSection()
    }

    // Spinner-on-button wrapper for the standalone section (the per-card withBtn is
    // scoped inside wireCard; this is the top-level equivalent for the Events bar).
    async function withBtnBare(btn, fn) {
      const prev = btn ? btn.disabled : false
      if (btn) { btn.disabled = true; btn.classList.add('loading') }
      try { return await fn() } finally { if (btn) { btn.disabled = prev; btn.classList.remove('loading') } }
    }

    async function loadEventsSection() {
      const body = document.querySelector('#events-section [data-ev-body]')
      if (!body) return
      const showServer = eventsFilter === 'all'
      try {
        if (showServer) {
          // Merge each server's recent sessions, tagging the source server.
          const per = await Promise.all(servers.map(async (s) => {
            const rows = await dbGetServerSessions(s.id, { limit: 100 }).catch(() => [])
            return rows.map(r => ({ ...r, serverName: s.name }))
          }))
          eventsRows = per.flat().sort((a, b) => b.joined_at - a.joined_at)
        } else {
          const s = servers.find(x => x.id === eventsFilter)
          const rows = await dbGetServerSessions(eventsFilter, { limit: 200 }).catch(() => [])
          eventsRows = rows.map(r => ({ ...r, serverName: s?.name || eventsFilter }))
        }
      } catch (e) {
        body.innerHTML = `<div class="qs-note-block">events unavailable: ${esc(e.message)}</div>`
        return
      }
      renderEventsRows(showServer)
    }

    function renderEventsRows(showServer) {
      const body = document.querySelector('#events-section [data-ev-body]')
      if (!body) return
      if (!eventsRows.length) {
        body.innerHTML = '<div class="qs-note-block">No sessions recorded yet.</div>'
        return
      }
      const srvCol = (txt) => showServer ? `<span class="ev-srv">${txt}</span>` : ''
      const rows = eventsRows.map(s => `
        <div class="event-row${s.left_at == null ? ' online' : ''}">
          ${srvCol(esc(s.serverName))}
          <span class="ev-name">${esc(s.name)}</span>
          <span class="ev-id">${evId(s)}</span>
          <span class="ev-in">${evClock(s.joined_at)}</span>
          <span class="ev-out">${s.left_at == null ? '<span class="ev-online">online</span>' : evClock(s.left_at)}</span>
          <span class="ev-dur">${evDur(s)}</span>
        </div>`).join('')
      body.innerHTML = `
        <div class="event-table${showServer ? ' with-srv' : ''}">
          <div class="event-row event-thead">
            ${srvCol('Server')}
            <span class="ev-name">Player</span><span class="ev-id">ID</span>
            <span class="ev-in">Logged in</span><span class="ev-out">Logged out</span><span class="ev-dur">Duration</span>
          </div>
          ${rows}
        </div>`
    }

    function statusBits(s) {
      const gs = s.gameStatus
      let cls, label
      if      (gs === 'hosting') { cls = 'hosting'; label = 'HOSTING' }
      else if (gs === 'idle')    { cls = 'idle';    label = 'IDLE' }
      else if (gs === 'down')    { cls = 'down';    label = 'DOWN' }
      else                       { cls = 'unknown'; label = s.status ?? 'UNKNOWN' }
      const meta = s.status === 'running' && s.uptime ? `&mdash; ${esc(fmtUptime(s.uptime))}` : ''
      return { cls, label, meta }
    }

    const actionLabels = {
      refresh: 'Refresh',
      start: 'Start',
      reboot: 'Restart',
      shutdown: 'Stop',
      stop: 'Force Stop',
    }

    // ── per-card render: power controls (always) + 4 tabs + unified console ──
    // Tabs: Runtime / Profiles / Maps / Raw Config. Power stays above; console
    // below. Each tab lazy-loads on first activation into the shared state S.
    const TABS = [
      { key: 'runtime',  label: 'Runtime' },
      { key: 'profiles', label: 'Profiles' },
      { key: 'maps',     label: 'Maps' },
      { key: 'rawcfg',   label: 'Raw Config' },
    ]

    function cardHtml(s) {
      const { cls, label, meta } = statusBits(s)
      const tabsHtml = TABS.map(t =>
        `<button class="tab" type="button" role="tab" data-srvtab="${t.key}" hidden>
           <span class="tab-name">${esc(t.label)}</span>
         </button>`).join('')
      const panelsHtml = TABS.map(t =>
        `<div class="tabpanel" data-tabpanel="${t.key}" role="tabpanel" hidden>
           <div data-tab-body><div class="panel-ldg">Loading…</div></div>
         </div>`).join('')
      return `
      <div class="srv" id="srv-${esc(s.id)}">
        <div class="srv-head">
          <div><span class="srv-name">${esc(s.name)}</span></div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="status" data-status>
              <span class="dot ${cls}"></span>
              <span class="label">${esc(label)}</span>
              <span class="meta">${meta}</span>
            </div>
          </div>
        </div>
        <div class="srv-body">
          <div class="server-actions" data-actions aria-label="Server power controls">
            <div class="action-status" data-action-status>
              <span class="action-spinner" aria-hidden="true"></span>
              <span data-action-status-text>Power controls for this game container.</span>
            </div>
            <div class="power-row">
              <button class="retro-btn" type="button" data-act="start">▸ Start</button>
              <button class="retro-btn" type="button" data-act="reboot">⟳ Restart</button>
              <button class="retro-btn warn" type="button" data-act="shutdown" title="Graceful stop — disconnects players">■ Stop</button>
              <button class="retro-btn danger" type="button" data-act="stop" title="Hard kill — can corrupt an in-progress save">⨯ Force Stop</button>
              <span class="power-spacer"></span>
              <button class="retro-btn" type="button" data-act="update" title="Update the game client (downloads the latest server build)">⬆ Update</button>
              <button class="retro-btn" type="button" data-act="refresh">↻ Refresh</button>
            </div>
          </div>
          <div class="srv-err" data-err></div>

          <div class="srv-tabs" role="tablist" data-srvtabs>${tabsHtml}</div>
          <div class="srv-tabpanels" data-srvpanels>${panelsHtml}</div>

          <pre class="console" data-console style="display:none"></pre>
        </div>
      </div>`
    }

    function wireCard(id) {
      const root = document.getElementById(`srv-${id}`)
      const errEl = root.querySelector('[data-err]')
      const consoleEl = root.querySelector('[data-console]')
      const actionStatus = root.querySelector('[data-action-status-text]')

      // Per-card state object S — one cache shared by all four tabs. S.values is
      // shared by Profiles + Maps so rotation edits stay coherent across tabs.
      const S = {
        id, server: servers.find(x => x.id === id) || null,
        loaded: { runtime: false, profiles: false, maps: false, rawcfg: false },
        activeTab: null,
        // profiles
        schema: null, list: [], activeId: null, editId: null, values: {}, dirty: false,
        // maps
        maps: [],
        // rawcfg
        files: [], curFile: null, fileBaseline: '', configs: [], cvarRef: [],
        // runtime
        live: null,
      }

      const setErr = (m) => { errEl.textContent = m || '' }
      const setBusy = (busy, label = 'Working...') => {
        root.querySelectorAll('[data-actions] button').forEach(b => {
          b.disabled = busy
          b.setAttribute('aria-disabled', String(busy))
        })
        const dot = root.querySelector('.dot')
        root.querySelector('[data-actions]').setAttribute('aria-busy', String(busy))
        if (busy) {
          dot.className = 'dot busy'
          actionStatus.textContent = label
        } else {
          actionStatus.textContent = 'Choose an action below.'
          const current = servers.find(x => x.id === id)
          if (current) updateStatus(root, current)
        }
      }
      // unified per-server console: every state change logs its result here.
      function logLine(text, body) {
        consoleEl.style.display = 'block'
        const t = new Date().toLocaleTimeString()
        let entry = `[${t}] ${text}`
        if (body != null && String(body).trim()) entry += `\n${String(body).replace(/\s+$/, '')}`
        consoleEl.textContent += (consoleEl.textContent ? '\n' : '') + entry
        consoleEl.scrollTop = consoleEl.scrollHeight
      }
      // run an async op with a spinner on the triggering control + error capture.
      async function withBtn(btn, label, fn) {
        setErr('')
        const prev = btn ? btn.disabled : false
        if (btn) { btn.disabled = true; btn.classList.add('loading') }
        try {
          return await fn()
        } catch (e) {
          // surface a server-side BAD_SETTING message verbatim — it's human text.
          setErr(e.message); if (label) logLine(`${label} — error: ${e.message}`)
          throw e
        } finally {
          if (btn) { btn.disabled = prev; btn.classList.remove('loading') }
        }
      }

      async function refresh() {
        try {
          const all = await dbGetServers()
          servers = all
          const s = all.find(x => x.id === id)
          if (s) { S.server = s; updateStatus(root, s) }
          renderTopFromState()   // keep the fleet deck in sync
          setErr(s?.error || '')
        } catch (e) { setErr(e.message) }
      }

      // ── power controls ────────────────────────────────────────────────────
      async function runAction(act, btn) {
        if (act === 'refresh') {
          setErr(''); setBusy(true, 'Refreshing...'); if (btn) btn.classList.add('loading')
          try { await refresh(); logLine('Status refreshed') }
          catch (e) { setErr(e.message) }
          finally { if (btn) btn.classList.remove('loading'); setBusy(false) }
          return
        }
        if (act === 'update') {
          if (!confirm('Update the game client now?\n\nThis downloads the latest server build and can take several minutes. The server may be unavailable while it updates.')) return
          setErr(''); setBusy(true, 'Updating game client…'); logLine('Updating game client…'); if (btn) btn.classList.add('loading')
          try {
            const res = await dbUpdateServer(id)
            const body = res?.steps ? formatUpdate(res) : ''
            logLine(res?.ok === false ? 'Update finished with errors — see output' : 'Update ✓', body)
            if (res?.note) logLine(res.note)
            await refresh()
          } catch (e) { setErr(e.message); logLine(`Update — error: ${e.message}`) }
          finally { if (btn) btn.classList.remove('loading'); setBusy(false) }
          return
        }
        if (act === 'stop' && !confirm('Force Stop hard-kills the container immediately and can corrupt an in-progress save. Continue?')) return
        if (act === 'shutdown' && !confirm('Stop gracefully shuts the server down — active players will be disconnected. Continue?')) return
        const label = actionLabels[act] || 'Working'
        setErr(''); setBusy(true, `${label}...`); logLine(`${label}…`); if (btn) btn.classList.add('loading')
        try {
          await dbServerAction(id, act)
          await new Promise(r => setTimeout(r, 1500))
          await refresh()
          logLine(`${label} ✓`)
        } catch (e) {
          setErr(e.message); logLine(`${label} — error: ${e.message}`)
        } finally {
          if (btn) btn.classList.remove('loading'); setBusy(false)
        }
      }

      root.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => runAction(btn.dataset.act, btn))
      })

      // ── tabs ──────────────────────────────────────────────────────────────
      const tabBtns = () => [...root.querySelectorAll('[data-srvtab]')]
      const panelEl = (name) => root.querySelector(`[data-tabpanel="${name}"]`)
      const panelBody = (name) => panelEl(name)?.querySelector('[data-tab-body]')
