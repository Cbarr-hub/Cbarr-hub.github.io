<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FLEET//MAP — Gamertown NOC</title>
<style>
/* ============================================================
   FLEET//MAP — a network-operations-center for Gamertown.
   Hacker terminal, art-directed. No external assets.
   ============================================================ */

/* ---- design tokens ---------------------------------------- */
:root{
  /* grounds */
  --bg-0:#0a0a0a;        /* page void */
  --bg-1:#0e0f0d;        /* deck */
  --bg-2:#141613;        /* node */
  --bg-3:#1a1d18;        /* node raised */
  --bg-4:#23271f;        /* hover / input */
  /* lines */
  --line:#262a22;
  --line-2:#33392c;
  --line-hot:#3d5a2e;
  /* text */
  --ink:#d4d4b8;         /* cream */
  --ink-dim:#8a8c78;
  --ink-faint:#5b5d50;
  --ink-ghost:#3a3c34;
  /* status */
  --green:#7bb85f;
  --hot:#42F527;         /* hosting / live */
  --amber:#c2a13a;       /* idle / warn */
  --red:#ff7777;
  --red-deep:#b85f5f;
  --grey:#5b5d50;        /* down */
  /* the ONE refined accent — cool cyan signal, the "scope" color */
  --signal:#39d7c8;
  /* scale */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --r1:6px;--r2:10px;--r3:14px;
  --mono:"SFMono-Regular",ui-monospace,"DejaVu Sans Mono","Courier New",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-0);
  color:var(--ink);
  font-family:var(--mono);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
}
/* CRT scanline veil — whisper-quiet */
body::before{
  content:"";position:fixed;inset:0;z-index:9000;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px);
  mix-blend-mode:multiply;opacity:.5;
}
/* faint vignette + scope grid */
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(57,215,200,.05), transparent 60%),
    radial-gradient(140% 120% at 50% 120%, rgba(66,245,39,.04), transparent 55%),
    linear-gradient(0deg, rgba(123,184,95,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(123,184,95,.018) 1px, transparent 1px);
  background-size:auto,auto,34px 34px,34px 34px;
}

::selection{background:rgba(66,245,39,.28);color:#eaffe0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:none}
svg{display:block}
.mono-num{font-variant-numeric:tabular-nums;letter-spacing:-.3px}

/* ---- corner tag ------------------------------------------- */
.brandtag{
  position:fixed;right:10px;bottom:9px;z-index:9500;
  font-size:9.5px;letter-spacing:2.5px;color:var(--ink-ghost);
  text-transform:uppercase;pointer-events:none;user-select:none;
}
.brandtag b{color:var(--ink-faint);font-weight:400}

/* ---- shell ------------------------------------------------ */
.shell{max-width:1320px;margin:0 auto;padding:0 var(--s4) var(--s8);}

/* ============================================================
   TOP BAR — the NOC header strip
   ============================================================ */
.bar{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:var(--s4);
  padding:var(--s3) 0 var(--s3);
  background:linear-gradient(180deg,var(--bg-0) 65%,rgba(10,10,10,.0));
  backdrop-filter:blur(2px);
}
.bar-id{display:flex;align-items:center;gap:var(--s3);min-width:0}
.glyph{
  width:30px;height:30px;border:1px solid var(--line-hot);border-radius:8px;
  display:grid;place-items:center;color:var(--hot);flex:none;
  box-shadow:0 0 0 1px rgba(66,245,39,.06) inset,0 0 14px -6px var(--hot);
  position:relative;overflow:hidden;
}
.glyph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent,rgba(66,245,39,.10));animation:sweep 3.4s var(--ease) infinite}
@keyframes sweep{0%{transform:translateY(-100%)}55%,100%{transform:translateY(100%)}}
.wordmark{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.wordmark b{font-size:13px;letter-spacing:1px;color:var(--ink)}
.wordmark span{font-size:9px;letter-spacing:2.5px;color:var(--ink-faint);text-transform:uppercase}

/* fleet vitals — pure glyph+number, minimal labels */
.vitals{display:flex;align-items:center;gap:var(--s2);margin-left:auto;flex:none}
.vital{
  display:flex;align-items:center;gap:7px;
  padding:6px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--bg-1);white-space:nowrap;
}
.vital svg{opacity:.7}
.vital .n{font-size:12.5px;color:var(--ink)}
.vital .u{font-size:10px;color:var(--ink-faint)}
.dotpulse{width:7px;height:7px;border-radius:50%;background:var(--hot);
  box-shadow:0 0 8px var(--hot);animation:beat 2s infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}

/* status tally chips */
.tally{display:flex;gap:6px}
.tchip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg-1);font-size:12px}
.tchip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tchip.up i{background:var(--hot);box-shadow:0 0 7px var(--hot)}
.tchip.idle i{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.tchip.down i{background:var(--grey)}
.tchip .c{color:var(--ink);font-variant-numeric:tabular-nums}

/* ============================================================
   DECK — the living map of nodes
   ============================================================ */
.deck-head{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s5) 0 var(--s4)}
.deck-head h2{font-size:11px;letter-spacing:3px;color:var(--ink-faint);font-weight:400;text-transform:uppercase}
.deck-head .pulse-line{flex:1;height:1px;background:
  linear-gradient(90deg,var(--line) 0,transparent);position:relative;overflow:hidden}
.deck-head .pulse-line::after{content:"";position:absolute;top:0;left:0;width:60px;height:1px;
  background:linear-gradient(90deg,transparent,var(--signal),transparent);animation:scan 4.5s linear infinite}
@keyframes scan{from{transform:translateX(-60px)}to{transform:translateX(60vw)}}

.deck{
  display:grid;gap:var(--s4);
  grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
}

/* ---- a NODE ----------------------------------------------- */
.node{
  position:relative;border:1px solid var(--line);border-radius:var(--r3);
  background:
    radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.018), transparent 40%),
    var(--bg-2);
  padding:var(--s4);
  cursor:pointer;overflow:hidden;
  transition:border-color .15s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease);
  isolation:isolate;
}
.node:hover{transform:translateY(-2px);border-color:var(--line-2)}
.node:active{transform:translateY(0)}
.node:focus-visible{outline:none;border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
/* status edge — left glow bar drawn with ::before */
.node::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  transition:.2s var(--ease)}
.node.s-up::before{background:var(--hot);box-shadow:0 0 14px -1px var(--hot)}
.node.s-idle::before{background:var(--amber);box-shadow:0 0 14px -2px var(--amber)}
.node.s-down::before{background:var(--grey)}
.node.s-up{box-shadow:0 0 0 1px rgba(66,245,39,.07) inset}
.node.s-up:hover{border-color:var(--line-hot);box-shadow:0 10px 30px -18px rgba(66,245,39,.5),0 0 0 1px rgba(66,245,39,.1) inset}
.node.s-down{opacity:.82;background:repeating-linear-gradient(45deg,var(--bg-1) 0 9px,#101109 9px 18px)}
.node.s-down:hover{opacity:1}

.node-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s4)}
.node-ico{
  width:38px;height:38px;flex:none;border-radius:9px;border:1px solid var(--line-2);
  display:grid;place-items:center;background:var(--bg-3);color:var(--ink-dim);
}
.node.s-up .node-ico{color:var(--green);border-color:var(--line-hot)}
.node-name{min-width:0}
.node-name b{display:block;font-size:14.5px;color:var(--ink);letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.node-name span{font-size:10px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block;max-width:130px}

/* status pill — shape+color, minimal word */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid transparent;flex:none}
.pill i{width:6px;height:6px;border-radius:50%}
.pill.up{color:var(--hot);border-color:rgba(66,245,39,.3);background:rgba(66,245,39,.07)}
.pill.up i{background:var(--hot);box-shadow:0 0 7px var(--hot);animation:beat 2s infinite}
.pill.idle{color:var(--amber);border-color:rgba(194,161,58,.3);background:rgba(194,161,58,.07)}
.pill.idle i{background:var(--amber)}
.pill.down{color:var(--grey);border-color:var(--line-2);background:var(--bg-1)}
.pill.down i{background:var(--grey)}

/* telemetry — sparklines do the talking */
.telem{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s3)}
.spark{border:1px solid var(--line);border-radius:8px;padding:8px 9px 6px;background:var(--bg-1);position:relative}
.spark .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.spark .lab b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.spark .lab i{font-size:9px;color:var(--ink-faint);font-style:normal;letter-spacing:1px}
.spark svg{width:100%;height:24px;display:block}
.node.s-down .spark .lab b{color:var(--ink-ghost)}

/* node footer — players + join, glyph-led */
.node-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
  padding-top:var(--s3);border-top:1px solid var(--line)}
.players{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim)}
.players b{color:var(--ink);font-variant-numeric:tabular-nums}
.players .dots{display:inline-flex;gap:2px}
.players .dots i{width:4px;height:4px;border-radius:50%;background:var(--ink-ghost)}
.players .dots i.on{background:var(--hot);box-shadow:0 0 4px var(--hot)}
.portbadge{font-size:10px;color:var(--ink-faint);padding:3px 7px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg-1)}

/* down node — a designed empty state */
.downface{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s2);padding:var(--s5) 0 var(--s3);color:var(--ink-faint)}
.downface .big{font-size:11px;letter-spacing:2px;color:var(--grey)}
.downface .map{font-size:10px;color:var(--ink-ghost)}
.btn-revive{margin-top:var(--s2);display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border:1px solid var(--line-hot);border-radius:8px;color:var(--hot);
  background:rgba(66,245,39,.05);font-size:11px;letter-spacing:1px;transition:.15s}
.btn-revive:hover{background:rgba(66,245,39,.12);box-shadow:0 0 16px -6px var(--hot)}

/* ============================================================
   INSPECTOR — the focused detail panel (slide-over)
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:300;background:rgba(5,6,4,.6);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .18s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}

.inspector{
  position:fixed;top:0;right:0;bottom:0;z-index:400;width:min(560px,100%);
  background:linear-gradient(180deg,var(--bg-1),var(--bg-0));
  border-left:1px solid var(--line-2);
  transform:translateX(102%);transition:transform .26s var(--ease);
  display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.8);
}
.inspector.on{transform:translateX(0)}

.insp-head{position:relative;padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--line);
  overflow:hidden;flex:none}
.insp-head .crt{position:absolute;inset:0;z-index:0;opacity:.5;
  background:radial-gradient(120% 120% at 100% 0%, rgba(66,245,39,.07), transparent 55%)}
.insp-head .row{position:relative;z-index:1;display:flex;align-items:flex-start;gap:var(--s3)}
.insp-ico{width:50px;height:50px;flex:none;border-radius:11px;border:1px solid var(--line-hot);
  background:var(--bg-3);display:grid;place-items:center;color:var(--green)}
.insp-title{flex:1;min-width:0}
.insp-title h1{font-size:20px;letter-spacing:.3px;color:var(--ink);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-title .sub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.x{width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:8px;
  display:grid;place-items:center;color:var(--ink-dim);background:var(--bg-2);transition:.15s}
.x:hover{color:var(--red);border-color:var(--red-deep)}

/* live join + identity strip */
.identity{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.idchip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg-2);font-size:11px;color:var(--ink-dim)}
.idchip b{color:var(--ink)}
.idchip svg{opacity:.6}
.copy{display:inline-flex;align-items:center;gap:8px;padding:6px 11px 6px 11px;
  border:1px solid var(--line-hot);border-radius:8px;background:rgba(66,245,39,.05);
  color:var(--green);font-size:11px;transition:.15s;cursor:pointer;max-width:100%}
.copy:hover{background:rgba(66,245,39,.12)}
.copy .str{color:var(--ink);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy.ok{color:var(--hot);border-color:var(--hot)}

/* power rail */
.power{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:7px;margin-top:var(--s4)}
.pbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line-2);
  border-radius:8px;background:var(--bg-2);color:var(--ink-dim);font-size:11px;letter-spacing:.5px;
  transition:.13s var(--ease)}
.pbtn:hover{color:var(--ink);border-color:var(--line-hot);background:var(--bg-3);transform:translateY(-1px)}
.pbtn:active{transform:translateY(0)}
.pbtn.go{color:var(--hot);border-color:rgba(66,245,39,.35);background:rgba(66,245,39,.06)}
.pbtn.go:hover{background:rgba(66,245,39,.14);box-shadow:0 0 14px -6px var(--hot)}
.pbtn.danger{color:var(--red);border-color:rgba(184,95,95,.4)}
.pbtn.danger:hover{background:rgba(184,95,95,.14);border-color:var(--red)}
.pbtn svg{opacity:.85}

/* tabs — icon-forward, position carries meaning */
.tabs{display:flex;gap:2px;padding:var(--s2) var(--s5) 0;flex:none;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 13px;color:var(--ink-faint);font-size:11px;letter-spacing:1px;
  text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.13s}
.tab svg{opacity:.7}
.tab:hover{color:var(--ink-dim)}
.tab.on{color:var(--hot)}
.tab.on svg{opacity:1}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;
  background:var(--hot);border-radius:2px;box-shadow:0 0 8px var(--hot)}

.insp-body{flex:1;overflow-y:auto;padding:var(--s5);scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.insp-body::-webkit-scrollbar{width:8px}
.insp-body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.pane{display:none;animation:fade .18s var(--ease)}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* section label — tiny, used sparingly */
.slab{font-size:10px;letter-spacing:2.5px;color:var(--ink-faint);text-transform:uppercase;
  margin:var(--s5) 0 var(--s3);display:flex;align-items:center;gap:var(--s3)}
.slab:first-child{margin-top:0}
.slab::after{content:"";flex:1;height:1px;background:var(--line)}

/* quick action grid */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 8px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg-2);color:var(--ink-dim);
  font-size:10.5px;letter-spacing:.5px;transition:.13s var(--ease)}
.qbtn svg{opacity:.8}
.qbtn:hover{color:var(--ink);border-color:var(--line-hot);background:var(--bg-3);transform:translateY(-2px)}
.qbtn:active{transform:scale(.96)}

/* sliders */
.slider{margin-bottom:var(--s4)}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.slider .top label{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:8px}
.slider .top .val{font-size:13px;color:var(--hot);font-variant-numeric:tabular-nums;
  padding:2px 9px;border:1px solid var(--line-hot);border-radius:6px;background:rgba(66,245,39,.05)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;
  background:linear-gradient(90deg,var(--green),var(--line) 0);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--bg-0);border:2px solid var(--hot);box-shadow:0 0 10px -2px var(--hot);transition:.1s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--bg-0);
  border:2px solid var(--hot);box-shadow:0 0 10px -2px var(--hot)}

/* change map */
.maprow{display:flex;gap:8px}
.sel{flex:1;position:relative}
.sel select{width:100%;appearance:none;padding:11px 36px 11px 13px;background:var(--bg-2);
  border:1px solid var(--line-2);border-radius:9px;color:var(--ink);font-family:inherit;font-size:12px;cursor:pointer}
.sel select:focus{outline:none;border-color:var(--signal)}
.sel .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-faint)}
.btn-apply{padding:0 16px;border:1px solid var(--line-hot);border-radius:9px;color:var(--hot);
  background:rgba(66,245,39,.06);font-size:11px;letter-spacing:.5px;transition:.13s;white-space:nowrap}
.btn-apply:hover{background:rgba(66,245,39,.14);box-shadow:0 0 14px -6px var(--hot)}

/* console */
.console{border:1px solid var(--line-2);border-radius:11px;overflow:hidden;background:var(--bg-0)}
.console-out{height:230px;overflow-y:auto;padding:12px 13px;font-size:11.5px;line-height:1.7;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.console-out::-webkit-scrollbar{width:7px}
.console-out::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.cl{display:flex;gap:9px;white-space:pre-wrap;word-break:break-word}
.cl .t{color:var(--ink-ghost);flex:none}
.cl.sys .m{color:var(--ink-faint)}
.cl.in .m{color:var(--signal)}
.cl.in .t{color:var(--signal);opacity:.6}
.cl.out .m{color:var(--ink-dim)}
.cl.ok .m{color:var(--green)}
.cl.warn .m{color:var(--amber)}
.console-in{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);
  padding:10px 13px;background:var(--bg-1)}
.console-in .ps{color:var(--hot);font-weight:700}
.console-in input{flex:1;background:none;border:none;outline:none;color:var(--ink);
  font-family:inherit;font-size:12px}
.console-in input::placeholder{color:var(--ink-ghost)}
.caret-blink{width:8px;height:15px;background:var(--hot);animation:blink 1.1s steps(1) infinite;flex:none}
@keyframes blink{50%{opacity:0}}

/* profiles */
.profsel{display:flex;gap:8px;margin-bottom:var(--s4);flex-wrap:wrap}
.profchip{padding:8px 15px;border:1px solid var(--line-2);border-radius:99px;color:var(--ink-dim);
  font-size:11.5px;transition:.13s;display:flex;align-items:center;gap:8px}
.profchip:hover{border-color:var(--line-hot);color:var(--ink)}
.profchip.on{color:var(--bg-0);background:var(--green);border-color:var(--green);font-weight:600}
.profchip.add{color:var(--ink-faint);border-style:dashed}

.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:11px;color:var(--ink-faint);letter-spacing:.5px;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:9px;color:var(--ink);font-family:inherit;font-size:12.5px;padding:10px 12px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--signal)}
.fgroup{border:1px solid var(--line);border-radius:11px;padding:var(--s4);margin-bottom:var(--s3);background:var(--bg-1)}
.fgroup .gh{font-size:10px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;margin-bottom:var(--s3)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.toggle span{font-size:12px;color:var(--ink-dim)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--bg-3);border:1px solid var(--line-2);
  position:relative;cursor:pointer;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--ink-faint);transition:.15s var(--ease)}
.sw.on{background:rgba(66,245,39,.18);border-color:var(--line-hot)}
.sw.on::after{left:20px;background:var(--hot);box-shadow:0 0 8px var(--hot)}

.applybar{position:sticky;bottom:0;margin:var(--s5) calc(var(--s5)*-1) calc(var(--s5)*-1);
  padding:var(--s4) var(--s5);background:linear-gradient(0deg,var(--bg-0),rgba(10,10,10,.85));
  border-top:1px solid var(--line);display:flex;gap:var(--s3);align-items:center}
.applybar .note{font-size:10px;color:var(--ink-faint);flex:1}
.btn-primary{padding:11px 20px;border-radius:9px;border:1px solid var(--hot);
  background:var(--hot);color:#08240a;font-size:12px;font-weight:700;letter-spacing:.5px;transition:.13s}
.btn-primary:hover{box-shadow:0 0 20px -4px var(--hot);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}

/* maps list */
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg-2);transition:.13s}
.mrow:hover{border-color:var(--line-2);background:var(--bg-3)}
.mrow .ord{width:22px;height:22px;flex:none;border-radius:6px;border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:10px;color:var(--ink-faint)}
.mrow.boot .ord{color:var(--hot);border-color:var(--line-hot);background:rgba(66,245,39,.06)}
.mrow .mn{flex:1;font-size:12.5px;color:var(--ink)}
.mrow .tag{font-size:9px;letter-spacing:1px;color:var(--hot);padding:3px 7px;border:1px solid var(--line-hot);
  border-radius:5px;background:rgba(66,245,39,.05)}
.mrow .grip{color:var(--ink-ghost);cursor:grab}
.import{margin-top:var(--s3);display:flex;gap:8px}
.import input{flex:1;background:var(--bg-2);border:1px solid var(--line-2);border-radius:9px;
  color:var(--ink);font-family:inherit;font-size:12px;padding:10px 12px}
.import input:focus{outline:none;border-color:var(--signal)}

/* raw config editor */
.editor{border:1px solid var(--line-2);border-radius:11px;overflow:hidden}
.editor .ehead{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;
  background:var(--bg-1);border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1.5px;color:var(--ink-faint)}
.editor textarea{width:100%;min-height:280px;background:var(--bg-0);border:none;outline:none;resize:vertical;
  color:var(--ink);font-family:inherit;font-size:12px;line-height:1.7;padding:13px;white-space:pre}

/* ============================================================
   EVENTS — cross-server feed (lives below the deck)
   ============================================================ */
.events{margin-top:var(--s7)}
.ev-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.ev-head h2{font-size:11px;letter-spacing:3px;color:var(--ink-faint);font-weight:400;text-transform:uppercase}
.ev-filters{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.fchip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink-faint);
  font-size:11px;transition:.13s}
.fchip:hover{color:var(--ink-dim);border-color:var(--line-2)}
.fchip.on{color:var(--hot);border-color:var(--line-hot);background:rgba(66,245,39,.06)}

.feed{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--bg-1)}
.evrow{display:grid;grid-template-columns:30px 1fr auto auto;gap:var(--s3);align-items:center;
  padding:13px var(--s4);border-bottom:1px solid var(--line);transition:.12s}
.evrow:last-child{border-bottom:none}
.evrow:hover{background:var(--bg-2)}
.ev-av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;
  color:var(--bg-0);font-weight:700;flex:none}
.ev-who b{font-size:13px;color:var(--ink)}
.ev-who span{font-size:10.5px;color:var(--ink-faint);display:block;margin-top:1px}
.ev-who span em{font-style:normal;color:var(--ink-dim)}
.ev-dur{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.ev-state{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1px;
  text-transform:uppercase;padding:4px 9px;border-radius:99px;white-space:nowrap}
.ev-state.on{color:var(--hot);background:rgba(66,245,39,.07);border:1px solid rgba(66,245,39,.25)}
.ev-state.on i{width:5px;height:5px;border-radius:50%;background:var(--hot);box-shadow:0 0 6px var(--hot);animation:beat 2s infinite}
.ev-state.off{color:var(--ink-faint);background:var(--bg-2);border:1px solid var(--line)}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:9999;
  display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:10px;
  border:1px solid var(--line-hot);background:var(--bg-2);color:var(--ink);font-size:12px;
  opacity:0;pointer-events:none;transition:.2s var(--ease);box-shadow:0 14px 40px -16px rgba(0,0,0,.7)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--hot)}

/* confirm dialog */
.confirm{position:fixed;inset:0;z-index:600;display:grid;place-items:center;padding:var(--s4);
  background:rgba(5,6,4,.7);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.18s}
.confirm.on{opacity:1;pointer-events:auto}
.confirm .box{width:min(380px,100%);border:1px solid var(--red-deep);border-radius:14px;
  background:var(--bg-2);padding:var(--s5);transform:scale(.96);transition:.18s var(--ease)}
.confirm.on .box{transform:scale(1)}
.confirm .box .ic{width:44px;height:44px;border-radius:11px;border:1px solid var(--red-deep);
  display:grid;place-items:center;color:var(--red);margin-bottom:var(--s4);background:rgba(184,95,95,.08)}
.confirm .box h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.confirm .box p{font-size:12px;color:var(--ink-dim);line-height:1.6;margin-bottom:var(--s5)}
.confirm .box p b{color:var(--red)}
.confirm .acts{display:flex;gap:var(--s3)}
.confirm .acts button{flex:1;padding:11px;border-radius:9px;font-size:12px;letter-spacing:.5px}
.confirm .cancel{border:1px solid var(--line-2);color:var(--ink-dim);background:var(--bg-3)}
.confirm .cancel:hover{color:var(--ink)}
.confirm .kill{border:1px solid var(--red);color:#fff;background:var(--red-deep);font-weight:700}
.confirm .kill:hover{background:var(--red);box-shadow:0 0 18px -6px var(--red)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:720px){
  .shell{padding:0 var(--s3) var(--s8)}
  .bar{flex-wrap:wrap;gap:var(--s2);row-gap:var(--s3)}
  .vitals{margin-left:0;width:100%;order:3;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .vitals::-webkit-scrollbar{display:none}
  .tally{margin-left:auto}
  .deck{grid-template-columns:1fr;gap:var(--s3)}
  .inspector{width:100%}
  .insp-head,.insp-body{padding:var(--s4)}
  .tabs{padding-left:var(--s4);padding-right:var(--s4)}
  .applybar{margin:var(--s5) calc(var(--s4)*-1) calc(var(--s4)*-1);padding:var(--s4)}
  .evrow{grid-template-columns:28px 1fr auto;gap:var(--s2);padding:12px var(--s3)}
  .ev-dur{display:none}
  .brandtag{bottom:auto;top:6px;right:8px}
}
@media (min-width:721px) and (max-width:1000px){
  .deck{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.05ms!important}
}

/* ============================================================
   SPARKLINE — animated telemetry path
   ============================================================ */
let sparkSeeds = {};
function sparkPath(seed, base, jitter){
  // deterministic-ish wandering line, 16 points
  const N=16, pts=[];
  let v=base;
  for(let i=0;i<N;i++){
    const r = Math.sin((seed*1.7 + i*0.9))*0.5 + Math.sin(seed*3.1 + i*2.3)*0.3;
    v = Math.max(4, Math.min(96, base + r*jitter + (Math.random()-0.5)*jitter*0.4));
    pts.push(v);
  }
  const W=100,H=24;
  const step=W/(N-1);
  let d=`M0,${(H-(pts[0]/100*H)).toFixed(1)}`;
  for(let i=1;i<N;i++){
    const x=(i*step).toFixed(1), y=(H-(pts[i]/100*H)).toFixed(1);
    d+=` L${x},${y}`;
  }
  const area = d + ` L100,${H} L0,${H} Z`;
  return {line:d, area, last:pts[N-1]};
}

function sparkSVG(id, kind, base, color){
  const seed = (sparkSeeds[id+kind] ?? (sparkSeeds[id+kind]=Math.random()*10));
  const p = sparkPath(seed, base, 14);
  const gid = 'g_'+id+kind;
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${p.area}" fill="url(#${gid})"/>
    <path d="${p.line}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* ---- CONSOLE engine ---- */
const conBuffer = {};
function initConsole(s){
  if(!conBuffer[s.id]){
    conBuffer[s.id] = [
      {t:'sys', m:`gamertown ${s.id} console — connected via rcon`},
      {t:'sys', m:`status: ${STATUS_TXT[s.status]} · map ${s.map} · ${s.players}${s.cap?'/'+s.cap:''} players`},
      {t:'out', m:`type a command, or try "status"`},
    ];
  }
  paintConsole(s);
  const inp=document.getElementById('conIn');
  if(inp){
    inp.onkeydown=(e)=>{
      if(e.key==='Enter' && inp.value.trim()){
        const cmd=inp.value.trim(); inp.value='';
        pushConsole('in','> '+cmd);
        setTimeout(()=>respond(cmd),200);
      }
    };
  }
  // live heartbeat lines
  if(consoleTimer) clearInterval(consoleTimer);
  consoleTimer=setInterval(()=>{
    if(!current||currentTab!=='runtime') return;
    const ticks=['rcon: heartbeat ok','net: 0 packet loss','tick rate nominal',`mem ${current.ram} stable`];
    if(Math.random()>0.55) pushConsole('out', '· '+ticks[Math.floor(Math.random()*ticks.length)]);
  }, 4200);
}
function respond(cmd){
  const s=current; const c=cmd.toLowerCase();
  if(c==='status'){
    pushConsole('out',`hostname: gamertown_${s.id}`);
    pushConsole('out',`map     : ${s.map}`);
    pushConsole('ok',  `players : ${s.players}${s.cap?'/'+s.cap:''}`);
  } else if(c==='clear'){ conBuffer[s.id]=[]; paintConsole(s); }
  else if(c.startsWith('changelevel ')){ pushConsole('ok',`✓ loading ${cmd.split(' ')[1]}`); }
  else if(c==='help'){ pushConsole('out','commands: status · changelevel <map> · clear · say <msg>'); }
  else if(c.startsWith('say ')){ pushConsole('ok',`[server] ${cmd.slice(4)}`); }
  else { pushConsole('out',`unknown command: ${cmd.split(' ')[0]}`); }
}
function pushConsole(t,m){
  if(!current) return;
  const s=current;
  (conBuffer[s.id]=conBuffer[s.id]||[]).push({t,m,ts:nowTs()});
  if(conBuffer[s.id].length>60) conBuffer[s.id].shift();
  paintConsole(s);
}
function paintConsole(s){
  const out=document.getElementById('conOut');
  if(!out) return;
  out.innerHTML = (conBuffer[s.id]||[]).map(l=>`<div class="cl ${l.t}">${l.ts?`<span class="t">${l.ts}</span>`:''}<span class="m">${esc(l.m)}</span></div>`).join('');
  out.scrollTop=out.scrollHeight;
}
function nowTs(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }

    <div class="fgroup"><div class="gh">World gen</div>
      <div class="f2">
        <div class="field"><label>Map size</label><input value="${hard?'high':'normal'}"/></div>
        <div class="field"><label>Enemy bases</label><input value="${hard?'very-high':'normal'}"/></div>
      </div>
    </div>
    <div class="fgroup"><div class="gh">Rules</div>
      <div class="toggle"><span>Peaceful mode</span><div class="sw ${hard?'':'on'}" data-sw></div></div>
      <div class="toggle"><span>Friendly fire</span><div class="sw ${hard?'on':''}" data-sw></div></div>
      <div class="field" style="margin-top:8px"><label>Autosave interval (min)</label><input value="${hard?'10':'5'}"/></div>
    </div>`;
  }
  // gmod / ph
  return `
    <div class="fgroup"><div class="gh">Gameplay</div>
      <div class="f2">
        <div class="field"><label>Round limit</label><input value="${hard?'12':'6'}"/></div>
        <div class="field"><label>Time limit (min)</label><input value="${hard?'45':'30'}"/></div>
      </div>
      <div class="field"><label>Max players</label><input value="${s.cap||16}"/></div>
    </div>
    <div class="fgroup"><div class="gh">Rules</div>
      <div class="toggle"><span>Map cycle</span><div class="sw on" data-sw></div></div>
      <div class="toggle"><span>Friendly fire</span><div class="sw ${hard?'on':''}" data-sw></div></div>
      <div class="toggle"><span>Voice chat</span><div class="sw on" data-sw></div></div>
    </div>
    <div class="fgroup"><div class="gh">Workshop</div>
      <div class="field"><label>Collection ID</label><input value="${s.id==='ph'?'3737190377':'3736674438'}"/></div>
    </div>`;
}
function wireProfiles(s){
  document.querySelectorAll('[data-prof]').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.prof==='__add'){ toast('New profile (stub)'); return; }
      currentProfile[s.id]=b.dataset.prof; renderPane(); toast('Loaded "'+b.dataset.prof+'"');
    };
  });
  document.querySelectorAll('[data-sw]').forEach(sw=>{ sw.onclick=()=>sw.classList.toggle('on'); });
  const ap=document.getElementById('applyProf');
  if(ap) ap.onclick=()=>{
    if(s.id==='cs'){ toast('Applied live to CS2'); }
    else { toast('Applying "'+currentProfile[s.id]+'" — restarting…'); }
  };
}

/* ---- MAPS pane ---- */
function paneMaps(s){
  const rows = s.maps.map((m,i)=>`
    <div class="mrow ${i===0?'boot':''}">
      <span class="grip">${I.grip}</span>
      <span class="ord">${i+1}</span>
      <span class="mn">${m}</span>
      ${i===0?'<span class="tag">BOOT</span>':''}
    </div>`).join('');
  return `
    <div class="slab">Rotation</div>
    <div class="mlist">${rows}</div>
    <div class="slab">Workshop</div>
    <div class="import">
      <input id="wsId" placeholder="paste collection ID or URL…"/>
      <button class="btn-apply" id="wsGo">Import</button>
    </div>
    <div style="font-size:10px;color:var(--ink-faint);margin-top:10px;line-height:1.6">First map in rotation is the boot map. Importing downloads + mounts the collection on next restart.</div>`;
}
function wireMaps(s){
  const go=document.getElementById('wsGo');
  if(go) go.onclick=()=>{ const v=document.getElementById('wsId').value.trim(); toast(v?'Importing collection…':'Paste a collection ID'); };
}

/* ---- RAW pane ---- */
function paneRaw(s){
  const cfg = rawConfig(s);
  return `
    <div class="slab">Raw Config</div>
    <div class="editor">
      <div class="ehead"><span>${cfgFile(s)}</span><span style="color:var(--green)">● editable</span></div>
      <textarea spellcheck="false" id="rawArea">${esc(cfg)}</textarea>
    </div>
    <div class="applybar">
      <span class="note">Saved to disk; takes effect on next boot.</span>
      <button class="btn-primary" id="rawSave">Save Config</button>
    </div>`;
}
function cfgFile(s){
  if(s.id==='mc') return 'server.properties';
  if(s.id==='fac') return 'server-settings.json';
  if(s.id==='cs') return 'cfg/server.cfg';
  return 'garrysmod/cfg/gmodserver.cfg';
}
function rawConfig(s){
  if(s.id==='mc') return `# Minecraft server.properties\nlevel-name=world_GTown\ngamemode=survival\ndifficulty=normal\nmax-players=20\nview-distance=12\npvp=true\nspawn-protection=0\nmotd=\\u00A7aGamertown SMP`;
  if(s.id==='fac') return `{\n  "name": "Gamertown Factory",\n  "description": "the friend-group base",\n  "max_players": 0,\n  "visibility": { "public": false, "lan": true },\n  "autosave_interval": 5,\n  "afk_autokick_interval": 0\n}`;
  if(s.id==='cs') return `// cfg/server.cfg\nhostname "Gamertown CS2"\nsv_cheats 0\nmp_maxrounds 16\nmp_friendlyfire 0\nsv_allow_votes 1\nbot_quota 0\nrcon_password "********"`;
  return `// gmodserver.cfg\nhostname "Gamertown ${s.name}"\nsv_password ""\nrcon_password "********"\nsbox_maxprops 200\nttt_round_limit 6\nttt_time_limit_minutes 30\nttt_always_use_mapcycle 1\nhost_workshop_collection ${s.id==='ph'?'3737190377':'3736674438'}`;
}
function wireRaw(s){
  const sv=document.getElementById('rawSave');
  if(sv) sv.onclick=()=>toast('Config saved');
}

/* ============================================================
   POWER + CONFIRM
   ============================================================ */
function power(action){
  const s=current;
  if(action==='force'){
    showConfirm('Force Stop?', `<b>${s.name}</b> will be killed immediately — active players (${s.players||0}) will be dropped and unsaved state lost.`, ()=>{
      toast('Force-stopping '+s.name);
    });
    return;
  }
  const map={start:'Starting',restart:'Restarting',stop:'Stopping',update:'Updating',refresh:'Refreshing'};
  toast((map[action]||action)+' '+s.name);
  if(currentTab==='runtime' && s.status!=='down'){
    pushConsole('warn', `· ${action} requested by admin`);
  }
}

function showConfirm(title,msg,onYes){
  document.getElementById('cfTitle').textContent=title;
  document.getElementById('cfMsg').innerHTML=msg;
  const cf=document.getElementById('confirm');
  cf.classList.add('on');
  const kill=document.getElementById('cfKill');
  const cancel=document.getElementById('cfCancel');
  const close=()=>{ cf.classList.remove('on'); kill.onclick=null; cancel.onclick=null; };
  kill.onclick=()=>{ close(); onYes&&onYes(); };
  cancel.onclick=close;
}

/* ============================================================
   COPY + TOAST
   ============================================================ */
function copyJoin(str){
  const done=()=>{
    toast('Join string copied');
    const c=document.getElementById('copyJoin');
    if(c){ c.classList.add('ok'); setTimeout(()=>c.classList.remove('ok'),1100); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(done).catch(()=>fallbackCopy(str,done));
  } else fallbackCopy(str,done);
}
function fallbackCopy(str,cb){
  const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); cb&&cb();
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'),1900);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   WIRING
   ============================================================ */
function init(){
  renderDeck();
  renderFilters();
  renderFeed();

  // deck clicks
  document.getElementById('deck').addEventListener('click', e=>{
    const revive=e.target.closest('[data-revive]');
    if(revive){ e.stopPropagation(); toast('Bringing up '+srvById(revive.dataset.revive).name); return; }
    const node=e.target.closest('.node');
    if(node) openInspector(node.dataset.id);
  });
  document.getElementById('deck').addEventListener('keydown', e=>{
    const node=e.target.closest('.node');
    if(node && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openInspector(node.dataset.id); }
  });

  // inspector start-from-runtime-downstate
  document.getElementById('iBody').addEventListener('click', e=>{
    const b=e.target.closest('[data-pw2]'); if(b) power(b.dataset.pw2);
  });

  // close
  document.getElementById('iClose').onclick=closeInspector;
  document.getElementById('scrim').onclick=closeInspector;
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(document.getElementById('confirm').classList.contains('on')){ document.getElementById('confirm').classList.remove('on'); } else closeInspector(); } });

  // filters
  document.getElementById('evFilters').addEventListener('click', e=>{
    const c=e.target.closest('[data-f]'); if(!c) return;
    evFilter=c.dataset.f; renderFilters(); renderFeed();
  });

  // live deck telemetry — re-roll sparklines + nudge numbers
  setInterval(()=>{
    SERVERS.forEach(s=>{ if(s.status==='down') return;
      // jitter cpu slightly
      s.cpu = Math.max(1, Math.min(98, s.cpu + Math.round((Math.random()-0.5)*4)));
      // re-seed spark for motion
      sparkSeeds[s.id+'cpu'] = (sparkSeeds[s.id+'cpu']||0)+0.6;
      sparkSeeds[s.id+'ram'] = (sparkSeeds[s.id+'ram']||0)+0.4;
      const node=document.querySelector(`.node[data-id="${s.id}"]`);
      if(node && !document.getElementById('inspector').classList.contains('on')){
        const cpuB=node.querySelector('.spark:first-child .lab b');
        if(cpuB) cpuB.textContent=s.cpu+'%';
        const cpuSvg=node.querySelector('.spark:first-child svg');
        const ramSvg=node.querySelector('.spark:last-child svg');
        const cpuColor=s.status==='up'?'var(--hot)':'var(--amber)';
        const ramColor=s.ramPct>80?'var(--amber)':(s.status==='up'?'var(--green)':'var(--ink-faint)');
        if(cpuSvg) cpuSvg.outerHTML=sparkSVG(s.id,'cpu',s.cpu*3.5+8,cpuColor);
        if(ramSvg) ramSvg.outerHTML=sparkSVG(s.id,'ram',s.ramPct,ramColor);
      }
    });
  }, 2600);
}
document.addEventListener('DOMContentLoaded', init);
</script>
