# gt-modes.conf — single source of truth shared by tools/gt.ps1 and tools/gt.sh.
#
# Format: KEY = space-separated values. This file is PARSED (never sourced/executed)
# by both dispatchers, so it needs no jq/node and introduces no new runtime. Keep it
# in sync by editing HERE, not in either dispatcher.
#
# Compose-file ORDER matters: the dev override (docker-compose.dev.yml) MUST stay
# LAST so its service overrides (localhost TLS, nodemon, LAN_INSECURE) win.
#
# env_chain applies to DEV modes only. PROD does NOT pass --env-file: on the keeper,
# compose auto-reads /root/gamertown/.env for ${...} interpolation and loads
# /etc/gamertown/secrets.env via the env_file default (see docs/disaster-recovery.md).

project.dev    = cbarr-hubgithubio
project.keeper = gamertown

# dev --env-file chain (repo-root-relative). Interpolation precedence is left->right
# (the LAST --env-file wins), so .env.local can override the bundle for local rehearsals.
env_chain      = .secrets/etc/gamertown/secrets.env .secrets/root/gamertown/.env .env.local
env_chain.app  = .env.local

# compose -f file sets per mode (repo-root-relative; dev override LAST)
compose.dev-fresh        = docker-compose.yml servers.compose.yml docker-compose.dev.yml
compose.dev-prodlike     = docker-compose.yml servers.compose.yml
compose.dev-prodlike-app = docker-compose.yml
compose.prod             = docker-compose.yml servers.compose.yml
