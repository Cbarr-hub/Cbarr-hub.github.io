# The Minecraft overworld. The active world folder (mc-data/<MC_LEVEL>) is mounted
# directly at /app/world via the compose volume subpath, so this path is the same
# in every environment regardless of the level name.
world: "/app/world"
dimension: "minecraft:overworld"
name: "Overworld"

# Keep the full BlueMap 3D experience enabled. Performance tuning lives in
# webapp.conf slider defaults and core.conf render scheduling, not by disabling 3D.
enable-perspective-view: true
enable-free-flight-view: true
enable-flat-view: true
enable-hires: true
