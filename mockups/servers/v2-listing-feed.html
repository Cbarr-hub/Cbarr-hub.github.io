<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cyberbarn · Fleet</title>
<style>
/* ============================================================
   v2 · LISTING FEED  —  "a hacker terminal art-directed by Airbnb"
   ============================================================ */
:root{
  /* grounds */
  --bg:#0a0a0a; --bg-1:#111; --bg-2:#161616; --bg-3:#1d1d1d; --bg-4:#242424;
  /* lines */
  --line:#2a2a2a; --line-2:#333; --line-soft:#222;
  /* text */
  --txt:#d4d4b8; --txt-dim:#8c8c7a; --txt-faint:#5a5a50;
  /* brand greens */
  --grn:#7bb85f; --grn-hot:#42F527; --grn-deep:#214d18;
  /* states */
  --amber:#c2a13a; --red:#b85f5f; --red-hot:#ff7777; --grey:#5a5a55;
  /* the ONE refined accent — a cool cyan for selection/links/focus */
  --acc:#5fd0d0; --acc-deep:#143a3a;
  /* type scale (1.25) */
  --t-xs:11px; --t-sm:12px; --t-md:13px; --t-lg:16px; --t-xl:21px; --t-2xl:28px; --t-3xl:38px;
  /* spacing (8pt-ish) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r:14px; --r-sm:9px; --r-lg:20px;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow:0 12px 40px -12px rgba(0,0,0,.8), 0 2px 8px -2px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--mono);
  font-size:var(--t-md); line-height:1.5; letter-spacing:.2px;
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* CRT scanline veil — barely there */
body::before{
  content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 3px);
  opacity:.35; mix-blend-mode:multiply;
}
/* subtle vignette */
body::after{
  content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 90% at 50% -10%,transparent 55%,rgba(0,0,0,.55) 100%);
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,textarea{font-family:inherit;color:inherit;font-size:inherit}
::selection{background:var(--grn-deep);color:#eafee2}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* corner identity tag */
.brand-tag{
  position:fixed; right:10px; bottom:9px; z-index:60;
  font-size:9px; letter-spacing:2px; color:var(--txt-faint);
  text-transform:uppercase; pointer-events:none; user-select:none;
}
.brand-tag b{color:var(--grn);font-weight:400}

/* ============ APP SHELL ============ */
.shell{position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:0 var(--s5) var(--s8)}
@media(max-width:600px){.shell{padding:0 var(--s4) var(--s7)}}

/* ---- top bar ---- */
header.top{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:var(--s4);
  padding:var(--s4) 0 var(--s3);
  background:linear-gradient(var(--bg) 62%,transparent);
  backdrop-filter:blur(2px);
}
.logo{display:flex; align-items:center; gap:var(--s2); flex:0 0 auto}
.logo .mark{color:var(--grn-hot);filter:drop-shadow(0 0 7px rgba(66,245,39,.55));animation:pulse 2.6s var(--ease) infinite;flex:0 0 auto}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.logo b{font-size:var(--t-lg);letter-spacing:1px;color:var(--txt)}
.logo b span{color:var(--grn)}
.logo .cur{color:var(--grn-hot);animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}

.top .spacer{flex:1}
.who{
  display:flex;align-items:center;gap:var(--s2);
  font-size:var(--t-xs);color:var(--txt-dim);
  padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg-1);
}
.who .av{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--grn-deep),var(--grn));display:grid;place-items:center;color:#06140a;font-size:10px;font-weight:700}

/* ---- hero / host strip ---- */
.host{
  border:1px solid var(--line); border-radius:var(--r);
  background:
    radial-gradient(120% 160% at 0% 0%,rgba(66,245,39,.05),transparent 45%),
    var(--bg-1);
  padding:var(--s5); margin-bottom:var(--s5);
  position:relative; overflow:hidden;
}
.host::after{ /* faint ascii texture */
  content:"01001 11010 00111 10100 01100 11001 00010 10110";
  position:absolute; inset:auto -20px -14px auto; font-size:34px; color:#fff;
  opacity:.012; white-space:nowrap; letter-spacing:6px; pointer-events:none;
}
.host-top{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s5)}
.host-top h1{font-size:var(--t-sm);letter-spacing:3px;text-transform:uppercase;color:var(--txt-dim);font-weight:400}
.host-top .up{margin-left:auto;font-size:var(--t-xs);color:var(--txt-dim)}
.host-top .up b{color:var(--grn)}

.host-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5)}
@media(max-width:600px){.host-grid{grid-template-columns:1fr;gap:var(--s4)}}
.metric .mh{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2)}
.metric .mv{font-size:var(--t-2xl);line-height:1;color:var(--txt);letter-spacing:-.5px}
.metric .mv small{font-size:var(--t-md);color:var(--txt-faint);letter-spacing:0}
.metric .ml{font-size:var(--t-xs);letter-spacing:2px;text-transform:uppercase;color:var(--txt-faint)}
/* tiny meters */
.bar{height:6px;border-radius:6px;background:var(--bg-3);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--grn-deep),var(--grn));transition:width .6s var(--ease)}
.bar.warn i{background:linear-gradient(90deg,#5c4a14,var(--amber))}
/* status tally */
.tally{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-sm);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2)}
.pill .d{width:8px;height:8px;border-radius:50%}
.d.hosting{background:var(--grn-hot);box-shadow:0 0 8px var(--grn-hot)}
.d.idle{background:var(--amber);box-shadow:0 0 7px rgba(194,161,58,.6)}
.d.down{background:var(--grey)}
.d.busy{background:var(--acc);box-shadow:0 0 8px var(--acc)}

/* ---- feed toolbar (tabs + filter) ---- */
.toolbar{display:flex;align-items:center;gap:var(--s3);margin:var(--s6) 0 var(--s4)}
.tabs{display:flex;gap:var(--s1);background:var(--bg-1);border:1px solid var(--line);border-radius:99px;padding:4px}
.tabs button{font-size:var(--t-sm);letter-spacing:1px;padding:8px 18px;border-radius:99px;color:var(--txt-dim);transition:.18s var(--ease)}
.tabs button.on{background:var(--bg-3);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line-2)}
.tabs button:hover:not(.on){color:var(--txt)}
.toolbar .spacer{flex:1}
.tcount{font-size:var(--t-xs);color:var(--txt-faint);letter-spacing:1px}

/* ============ FEED (cards) ============ */
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:var(--s5)}
@media(max-width:680px){.feed{grid-template-columns:1fr;gap:var(--s4)}}

.card{
  position:relative; border:1px solid var(--line); border-radius:var(--r);
  background:var(--bg-1); overflow:hidden; cursor:pointer;
  transition:transform .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow)}
.card:active{transform:translateY(-1px)}
.card.down{opacity:.92}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* generated art header per game (gradient + monogram + game key-art) */
.art{position:relative;height:128px;overflow:hidden;border-bottom:1px solid var(--line)}
.art .glow{position:absolute;inset:0}
.art svg.deco{position:absolute;inset:0;width:100%;height:100%}
.mono{
  position:absolute;left:16px;top:14px;width:48px;height:48px;border-radius:12px;
  display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:-1px;
  background:rgba(10,10,10,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);
  color:#fff;
}
.art .stat{
  position:absolute;right:14px;top:14px;display:inline-flex;align-items:center;gap:7px;
  font-size:var(--t-xs);letter-spacing:1.5px;text-transform:uppercase;
  padding:6px 11px;border-radius:99px;background:rgba(10,10,10,.55);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
}
.art .port{position:absolute;left:16px;bottom:12px;font-size:var(--t-xs);color:rgba(255,255,255,.62);letter-spacing:1px}

.card .body{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);flex:1}
.card .name{display:flex;align-items:baseline;gap:8px}
.card .name b{font-size:var(--t-lg);color:var(--txt);letter-spacing:.3px}
.card .img{font-size:var(--t-xs);color:var(--txt-faint);letter-spacing:.5px}

/* compact stat row — icons + numbers, minimal words */
.statrow{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.kv{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--txt-dim)}
.kv svg{width:14px;height:14px;opacity:.7}
.kv b{color:var(--txt)}
.kv.on b{color:var(--grn)}

/* mini cpu/ram dual meter */
.dualbar{display:flex;gap:6px;align-items:center}
.dualbar .seg{flex:1;height:5px;border-radius:5px;background:var(--bg-3);overflow:hidden}
.dualbar .seg i{display:block;height:100%;border-radius:5px;transition:width .6s var(--ease)}
.seg i.cpu{background:var(--acc)} .seg i.ram{background:var(--grn)}

/* card footer: join string + chevron */
.card .foot{display:flex;align-items:center;gap:var(--s2);margin-top:auto;padding-top:var(--s3);border-top:1px solid var(--line-soft)}
.join{
  flex:1;display:flex;align-items:center;gap:8px;min-width:0;
  font-size:var(--t-xs);color:var(--txt-dim);
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 10px;transition:.18s var(--ease);
}
.join code{color:var(--grn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.join:hover{border-color:var(--grn);color:var(--txt)}
.join .cp{flex:0 0 auto;display:grid;place-items:center;color:var(--txt-faint)}
.join.copied{border-color:var(--grn-hot)}
.join.copied code{color:var(--grn-hot)}
.go{flex:0 0 auto;width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;border:1px solid var(--line);background:var(--bg-2);color:var(--txt-dim);transition:.18s var(--ease)}
.card:hover .go{color:var(--grn);border-color:var(--grn)}

/* DOWN card state — identical footprint to the others, just greyed art + dimmed metrics */
.card.down .art{filter:grayscale(.7) brightness(.62)}
.card.down .statrow,.card.down .dualbar{opacity:.45}

/* ============ EVENTS FEED ============ */
.events{display:none;flex-direction:column;gap:var(--s2)}
.events.show{display:flex}
.evfilter{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:var(--s2);margin-bottom:var(--s2);scrollbar-width:none}
.evfilter::-webkit-scrollbar{display:none}
.evfilter button{flex:0 0 auto;font-size:var(--t-xs);letter-spacing:.5px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg-1);color:var(--txt-dim);transition:.16s var(--ease)}
.evfilter button.on{border-color:var(--grn);color:var(--grn);background:rgba(123,184,95,.07)}
.ev{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--bg-1);
  transition:.16s var(--ease);
}
.ev:hover{border-color:var(--line-2);background:var(--bg-2)}
.ev .pav{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:var(--t-lg);color:#06140a}
.ev .pmeta{flex:1;min-width:0}
.ev .pmeta b{color:var(--txt);font-size:var(--t-md)}
.ev .pmeta .sub{font-size:var(--t-xs);color:var(--txt-dim);display:flex;align-items:center;gap:7px;margin-top:2px}
.ev .gtag{font-size:10px;letter-spacing:.5px;padding:2px 7px;border-radius:5px;background:var(--bg-3);color:var(--txt-dim)}
.ev .right{text-align:right;flex:0 0 auto}
.ev .dur{font-size:var(--t-md);color:var(--txt)}
.ev .live{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--grn);letter-spacing:1px}
.ev .live .d{width:7px;height:7px;border-radius:50%;background:var(--grn-hot);box-shadow:0 0 7px var(--grn-hot)}
.ev .gone{font-size:var(--t-xs);color:var(--txt-faint);letter-spacing:.5px}

/* ============ DETAIL (immersive sheet) ============ */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.detail{
  position:fixed;z-index:51;inset:0;left:auto;width:min(560px,100%);
  background:var(--bg);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .34s var(--ease);
  display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.9);
}
.detail.open{transform:translateX(0)}
@media(max-width:600px){
  .detail{width:100%;border-left:none;border-top:1px solid var(--line);top:0;border-radius:0}
}

/* detail hero (full-bleed art) */
.dhero{position:relative;height:188px;flex:0 0 auto;overflow:hidden;border-bottom:1px solid var(--line)}
.dhero svg.deco{position:absolute;inset:0;width:100%;height:100%}
.dhero .glow{position:absolute;inset:0}
.dclose{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,10,.6);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);color:#fff;transition:.16s var(--ease)}
.dclose:hover{background:rgba(10,10,10,.85);transform:rotate(90deg)}
.dhero .dmono{position:absolute;left:20px;bottom:18px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:26px;font-weight:700;background:rgba(10,10,10,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);color:#fff}
.dhero .dtitle{position:absolute;left:90px;bottom:20px}
.dhero .dtitle b{display:block;font-size:var(--t-xl);color:#fff;letter-spacing:.3px}
.dhero .dtitle span{font-size:var(--t-xs);color:rgba(255,255,255,.6);letter-spacing:.5px}
.dhero .dstat{position:absolute;left:20px;top:18px;display:inline-flex;align-items:center;gap:8px;font-size:var(--t-xs);letter-spacing:1.5px;text-transform:uppercase;padding:7px 13px;border-radius:99px;background:rgba(10,10,10,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}

/* detail tabs */
.dtabs{display:flex;gap:0;padding:0 var(--s4);border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:0 0 auto;position:relative;padding:14px 14px;font-size:var(--t-sm);letter-spacing:1px;color:var(--txt-dim);transition:.16s var(--ease)}
.dtabs button.on{color:var(--txt)}
.dtabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--grn);border-radius:2px}
.dtabs button:hover:not(.on){color:var(--txt)}

.dbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--s5) var(--s4) var(--s7);-webkit-overflow-scrolling:touch}
.pane{display:none;flex-direction:column;gap:var(--s5)}
.pane.on{display:flex;animation:fade .24s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section-h{font-size:var(--t-xs);letter-spacing:2px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:var(--s3)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}
.tile{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-1);padding:var(--s3) var(--s4)}
.tile .tl{font-size:var(--t-xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.tile .tl svg{width:12px;height:12px;opacity:.7}
.tile .tv{font-size:var(--t-xl);color:var(--txt);line-height:1;letter-spacing:-.5px}
.tile .tv small{font-size:var(--t-sm);color:var(--txt-faint)}
.tile .tbar{height:5px;border-radius:5px;background:var(--bg-3);margin-top:10px;overflow:hidden}
.tile .tbar i{display:block;height:100%;border-radius:5px;transition:width .6s var(--ease)}

/* join row big */
.joinbig{display:flex;align-items:center;gap:var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-1);padding:var(--s2) var(--s2) var(--s2) var(--s4)}
.joinbig code{flex:1;color:var(--grn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-md)}
.joinbig button{padding:9px 14px;border-radius:8px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt);letter-spacing:1px;font-size:var(--t-xs);transition:.16s var(--ease)}
.joinbig button:hover{border-color:var(--grn);color:var(--grn)}
.joinbig.copied button{background:var(--grn-deep);border-color:var(--grn-hot);color:var(--grn-hot)}

/* power controls */
.power{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-1);color:var(--txt-dim);transition:.16s var(--ease);font-size:var(--t-xs);letter-spacing:.5px}
.pbtn svg{width:19px;height:19px}
.pbtn:hover{border-color:var(--line-2);color:var(--txt);background:var(--bg-2);transform:translateY(-1px)}
.pbtn.primary{border-color:var(--grn);color:var(--grn);background:rgba(123,184,95,.06)}
.pbtn.primary:hover{background:rgba(66,245,39,.12);box-shadow:0 0 0 1px var(--grn) inset}
.pbtn.danger:hover{border-color:var(--red);color:var(--red-hot);background:rgba(184,95,95,.08)}

/* runtime quick actions */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg-1);color:var(--txt-dim);transition:.16s var(--ease);font-size:var(--t-sm)}
.chip:hover{border-color:var(--grn);color:var(--grn);background:rgba(123,184,95,.06)}
.chip:active{transform:scale(.96)}
.chip.t{position:relative}
.chip.t.on{border-color:var(--grn-hot);color:var(--grn-hot);background:rgba(66,245,39,.08)}

/* sliders */
.slider{margin-bottom:var(--s4)}
.slider .sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.slider .sh span{font-size:var(--t-sm);color:var(--txt-dim);letter-spacing:.5px}
.slider .sh b{font-size:var(--t-md);color:var(--grn);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--bg-3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--grn);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--grn),0 0 12px rgba(123,184,95,.5);cursor:pointer;transition:.12s}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15);background:var(--grn-hot)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--grn);border:3px solid var(--bg);cursor:pointer}

/* change map */
.mapline{display:flex;gap:var(--s2)}
.sel{flex:1;position:relative}
.sel select{width:100%;appearance:none;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--txt);padding:11px 38px 11px 14px;letter-spacing:.5px}
.sel::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--txt-faint);pointer-events:none}
.btn-go{padding:0 18px;border-radius:var(--r-sm);background:var(--grn-deep);border:1px solid var(--grn);color:var(--grn-hot);letter-spacing:1px;font-size:var(--t-xs);transition:.16s var(--ease)}
.btn-go:hover{background:var(--grn);color:#06140a}

/* console */
.console{border:1px solid var(--line);border-radius:var(--r-sm);background:#070707;overflow:hidden}
.console .cbar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg-1)}
.console .cbar .dt{width:9px;height:9px;border-radius:50%}
.dt.r{background:#3a2222} .dt.y{background:#3a3422} .dt.g{background:var(--grn-deep)}
.console .cbar span{margin-left:6px;font-size:var(--t-xs);color:var(--txt-faint);letter-spacing:1px}
.cout{height:190px;overflow-y:auto;padding:12px;font-size:var(--t-sm);line-height:1.65}
.cout .ln{white-space:pre-wrap;word-break:break-word}
.cout .ln .ts{color:var(--txt-faint)}
.cout .ln .ok{color:var(--grn)}
.cout .ln .sys{color:var(--acc)}
.cout .ln .err{color:var(--red-hot)}
.cin{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#050505}
.cin .pr{color:var(--grn);flex:0 0 auto}
.cin input{flex:1;background:none;border:none;outline:none;color:var(--txt);caret-color:var(--grn-hot)}
.cin input::placeholder{color:var(--txt-faint)}

/* profiles */
.profsel{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.profsel button{flex:1;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-1);color:var(--txt-dim);letter-spacing:.5px;transition:.16s var(--ease);text-align:left}
.profsel button.on{border-color:var(--grn);color:var(--txt);background:rgba(123,184,95,.06)}
.profsel button small{display:block;font-size:10px;color:var(--txt-faint);letter-spacing:1px;margin-top:3px;text-transform:uppercase}
.fgroup{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s4);margin-bottom:var(--s3);background:var(--bg-1)}
.fgroup .gh{font-size:var(--t-xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:var(--s3)}
.field{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:9px 0;border-bottom:1px solid var(--line-soft)}
.field:last-child{border-bottom:none}
.field label{font-size:var(--t-sm);color:var(--txt-dim)}
.field input[type=text],.field input[type=number]{width:120px;text-align:right;background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--txt)}
.field input:focus{border-color:var(--acc);outline:none}
/* toggle */
.tog{width:42px;height:24px;border-radius:99px;background:var(--bg-3);border:1px solid var(--line);position:relative;transition:.18s var(--ease);flex:0 0 auto}
.tog i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--txt-faint);transition:.18s var(--ease)}
.tog.on{background:var(--grn-deep);border-color:var(--grn)}
.tog.on i{left:20px;background:var(--grn-hot)}

/* maps */
.maprow{display:flex;align-items:center;gap:var(--s3);padding:11px var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-1);margin-bottom:var(--s2);transition:.16s var(--ease)}
.maprow:hover{border-color:var(--line-2)}
.maprow .idx{font-size:var(--t-xs);color:var(--txt-faint);width:20px}
.maprow .mn{flex:1;color:var(--txt)}
.maprow .cur{font-size:10px;letter-spacing:1px;color:var(--grn-hot);padding:2px 8px;border:1px solid var(--grn);border-radius:5px;background:rgba(66,245,39,.07)}
.maprow .grip{color:var(--txt-faint);cursor:grab}
.import{display:flex;gap:var(--s2);margin-top:var(--s3)}
.import input{flex:1;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;color:var(--txt)}
.import input:focus{border-color:var(--acc);outline:none}

/* raw editor */
.raw{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:#070707}
.raw .rbar{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg-1);font-size:var(--t-xs);color:var(--txt-faint);letter-spacing:1px}
.raw .rbar .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.raw textarea{width:100%;min-height:230px;background:none;border:none;outline:none;resize:vertical;padding:14px;color:var(--txt);font-size:var(--t-sm);line-height:1.7;tab-size:2}
.raw textarea .grn{color:var(--grn)}

/* sticky apply bar in detail */
.applybar{position:sticky;bottom:0;margin:var(--s5) calc(-1*var(--s4)) calc(-1*var(--s7));padding:var(--s4);background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:var(--s2)}
.btn-primary{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:var(--r-sm);background:var(--grn);color:#06140a;font-weight:700;letter-spacing:1px;font-size:var(--t-sm);transition:.16s var(--ease)}
.btn-primary:hover{background:var(--grn-hot);box-shadow:0 0 24px -4px var(--grn-hot)}
.btn-primary svg{width:16px;height:16px}
.btn-ghost{padding:14px 18px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--txt-dim);letter-spacing:.5px;transition:.16s var(--ease)}
.btn-ghost:hover{border-color:var(--line-2);color:var(--txt)}

/* DOWN detail state */
.downhero{display:flex;flex-direction:column;align-items:center;gap:var(--s4);padding:var(--s7) var(--s4);text-align:center}
.downhero .glyph{width:70px;height:70px;border-radius:18px;display:grid;place-items:center;border:1px dashed rgba(184,95,95,.4);background:rgba(184,95,95,.05);color:var(--red)}
.downhero .glyph svg{width:34px;height:34px}
.downhero h3{font-size:var(--t-lg);color:var(--txt)}
.downhero p{font-size:var(--t-sm);color:var(--txt-dim);max-width:300px;line-height:1.7}
.downhero .btn-primary{max-width:240px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:70;
  background:var(--bg-3);border:1px solid var(--grn);border-radius:99px;padding:11px 20px;
  font-size:var(--t-sm);color:var(--grn-hot);letter-spacing:.5px;opacity:0;pointer-events:none;
  transition:.26s var(--ease);box-shadow:var(--shadow);display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:15px;height:15px}

/* confirm dialog */
.confirm{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);padding:var(--s4)}
.confirm.open{display:grid}
.confirm .box{max-width:380px;width:100%;border:1px solid var(--red);border-radius:var(--r);background:var(--bg-1);padding:var(--s5);box-shadow:var(--shadow)}
.confirm .box .ch{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.confirm .box .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:rgba(184,95,95,.1);color:var(--red-hot)}
.confirm .box h3{font-size:var(--t-lg);color:var(--txt)}
.confirm .box p{font-size:var(--t-sm);color:var(--txt-dim);line-height:1.7;margin-bottom:var(--s5)}
.confirm .box p b{color:var(--txt)}
.confirm .box .row{display:flex;gap:var(--s2)}
.confirm .box .row button{flex:1;padding:13px;border-radius:var(--r-sm);letter-spacing:.5px;transition:.16s var(--ease)}
.confirm .box .row .no{border:1px solid var(--line);color:var(--txt-dim)}
.confirm .box .row .no:hover{border-color:var(--line-2);color:var(--txt)}
.confirm .box .row .yes{background:var(--red);color:#1a0808;font-weight:700}
.confirm .box .row .yes:hover{background:var(--red-hot)}

.fadein{animation:fade .3s var(--ease)}
</style>

/* =========================================================================
   GENERATED ART  (gradient ground + per-game key-art scene, per game hue)
   Drawn in a 0 0 320 128 box and `slice`-fitted so it works as a tile header
   AND as the full-bleed detail hero. Pure inline SVG — stays offline.
   ========================================================================= */
function artScene(id, c){
  // iso voxel cube at top-apex (x,y), edge e
  const cube = (x,y,e)=>`
    <polygon points="${x},${y} ${x+e},${y+e/2} ${x},${y+e} ${x-e},${y+e/2}" fill="${c.hi}" fill-opacity=".72"/>
    <polygon points="${x-e},${y+e/2} ${x},${y+e} ${x},${y+2*e} ${x-e},${y+e/2+e}" fill="${c.mid}" fill-opacity=".66"/>
    <polygon points="${x+e},${y+e/2} ${x},${y+e} ${x},${y+2*e} ${x+e},${y+e/2+e}" fill="${c.dark}" fill-opacity=".82"/>`;
  // cog (dashed-stroke ring reads as teeth)
  const gear = (cx,cy,r)=>`
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.mid}" stroke-width="7" stroke-dasharray="7 8" stroke-opacity=".8"/>
    <circle cx="${cx}" cy="${cy}" r="${r-8}" fill="none" stroke="${c.mid}" stroke-width="2" stroke-opacity=".55"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="${c.hi}"/>`;
  switch(id){
    case 'mc':   // Minecraft — iso voxel terrain
      return `${cube(96,70,16)}${cube(128,70,16)}${cube(160,70,16)}${cube(128,38,16)}`;
    case 'fac':  // Factorio — gears + conveyor chevrons
      return `${gear(118,60,30)}${gear(176,84,22)}
        <g stroke="${c.hi}" stroke-width="3" stroke-opacity=".5" fill="none" stroke-linecap="round">
          <path d="M214 104 l10 -8 l-10 -8"/><path d="M234 104 l10 -8 l-10 -8"/><path d="M254 104 l10 -8 l-10 -8"/></g>`;
    case 'cs':   // CS2 — crosshair + map lines + C4
      return `
        <g stroke="${c.mid}" stroke-width="2" stroke-opacity=".35" fill="none"><path d="M16 112 L128 18"/><path d="M58 118 L184 26"/></g>
        <g stroke="${c.hi}" stroke-width="3" stroke-opacity=".85" stroke-linecap="round">
          <path d="M189 64 H207"/><path d="M221 64 H239"/><path d="M214 39 V57"/><path d="M214 71 V89"/></g>
        <circle cx="214" cy="64" r="2.5" fill="${c.hi}"/>
        <rect x="30" y="86" width="34" height="22" rx="3" fill="${c.dark}" fill-opacity=".7" stroke="${c.mid}" stroke-opacity=".5"/>
        <circle cx="38" cy="94" r="3" fill="#ff5555"><animate attributeName="opacity" values="1;.15;1" dur="1.3s" repeatCount="indefinite"/></circle>`;

/* =========================================================================
   COPY + TOAST
   ========================================================================= */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1600);
}
function copyJoin(str, el){
  const done=()=>{ if(el){el.classList.add('copied'); setTimeout(()=>el.classList.remove('copied'),1100);} toast('Copied · '+str); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(done).catch(()=>fallbackCopy(str,done));
  } else fallbackCopy(str,done);
}
function fallbackCopy(str,cb){
  const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta); cb&&cb();
}

/* =========================================================================
   WIRE DETAIL
   ========================================================================= */
function wireDetail(s){
  document.getElementById('dClose').addEventListener('click',closeDetail);

  // tabs
  const tabs = detail.querySelectorAll('#dTabs button');
  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('on')); t.classList.add('on');
    detail.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.dataset.pane===t.dataset.pane));
    detail.querySelector('.dbody').scrollTop = 0;
  }));

  // copy join (overview)
  const dJoin = detail.querySelector('#dJoin');
  if(dJoin) dJoin.addEventListener('click',()=>copyJoin(s.join, dJoin));

  // power buttons
  detail.querySelectorAll('[data-pw]').forEach(b=>b.addEventListener('click',()=>{
    const act = b.dataset.pw;
    if(b.dataset.confirm){ showConfirm(s,act); return; }
    pulse(b); toast(act+' · '+s.name);
    if(act==='Restart'||act==='Start') logLine('sys', act+'ing container…');
  }));

  // quick actions
  detail.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('t')){ b.classList.toggle('on'); }
    pulse(b); logLine('ok', s.name+' → '+b.dataset.act); toast(b.dataset.act);
  }));

  // sliders
  detail.querySelectorAll('input[type=range]').forEach(r=>{
    r.addEventListener('input',()=>{
      const v = document.getElementById(r.id+'_v');
      const unit=r.dataset.unit; let val=r.value;
      if(unit==='×') val=parseFloat(val).toFixed(1);
      v.textContent = val+unit;
    });
    r.addEventListener('change',()=>{ logLine('ok', r.dataset.lbl+' = '+r.value); });
  });

  // change map
  const cm = detail.querySelector('[data-changemap]');
  if(cm) cm.addEventListener('click',()=>{
    const m = detail.querySelector('#rtMap').value;
    pulse(cm); logLine('sys','changelevel '+m); toast('Loading '+m);
  });

  // console
  const form = detail.querySelector('#cForm');
  if(form){
    seedConsole(s);
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const inp = detail.querySelector('#cInput'); const cmd = inp.value.trim();
      if(!cmd) return;
      logLine('cmd', cmd); inp.value='';
      respond(s, cmd);
    });
  }

  // profiles select
  detail.querySelectorAll('#profSel button').forEach(b=>b.addEventListener('click',()=>{
    detail.querySelectorAll('#profSel button').forEach(x=>{x.classList.remove('on'); x.querySelector('small').textContent='saved';});
    b.classList.add('on'); b.querySelector('small').textContent='active';
    toast('Loaded profile · '+b.dataset.prof);
  }));

  // toggles
  detail.querySelectorAll('[data-tog]').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));

  // apply / save
  detail.querySelectorAll('[data-apply]').forEach(b=>b.addEventListener('click',()=>{
    pulse(b); toast('Applied — restarting '+s.name); logLine('sys','applying config + restart…');
  }));
  // revert
  const rv = detail.querySelector('[data-revert]');
  if(rv) rv.addEventListener('click',()=>{ detail.querySelector('#rawTa').value = sampleCfg(s); toast('Reverted'); });

  // import
  const imp = detail.querySelector('[data-import]');
  if(imp) imp.addEventListener('click',()=>{
    const v = detail.querySelector('#wsInput').value.trim();
    if(!v){ toast('Enter a collection ID'); return; }
    pulse(imp); toast('Importing collection '+v); detail.querySelector('#wsInput').value='';
  });
}

function pulse(el){ el.animate([{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:140,easing:'ease'}); }

/* =========================================================================
   CONSOLE LOGIC
   ========================================================================= */
function nowTs(){ const d=new Date(); return d.toTimeString().slice(0,8); }
function logLine(kind, text){
  const out = detail.querySelector('#cOut'); if(!out) return;
  const ln = document.createElement('div'); ln.className='ln';
  if(kind==='cmd') ln.innerHTML = `<span class="ts">${nowTs()}</span> <span class="ok">&gt;</span> ${esc(text)}`;
  else if(kind==='sys') ln.innerHTML = `<span class="ts">${nowTs()}</span> <span class="sys">»</span> ${esc(text)}`;
  else if(kind==='err') ln.innerHTML = `<span class="ts">${nowTs()}</span> <span class="err">✕</span> ${esc(text)}`;
  else ln.innerHTML = `<span class="ts">${nowTs()}</span> <span class="ok">«</span> ${esc(text)}`;
  out.appendChild(ln); out.scrollTop = out.scrollHeight;
}
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function seedConsole(s){
  const out = detail.querySelector('#cOut'); out.innerHTML='';
  logLine('sys','connected · rcon '+s.join.replace(/^connect /,''));
  logLine('out','hostname: Gamertown · '+s.name);
  logLine('out','map: '+s.map+'   players: '+(s.players!=null?s.players:0)+(s.cap?'/'+s.cap:''));
}
function respond(s, cmd){
  const c = cmd.toLowerCase();
  if(c==='status'){
    logLine('out','hostname : Gamertown · '+s.name);
    logLine('out','map      : '+s.map);
    logLine('out','players  : '+(s.players||0)+(s.cap?'/'+s.cap:''));
    logLine('out','cpu      : '+s.cpu+'%   ram: '+s.ram+'G');
  } else if(c==='help'){
    logLine('out','commands: status · changelevel <map> · say <msg> · '+s.actions.map(a=>a.toLowerCase().replace(/\s/g,'_')).join(' · '));
  } else if(c.startsWith('say ')){
    logLine('ok','[ALL] server: '+cmd.slice(4));
  } else if(c.startsWith('changelevel ')){
    logLine('sys','changelevel '+cmd.slice(12)+' …');
  } else if(c==='clear'){
    detail.querySelector('#cOut').innerHTML='';
  } else {
    logLine('out','» '+cmd+' : ok');
  }
}

/* =========================================================================
   CONFIRM (destructive)
   ========================================================================= */
const confirmEl = document.getElementById('confirm');
let confirmAction = null;
function showConfirm(s, act){
  document.getElementById('cfTitle').textContent = act+'?';
  document.getElementById('cfMsg').innerHTML = `This force-kills <b>${s.name}</b> immediately — active players are dropped and unsaved state may be lost. This can't be undone.`;
  document.getElementById('cfYes').textContent = act;
  confirmAction = ()=>{ toast(act+' · '+s.name); logLine('err',act+' issued — SIGKILL'); };
  confirmEl.classList.add('open');
}
function hideConfirm(){ confirmEl.classList.remove('open'); confirmAction=null; }
document.getElementById('cfNo').addEventListener('click',hideConfirm);
confirmEl.addEventListener('click',e=>{ if(e.target===confirmEl) hideConfirm(); });
document.getElementById('cfYes').addEventListener('click',()=>{ if(confirmAction) confirmAction(); hideConfirm(); });

/* =========================================================================
   BOOT  +  live ticker (subtle, makes it feel alive)
   ========================================================================= */
renderFeed();
renderEvFilter();
renderEvents('all');

// gentle CPU jitter on hosting cards so the feed feels live (no layout thrash)
setInterval(()=>{
  document.querySelectorAll('.card:not(.down) .dualbar .seg i.cpu').forEach(bar=>{
    const cur = parseFloat(bar.style.width)||10;
    const next = Math.max(1, Math.min(60, cur + (Math.random()*6-3)));
    bar.style.width = next.toFixed(0)+'%';
  });
}, 2600);
</script>
