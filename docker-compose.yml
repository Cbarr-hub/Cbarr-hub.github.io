# Gamertown portable app stack: Fastify backend + Caddy static/reverse proxy.
#
# App/Caddy secrets come from a host-side file outside the repo, defaulting to
# /etc/gamertown/secrets.env. The file is optional so first-run bootstrap can
# create it after Compose parses the project; missing game-control secrets degrade
# the relevant API instead of preventing the app from starting.

services:
  app:
    build:
      context: ./backend
      # Pin the production runtime stage. The Dockerfile's LAST stage is `dev`
      # (nodemon, runs as root), so without an explicit target Compose would
      # build that here. docker-compose.dev.yml overrides target: dev for local.
      target: runtime
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
      - path: ${GT_SECRETS_FILE:-/etc/gamertown/secrets.env}
        required: false
    environment:
      NODE_ENV: production
      # Bind all interfaces inside the app container so Caddy reaches app:3000.
      # No host port is published, so :3000 stays private to the compose network.
      HOST: 0.0.0.0
    volumes:
      - gt-data:/app/data        # SQLite DB + session key survives redeploys.
    expose:
      - "3000"                   # internal only; Caddy reaches it as app:3000.

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    env_file:
      - path: ${GT_SECRETS_FILE:-/etc/gamertown/secrets.env}
        required: false
    ports:
      - "443:443"                # AT&T blocks :80, so HTTPS only.
    volumes:
      - caddy_data:/data         # issued certs / Caddy state.
      - caddy_config:/config
      # Real TLS certs when CADDY_TLS points at this path; otherwise Caddyfile's
      # `tls internal` default applies.
      - ${GT_CERTS_DIR:-/etc/gamertown/certs}:/etc/caddy/certs:ro
    depends_on:
      - app

volumes:
  gt-data:
  caddy_data:
  caddy_config:
